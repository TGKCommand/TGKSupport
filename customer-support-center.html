<style>
/* ============================================================
   BRANDING — matched to tgkmotorsport.com's live header/nav
   (dark navy header, teal wordmark, orange CTA) rather than the
   internal ERP's palette, so this drops into the storefront
   without looking like a different app.
   ============================================================ */
.tgk-support-center,.tgk-support-center *,.tgk-support-center *::before,.tgk-support-center *::after{box-sizing:border-box;margin:0;padding:0}
.tgk-support-center{
  --navy:#141b25;--navy2:#1c2531;
  --teal:#2dd4bf;--teal-d:#14b8a6;
  --orange:#ea580c;--orange-d:#c2410c;
  --bg:#ffffff;--bg2:#f7f8fa;--bg3:#f0f2f5;
  --border:#e2e6eb;--border2:#c8cdd5;
  --text:#111827;--text2:#374151;--text3:#6b7280;
  --red:#dc2626;--red-dim:rgba(220,38,38,.09);
  --green:#16a34a;--green-dim:rgba(22,163,74,.1);
  --yellow-dim:rgba(217,119,6,.1);--yellow-d:#b45309;
  --r:6px;--r-lg:10px;--font:'DM Sans',sans-serif;
  font-family:var(--font);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.tgk-support-center h1,.tgk-support-center h2,.tgk-support-center p,.tgk-support-center ul{margin:0;padding:0}

.tgk-support-center .wrap{max-width:820px;margin:0 auto;padding:28px 20px 80px}
.tgk-support-center .tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--border)}
.tgk-support-center .tab-btn{padding:11px 16px;font-size:13px;font-weight:600;border:none;background:transparent;color:var(--text3);cursor:pointer;transition:color .15s,border-color .15s;border-bottom:2px solid transparent;margin-bottom:-1px}
.tgk-support-center .tab-btn:hover{color:var(--navy)}
.tgk-support-center .tab-btn.active{color:var(--navy);border-bottom-color:var(--orange);font-weight:700}
.tgk-support-center .card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px 28px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);position:relative;overflow:hidden}
.tgk-support-center .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--orange) 60%,transparent)}
.tgk-support-center h1{font-size:20px;font-weight:800;margin-bottom:6px;color:var(--navy)}
.tgk-support-center h2{font-size:14.5px;font-weight:700;margin-bottom:10px;color:var(--navy)}
.tgk-support-center .sub{font-size:13px;color:var(--text3);margin-bottom:20px}
.tgk-support-center .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tgk-support-center .form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.tgk-support-center .form-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.tgk-support-center .form-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:10px 12px;font-size:14px;outline:none;transition:border-color .15s;font-family:inherit}
.tgk-support-center .form-input:focus{border-color:var(--teal)}
.tgk-support-center textarea.form-input{resize:vertical;min-height:100px}
.tgk-support-center .req{color:var(--red)}
.tgk-support-center .btn{display:inline-flex;align-items:center;gap:6px;padding:11px 22px;font-size:13.5px;font-weight:700;border:none;border-radius:var(--r);background:var(--orange);color:#fff;cursor:pointer;transition:background-color .15s,box-shadow .15s,transform .1s;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tgk-support-center .btn:hover{background:var(--orange-d);box-shadow:0 2px 6px rgba(0,0,0,.16);transform:translateY(-1px)}
.tgk-support-center .btn:active{transform:translateY(0);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tgk-support-center .btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.tgk-support-center .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.tgk-support-center .btn-dark{background:var(--navy)}
.tgk-support-center .btn-dark:hover{background:#0d131b}
.tgk-support-center .callout{font-size:12.5px;border-radius:var(--r);padding:10px 12px;margin-bottom:18px;background:var(--yellow-dim);color:var(--yellow-d);font-weight:600}

.tgk-support-center .status-msg.ok{display:block;background:var(--green-dim);color:var(--green)}
.tgk-support-center .status-msg.err{display:block;background:var(--red-dim);color:var(--red)}

.tgk-support-center .footer-note{text-align:center;margin-top:6px;font-size:11px;color:var(--text3)}

.tgk-support-center .form-input.bad{border-color:var(--red);background:var(--red-dim)}

.tgk-support-center .opt{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:13.5px;font-weight:500;color:var(--text2);transition:border-color .15s,background-color .15s}

.tgk-support-center .opt input{width:15px;height:15px;margin:1px 0 0;accent-color:var(--teal-d);cursor:pointer;flex:none}
.tgk-support-center .drop{border:1.5px dashed var(--border2);border-radius:var(--r-lg);background:var(--bg2);padding:22px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background-color .15s}
.tgk-support-center .drop:hover,.tgk-support-center .drop.over{border-color:var(--teal);background:rgba(45,212,191,.07)}
.tgk-support-center .drop .dt{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:4px}
.tgk-support-center .drop .ds{font-size:11.5px;color:var(--text3)}
.tgk-support-center .drop .browse{display:inline-block;margin-top:11px;padding:7px 16px;font-size:12.5px;font-weight:700;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--navy)}

.tgk-support-center .fileitem{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:7px 11px;color:var(--text2)}

function renderTabs(active){

/* ---------------- Shared anti-spam block (honeypot + timing + math), same approach as tgk_ticket_form.html ---------------- */
const spamState = {};
function spamGuardHtml(prefix){
  return `
    <div style="position:absolute;left:-9999px;top:-9999px" aria-hidden="true">
      <label>Leave this field blank</label>
      <input type="text" id="${prefix}-website" tabindex="-1" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label">Quick check: what is <span id="${prefix}-mathLabel">?</span>? <span class="req">*</span></label>
      <input class="form-input" id="${prefix}-mathAnswer" type="number" inputmode="numeric">
    </div>`;
}
function initSpamGuard(prefix){
  if(!prefix) return;
  const label = document.getElementById(`${prefix}-mathLabel`);
  if(!label) return;
  const a = Math.floor(Math.random()*8)+2, b = Math.floor(Math.random()*8)+2;
  label.textContent = `${a} + ${b}`;
  spamState[prefix] = { loadedAt: Date.now(), a, b };
}
function passesSpamGuard(prefix, errEl){
  const st = spamState[prefix];
  if(!st){
    // Should not happen now that goPage translates the prefix, but fail closed
    // and re-arm the guard rather than throwing and silently losing the submit.
    initSpamGuard(prefix);
    errEl.textContent = 'Please answer the quick check question below, then submit again.';
    return false;
  }
  const hp = document.getElementById(`${prefix}-website`);
  const honeypot = hp ? hp.value.trim() : '';
  if(honeypot){ errEl.textContent = 'Something went wrong. Please try again.'; return false; }
  if(Date.now() - st.loadedAt < 2500){ errEl.textContent = 'Please take a moment to review the form before submitting.'; return false; }
  const answer = parseInt(document.getElementById(`${prefix}-mathAnswer`).value, 10);
  if(answer !== st.a + st.b){ errEl.textContent = 'That answer does not look right — please check the math question.'; return false; }
  return true;
}

/* ---------------- Shared attachment upload, same bucket/pattern as tgk_ticket_form.html ---------------- */
async function uploadAttachments(files){
  const attachments = [];
  for(const file of files){
    const path = `${Date.now()}_${Math.random().toString(36).slice(2)}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    const { error: upErr } = await sb.storage.from('ticket-attachments').upload(path, file);
    if(upErr){ console.warn('Attachment upload failed:', upErr.message); continue; }
    const { data: pub } = sb.storage.from('ticket-attachments').getPublicUrl(path);
    attachments.push({ name: file.name, url: pub.publicUrl });
  }
  return attachments;
}

/* ---------------- Track / History ---------------- */
async function trackOrder(){
  const order = document.getElementById('trkOrder').value.trim();
  const email = document.getElementById('trkEmail').value.trim();
  const box = document.getElementById('trkResult');
  if(!order || !email){ box.innerHTML = '<div class="status-msg err" style="display:block">Enter both an order number and email.</div>'; return; }
  box.innerHTML = '<p class="sub">Looking up order…</p>';

  const shopifyOrders = await fetchShopifyOrders(null);
  const match = shopifyOrders.find(o => o.order_number === order || o.name === order);

  let ticketHtml = '';
  try{
    const { data: tickets } = await sb.from('tickets')
      .select('ticket_number,status,subject,created_at')
      .eq('order_number', order).ilike('customer_email', email)
      .order('created_at', { ascending:false }).limit(5);
    if(tickets && tickets.length){
      ticketHtml = `<h2 style="margin-top:18px">Related Support Tickets</h2>` + tickets.map(t => `
        <div class="order-item">
          <div><strong>#${t.ticket_number}</strong> — ${escapeHtml(t.subject||'')}</div>
          <span class="badge ${t.status}">${(t.status||'').replace(/_/g,' ')}</span>
        </div>`).join('');
    }
  }catch(e){ /* RLS may block anon select until policies are set — expected */ }

  box.innerHTML = (match
    ? `<div class="order-item"><div><strong>Order ${order}</strong><div class="meta">${match.fulfillment_status||'—'}</div></div>
        ${match.tracking_url ? `<a class="btn" href="${match.tracking_url}" target="_blank">Track Package</a>` : ''}</div>`
    : `<div class="status-msg err" style="display:block">Shopify order lookup isn't connected yet — needs the Customer Account API wired in (see code comments).</div>`
  ) + ticketHtml;
}
window.trackOrder = trackOrder;

/* ---------------- Submit a Return -> real Supabase ticket (matches tgk_ticket_form.html schema) ---------------- */
async function submitReturn(){
  const errEl = document.getElementById('ret-status');
  const btn = document.getElementById('ret-submitBtn');
  errEl.className = 'status-msg'; errEl.style.display='none'; errEl.textContent='';

  const name = document.getElementById('ret-name').value.trim();
  const email = document.getElementById('ret-email').value.trim();
  const order = document.getElementById('ret-order').value.trim();
  const pn = document.getElementById('ret-pn').value.trim();
  const message = document.getElementById('ret-message').value.trim();
  const files = Array.from(document.getElementById('ret-files').files||[]);

  if(!name || !email || !order || !message){
    errEl.className='status-msg err'; errEl.style.display='block'; errEl.textContent='Name, email, order number, and reason are required.'; return;
  }
  if(!passesSpamGuard('ret', errEl)){ errEl.className='status-msg err'; errEl.style.display='block'; return; }

  btn.disabled = true; btn.textContent = 'Submitting...';
  try{
    const attachments = await uploadAttachments(files);
    const { data: ticket, error } = await sb.from('tickets').insert({
      source: 'website', status: 'open', priority: 'medium',
      subject: `Return request — order ${order}`,
      description: message,
      customer_name: name, customer_email: email,
      order_number: order, pn: pn || null,
      attachments, has_unread: true, unread_count: 1
    }).select().single();
    if(error) throw error;

    errEl.className = 'status-msg ok'; errEl.style.display='block';
    errEl.textContent = `Return request submitted (ticket #${ticket.ticket_number}). We'll follow up at ${email}.`;
    ['ret-name','ret-email','ret-order','ret-pn','ret-message'].forEach(id => document.getElementById(id).value='');
    btn.textContent = 'Submit Return Request'; btn.disabled = false;
  }catch(e){
    errEl.className = 'status-msg err'; errEl.style.display='block';
    errEl.textContent = 'Something went wrong: ' + (e.message||'unknown error');
    btn.textContent = 'Submit Return Request'; btn.disabled = false;
  }
}
window.submitReturn = submitReturn;

/* ---------------- Wholesale application: post-render wiring ---------------- */
function wsRenderFileList(){
  const box = document.getElementById('ws-filelist');
  if(!box) return;
  box.innerHTML = wsFiles.map((f,i) =>
    `<div class="fileitem"><span>${escapeHtml(f.name)} (${(f.size/1024/1024).toFixed(2)} MB)</span>`
    + `<button type="button" onclick="wsRemoveFile(${i})" aria-label="Remove file">Remove</button></div>`
  ).join('');
}
function wsRemoveFile(i){
  wsFiles.splice(i,1);
  wsRenderFileList();
}
window.wsRemoveFile = wsRemoveFile;

function wsAddFiles(list){
  const errEl = document.getElementById('ws-status');
  const rejected = [];
  Array.from(list||[]).forEach(function(f){
    if(wsFiles.length >= WS_PERMIT_MAXCOUNT){ rejected.push(f.name + ' (limit of ' + WS_PERMIT_MAXCOUNT + ' files reached)'); return; }
    if(WS_PERMIT_TYPES.indexOf(f.type) === -1){ rejected.push(f.name + ' (unsupported format)'); return; }
    if(f.size > WS_PERMIT_MAX){ rejected.push(f.name + ' (over 10 MB)'); return; }
    if(wsFiles.some(function(x){ return x.name === f.name && x.size === f.size; })) return;
    wsFiles.push(f);
  });
  wsRenderFileList();
  if(rejected.length && errEl){
    errEl.className = 'status-msg err';
    errEl.textContent = 'Could not attach: ' + rejected.join('; ') + '.';
  }
}

function initWholesale(){
  wsFiles = [];
  wsRenderFileList();

  const card = document.getElementById('ws-card');
  if(!card) return;

  // Highlight selected radio/checkbox rows, and reveal the "Other" business-type field.
  card.addEventListener('change', function(e){
    const el = e.target;
    if(!el || (el.type !== 'radio' && el.type !== 'checkbox')) return;
    const group = el.closest('.opts');
    if(group){
      group.classList.remove('bad');
      Array.from(group.querySelectorAll('.opt')).forEach(function(lab){
        const inp = lab.querySelector('input');
        lab.classList.toggle('on', !!(inp && inp.checked));
      });
    }
    if(el.name === 'ws-biztype'){
      const other = document.getElementById('ws-biztype-other');
      const on = wsChecked('ws-biztype').indexOf('Other') !== -1;
      if(other){
        other.style.display = on ? 'block' : 'none';
        if(!on){ other.value = ''; other.classList.remove('bad'); }
      }
    }
  });

  // Clear the invalid state as soon as the visitor starts fixing a field.
  card.addEventListener('input', function(e){
    if(e.target && e.target.classList) e.target.classList.remove('bad');
  });

  // EIN convenience formatting: only when the value is purely numeric, so a
  // non-US tax ID containing letters is left exactly as the visitor typed it.
  const ein = document.getElementById('ws-ein');
  if(ein) ein.addEventListener('input', function(){
    if(/[^0-9-]/.test(ein.value)) return;
    const d = ein.value.replace(/\D/g,'').slice(0,9);
    ein.value = d.length > 2 ? d.slice(0,2) + '-' + d.slice(2) : d;
  });

  const code = document.getElementById('ws-code');
  if(code) code.addEventListener('input', function(){
    code.value = code.value.toUpperCase().replace(/[^A-Z0-9-]/g,'');
  });

  // Dropzone
  const drop = document.getElementById('ws-drop');
  const input = document.getElementById('ws-permit');
  if(drop && input){
    drop.addEventListener('click', function(){ input.click(); });
    drop.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); input.click(); }
    });
    input.addEventListener('change', function(){ wsAddFiles(input.files); input.value = ''; });
    ['dragenter','dragover'].forEach(function(ev){
      drop.addEventListener(ev, function(e){ e.preventDefault(); e.stopPropagation(); drop.classList.add('over'); });
    });
    ['dragleave','drop'].forEach(function(ev){
      drop.addEventListener(ev, function(e){ e.preventDefault(); e.stopPropagation(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function(e){
      if(e.dataTransfer && e.dataTransfer.files) wsAddFiles(e.dataTransfer.files);
    });
  }
}

   Lands in the same `tickets` table as every other form here, so it shows up in the
   Support Center inbox with no schema change and no new RLS policy. The full field
   set is written into `description` as readable text rather than being dropped. */
const WS_REQUIRED = [
  ['ws-legal','Legal Business Name'],
  ['ws-dba','Doing Business As (DBA)'],
  ['ws-ein','Employer Identification Number (EIN)'],
  ['ws-weburl','Website URL'],
  ['ws-first','First Name'],

  ['ws-phone','Telephone No.'],
  ['ws-addr1','Street Address Line 1'],
  ['ws-city','City'],
  ['ws-state','State'],
  ['ws-zip','Zip Code'],
  ['ws-country','Country'],
  ['ws-code','Discount Code'],
  ['ws-sig','Electronic Signature']
];
const WS_GROUPS = [
  ['ws-biztype','Business Type'],
  ['ws-years','How Long Have You Been In Business?'],
  ['ws-turnover','Expected Annual Turnover'],
  ['ws-tier','Which Tier Are You Applying For?']
];

function wsVal(id){
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}
function wsFail(errEl, msg, firstBad){
  errEl.className = 'status-msg err';
  errEl.textContent = msg;
  if(firstBad){
    firstBad.classList.add('bad');
    if(typeof firstBad.scrollIntoView === 'function'){
      try{ firstBad.scrollIntoView({ behavior:'smooth', block:'center' }); }catch(e){}
    }
    if(firstBad.tagName !== 'DIV' && typeof firstBad.focus === 'function'){
      try{ firstBad.focus({ preventScroll:true }); }catch(e){}
    }
  }
  return false;
}

async function submitWholesale(){
  const errEl = document.getElementById('ws-status');
  const btn = document.getElementById('ws-submitBtn');
  errEl.className = 'status-msg'; errEl.textContent = '';
  Array.from(document.querySelectorAll('#ws-card .bad')).forEach(el => el.classList.remove('bad'));

  /* --- required fields --- */
  const missing = [];
  let firstBad = null;
  WS_REQUIRED.forEach(function(pair){
    const el = document.getElementById(pair[0]);
    if(el && !el.value.trim()){
      missing.push(pair[1]);
      el.classList.add('bad');
      if(!firstBad) firstBad = el;
    }
  });
  WS_GROUPS.forEach(function(pair){
    if(!wsChecked(pair[0]).length){
      missing.push(pair[1]);
      const g = document.getElementById(pair[0] + '-group');
      if(g){ g.classList.add('bad'); if(!firstBad) firstBad = g; }
    }
  });
  const bizTypes = wsChecked('ws-biztype');
  const bizOther = wsVal('ws-biztype-other');
  if(bizTypes.indexOf('Other') !== -1 && !bizOther){
    missing.push('Business Type (please describe "Other")');
    const el = document.getElementById('ws-biztype-other');
    if(el){ el.classList.add('bad'); if(!firstBad) firstBad = el; }
  }
  if(missing.length){
    return wsFail(errEl, 'Please complete the following required field'
      + (missing.length > 1 ? 's' : '') + ': ' + missing.join(', ') + '.', firstBad);
  }

  /* --- format checks --- */
  const legal = wsVal('ws-legal'), dba = wsVal('ws-dba'), ein = wsVal('ws-ein');
  const first = wsVal('ws-first'), last = wsVal('ws-last');
  const email = wsVal('ws-email'), apEmail = wsVal('ws-apemail'), phone = wsVal('ws-phone');
  const addr1 = wsVal('ws-addr1'), addr2 = wsVal('ws-addr2'), city = wsVal('ws-city');
  const state = wsVal('ws-state'), zip = wsVal('ws-zip'), country = wsVal('ws-country');
  const shipInfo = wsVal('ws-shipinfo'), hear = wsVal('ws-hear'), website = wsVal('ws-weburl');
  const code = wsVal('ws-code'), sig = wsVal('ws-sig');
  const years = wsChecked('ws-years')[0], turnover = wsChecked('ws-turnover')[0];
  const tier = wsChecked('ws-tier')[0];

  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  if(!emailRe.test(email)){
    return wsFail(errEl, 'Please enter a valid email address.', document.getElementById('ws-email'));
  }
  if(apEmail && !emailRe.test(apEmail)){
    return wsFail(errEl, 'Please enter a valid accounts payable email address, or leave it blank.', document.getElementById('ws-apemail'));
  }
  if(phone.replace(/\D/g,'').length < 7){
    return wsFail(errEl, 'Please enter a valid telephone number, including the country code if international.', document.getElementById('ws-phone'));
  }
  // EIN is a US-specific identifier, so only enforce the 9-digit shape for US applicants.
  if(country === 'United States' && ein.replace(/\D/g,'').length !== 9){
    return wsFail(errEl, 'A US EIN is nine digits (for example 12-3456789). Please check the number entered.', document.getElementById('ws-ein'));
  }
  if(code.length < 3){
    return wsFail(errEl, 'Please enter a discount code of at least 3 characters (letters, numbers and dashes only).', document.getElementById('ws-code'));
  }
  const sigLc = sig.toLowerCase();
  if(sigLc.indexOf(first.toLowerCase()) === -1 || sigLc.indexOf(last.toLowerCase()) === -1){
    return wsFail(errEl, 'Your electronic signature must match the first and last name entered above.', document.getElementById('ws-sig'));
  }
  if(!passesSpamGuard('ws', errEl)){ errEl.className = 'status-msg err'; return false; }

  /* --- build the application record --- */
  const typeList = bizTypes.map(function(t){ return t === 'Other' ? 'Other: ' + bizOther : t; }).join(', ');
  const L = [];
  L.push('WHOLESALE ACCOUNT APPLICATION');
  L.push('');
  L.push('-- BUSINESS --');
  L.push('Legal Business Name: ' + legal);
  L.push('Doing Business As (DBA): ' + dba);
  L.push('EIN / Tax ID: ' + ein);
  L.push('Business Type: ' + typeList);
  L.push('Website URL: ' + website);
  L.push('Time In Business: ' + years);
  L.push('Expected Annual Turnover: ' + turnover);
  L.push('Requested Buy-In Tier: ' + tier);
  L.push('Requested Discount Code: ' + code);
  L.push('');
  L.push('-- CONTACT --');
  L.push('Name: ' + first + ' ' + last);
  L.push('Email: ' + email);
  L.push('Accounts Payable Email: ' + (apEmail || '(not provided)'));
  L.push('Telephone: ' + phone);
  L.push('');
  L.push('-- ADDRESS --');
  L.push(addr1);
  if(addr2) L.push(addr2);
  L.push(city + ', ' + state + ' ' + zip);
  L.push(country);
  L.push('');
  L.push('-- ADDITIONAL SHIPPING INFO --');
  L.push(shipInfo || '(none provided)');
  L.push('');
  L.push('-- HOW DID YOU HEAR ABOUT US --');
  L.push(hear || '(not answered)');
  L.push('');
  L.push('-- RESELLERS PERMIT --');
  L.push(wsFiles.length
    ? wsFiles.length + ' file(s) attached to this ticket.'
    : 'Not uploaded. Applicant advised to email a copy prior to their first order.');
  L.push('');
  L.push('-- ELECTRONIC SIGNATURE --');
  L.push('Signed: ' + sig);
  L.push('Date: ' + new Date().toISOString());
  const description = L.join('\n');

  btn.disabled = true; btn.textContent = 'Submitting...';
  try{
    const attachments = await uploadAttachments(wsFiles);
    if(wsFiles.length && !attachments.length){
      throw new Error('the resellers permit upload failed. Please try again, or submit without it and email the permit separately.');
    }
    const { data: ticket, error } = await sb.from('tickets').insert({
      source: 'website', status: 'open', priority: 'low',
      subject: 'Wholesale application - ' + legal,
      description: description,
      customer_name: first + ' ' + last,
      customer_email: email,
      attachments, has_unread: true, unread_count: 1
    }).select().single();
    if(error) throw error;

    wsFiles = [];
    document.getElementById('tgkSupportContent').innerHTML = `
      <div class="card">
        <div class="success">
          <div class="check"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
          <h2>Application received</h2>
          <p>Thank you, ${escapeHtml(first)}. Your wholesale application for <strong>${escapeHtml(legal)}</strong> has been submitted as ticket <strong>#${escapeHtml(String(ticket.ticket_number))}</strong>.<br><br>
          Our wholesale team will review it and follow up at <strong>${escapeHtml(email)}</strong>.${wsAttachNote(attachments.length)}</p>
          <button class="btn btn-dark" style="margin-top:18px" onclick="goPage('wholesale')">Submit Another Application</button>
        </div>
      </div>`;
    window.scrollTo(0,0);
    return true;
  }catch(e){
    btn.textContent = 'Submit Application'; btn.disabled = false;
    return wsFail(errEl, 'Something went wrong: ' + (e.message || 'unknown error'), null);
  }
}
function wsAttachNote(n){
  return n ? '' : '<br><br>Remember to email a copy of your resellers permit before placing your first order.';
}
window.submitWholesale = submitWholesale;

goPage('track');
});
</script>
</body>
</html>
