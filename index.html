/* ---- Response times (v1.92) ----------------------------------------------
   Computed in the database by support_response_times() (see support_reports.sql):
   the clock starts when a customer writes and stops at the first staff
   response; internal notes and staff-created tickets never count. Times are
   wall-clock, so nights and weekends are included -- medians are shown first
   because a single overnight wait skews an average. */
window._respCache = window._respCache || {};
function respKey(b){ return (b.start? b.start.toISOString() : 'all') + '|' + b.end.toISOString().slice(0,13); }
function fmtMins(m){
  if(m==null || isNaN(m)) return '\u2014';
  m = Number(m);
  if(m < 1) return '<1m';
  if(m < 60) return Math.round(m)+'m';
  if(m < 1440){ const h=Math.floor(m/60), r=Math.round(m%60); return h+'h'+(r?' '+r+'m':''); }
  const d=Math.floor(m/1440), h=Math.round((m%1440)/60); return d+'d'+(h?' '+h+'h':'');
}
function median(a){ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y), i=Math.floor(s.length/2); return s.length%2 ? s[i] : (s[i-1]+s[i])/2; }
function avg(a){ return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null; }
function pctWithin(a, lim){ return a.length ? Math.round(100*a.filter(x=>x<=lim).length/a.length)+'%' : '\u2014'; }
const RESP_KIND = { ticket:'Tickets', chat:'Live chat', email:'Emails', order:'Orders' };

async function loadRespTimes(b){
  const k = respKey(b);
  if(window._respCache[k] && window._respCache[k].loading) return;
  window._respCache[k] = { loading:true };
  try{
    const { data, error } = await sb.rpc('support_response_times', { p_from: (b.start || new Date('2000-01-01')).toISOString(), p_to: b.end.toISOString() });
    if(error) throw error;
    window._respCache[k] = { rows: data || [] };
  }catch(e){
    window._respCache[k] = { error: e.message };
  }
  const box = document.getElementById('respTimesBox');
  if(box && S.page==='reports') box.innerHTML = respTimesHtml(b);
}
function respOpen(r){
  if(r.kind==='ticket' || r.kind==='chat') return `<button class="btn btn-sm" onclick="openTicket('${escapeHtml(r.item_id)}')">Open</button>`;
  return `<button class="btn btn-sm" onclick="openEmail('${escapeHtml(r.item_id)}')">Open</button>`;
}
function respTimesHtml(b){
  const c = window._respCache[respKey(b)];
  if(!c){ setTimeout(()=>loadRespTimes(b), 0); return '<div class="panel"><div class="empty">Calculating response times\u2026</div></div>'; }
  if(c.loading) return '<div class="panel"><div class="empty">Calculating response times\u2026</div></div>';
  if(c.error) return `<div class="panel"><div class="empty">Couldn't load response times (${escapeHtml(c.error)}). Run support_reports.sql in Supabase if you haven't.</div></div>`;
  const rows = c.rows;
  const done = rows.filter(r=>r.responded_at), open = rows.filter(r=>!r.responded_at);
  const first = done.filter(r=>r.is_first).map(r=>Number(r.minutes));
  const all = done.map(r=>Number(r.minutes));
  const oldestOpen = open.reduce((m,r)=>Math.max(m, Number(r.minutes)), 0);
  const kinds = ['ticket','chat','email','order'].map(k=>{
    const d = done.filter(r=>r.kind===k);
    return { k, n:d.length, first: median(d.filter(r=>r.is_first).map(r=>Number(r.minutes))), all: median(d.map(r=>Number(r.minutes))), open: open.filter(r=>r.kind===k).length };
  }).filter(x=>x.n || x.open);
  const byStaff = {};
  done.forEach(r=>{ const key = r.responder_email || ''; (byStaff[key] = byStaff[key] || []).push(r); });
  const staffRows = Object.entries(byStaff).map(([em, list])=>{
    const m = list.map(r=>Number(r.minutes));
    return { em, n:list.length, firsts:list.filter(r=>r.is_first).length, med:median(m), av:avg(m), in1h:pctWithin(m,60), slow:Math.max(...m) };
  }).sort((a,b)=>b.n-a.n);
  const slowest = done.slice().sort((a,b)=>Number(b.minutes)-Number(a.minutes)).slice(0,8);
  const waiting = open.slice().sort((a,b)=>Number(b.minutes)-Number(a.minutes)).slice(0,10);
  const who = em => em ? escapeHtml(typeof trackerName==='function' ? trackerName(em) : em) : '<span style="color:var(--text3)">Unattributed</span>';
  const itemCell = r => `<span class="pn">${escapeHtml(r.item_ref||'')}</span> ${escapeHtml((r.subject||'').slice(0,60))} <span class="pill pill-muted">${RESP_KIND[r.kind]||r.kind}</span>`;
  return `
    <div class="kpi-grid kpi-grid-5">
      <div class="kpi kpi-teal"><div class="kpi-label">Median First Response</div><div class="kpi-value">${fmtMins(median(first))}</div><div class="kpi-sub">${first.length} conversations</div></div>
      <div class="kpi"><div class="kpi-label">Avg First Response</div><div class="kpi-value">${fmtMins(avg(first))}</div><div class="kpi-sub">includes nights/weekends</div></div>

/* ============ WHOLESALE APPLICATION VIEW (v1.22) ============
   The storefront form writes wholesale applications into tickets.description as
   a structured text block. Instead of dumping that blob into the panel, parse it
   into labelled fields.

   The parser is deliberately generic: it renders whatever "Key: Value" pairs it
   finds rather than a hardcoded field list, so adding a field to the public form
   needs no change here. Anything it cannot classify is surfaced in a warning box
   and the full original text stays one click away, so no submitted data is ever
   hidden by the formatting.
============================================================ */
const WSA_MARKER = 'WHOLESALE ACCOUNT APPLICATION';
const WSA_KEYED = ['BUSINESS','CONTACT','ELECTRONIC SIGNATURE'];
const WSA_EMPTY = ['(not provided)','(none provided)','(not answered)'];

function isWholesaleApp(desc){
  if(!desc) return false;
  const first = String(desc).split('\n').map(function(l){return l.trim();}).filter(Boolean)[0] || '';
  return first.toUpperCase() === WSA_MARKER;
}

function parseWholesaleApp(desc){
  const res = { keyed:{}, blocks:{}, secOrder:[], unparsed:[] };
  const lines = String(desc||'').split('\n');
  let cur = null;
  for(let i=0;i<lines.length;i++){
    const line = lines[i].trim();
    if(!line) continue;
    if(line.toUpperCase() === WSA_MARKER) continue;
    const head = line.match(/^--\s*(.+?)\s*--$/);
    if(head){
      cur = head[1].trim().toUpperCase();
      if(res.secOrder.indexOf(cur) === -1) res.secOrder.push(cur);
      if(WSA_KEYED.indexOf(cur) !== -1){ if(!res.keyed[cur]) res.keyed[cur] = []; }
      else { if(!res.blocks[cur]) res.blocks[cur] = []; }
      continue;
    }
    if(cur === null){ res.unparsed.push(line); continue; }
    if(WSA_KEYED.indexOf(cur) !== -1){
      const kv = line.match(/^([^:]{1,60}):\s*(.*)$/);
      if(kv) res.keyed[cur].push([kv[1].trim(), kv[2].trim()]);
      else res.unparsed.push(line);
    } else {
      res.blocks[cur].push(line);
    }
  }
  return res;
}

function wsaFind(p, sec, keyPart){
  const rows = p.keyed[sec] || [];
  const needle = keyPart.toLowerCase();
  for(let i=0;i<rows.length;i++){
    if(rows[i][0].toLowerCase().indexOf(needle) !== -1) return rows[i][1];
  }
  return '';
}

function wsaSafeUrl(v){
  const t = String(v||'').trim();
  if(/^https?:\/\//i.test(t)) return t;
  if(/^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}(\/.*)?$/i.test(t)) return 'https://' + t;
  return null;
}

function wsaIsEmpty(v){
  const t = String(v||'').trim();
  return !t || WSA_EMPTY.indexOf(t.toLowerCase()) !== -1;
}

/* Render one value, with light type-awareness (links, code, dates). */
function wsaValue(key, val){
  const k = String(key||'').toLowerCase();
  const v = String(val||'').trim();
  if(wsaIsEmpty(v)) return '<div class="wsa-v" style="color:var(--text3)">' + escapeHtml(v || '--') + '</div>';

  if(k.indexOf('discount code') !== -1)
    return '<div class="wsa-v"><span class="wsa-code">' + escapeHtml(v) + '</span></div>';

  if(k.indexOf('email') !== -1 && /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v))
    return '<div class="wsa-v"><a href="mailto:' + escapeHtml(v) + '">' + escapeHtml(v) + '</a></div>';

  if(k.indexOf('telephone') !== -1 || k.indexOf('phone') !== -1){
    const digits = v.replace(/[^0-9+]/g,'');
    if(digits.length >= 7)
      return '<div class="wsa-v"><a href="tel:' + escapeHtml(digits) + '">' + escapeHtml(v) + '</a></div>';
  }

  if(k.indexOf('website') !== -1 || k.indexOf('url') !== -1){
    const u = wsaSafeUrl(v);
    if(u) return '<div class="wsa-v"><a href="' + escapeHtml(u) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(v) + '</a></div>';
  }

  if(k === 'date'){
    const d = new Date(v);
    if(!isNaN(d.getTime()))
      return '<div class="wsa-v">' + escapeHtml(d.toLocaleString()) + '</div>';
  }

  if(k.indexOf('legal business name') !== -1 || k.indexOf('signed') !== -1)
    return '<div class="wsa-v strong">' + escapeHtml(v) + '</div>';

  if(k.indexOf('ein') !== -1 || k.indexOf('tax id') !== -1)
    return '<div class="wsa-v mono">' + escapeHtml(v) + '</div>';

  return '<div class="wsa-v">' + escapeHtml(v) + '</div>';
}

function renderWholesaleApp(t){
  const p = parseWholesaleApp(t.description);

  const legal = wsaFind(p,'BUSINESS','legal business name');
  const dba = wsaFind(p,'BUSINESS','doing business as');
  const bizType = wsaFind(p,'BUSINESS','business type');
  const years = wsaFind(p,'BUSINESS','time in business');
  const turnover = wsaFind(p,'BUSINESS','turnover');
  const code = wsaFind(p,'BUSINESS','discount code');
  const cName = wsaFind(p,'CONTACT','name');
  const cEmail = wsaFind(p,'CONTACT','email');

  const permitLines = p.blocks['RESELLERS PERMIT'] || [];
  const permitText = permitLines.join(' ');
  const permitMissing = /not uploaded/i.test(permitText);
  const hasFiles = !!(t.attachments && t.attachments.length);

  const addrLines = p.blocks['ADDRESS'] || [];

  /* Clipboard payloads live in a global keyed store - never inlined as JSON in
     an onclick attribute, which breaks HTML parsing. */
  window._wsaClip = {
    address: addrLines.join('\n'),
    email: cEmail,
    code: code,
    all: String(t.description||'')
  };

  const pills = [];
  if(bizType)  pills.push('<span class="pill pill-teal">' + escapeHtml(bizType) + '</span>');
  if(years)    pills.push('<span class="pill pill-muted">In business: ' + escapeHtml(years) + '</span>');
  if(turnover) pills.push('<span class="pill pill-muted">Turnover: ' + escapeHtml(turnover) + '</span>');
  pills.push(permitMissing && !hasFiles
    ? '<span class="pill pill-orange">Permit: not uploaded</span>'
    : '<span class="pill pill-green">Permit: attached</span>');

  let out = '<div class="wsa">';

  /* ---- header ---- */
  out += '<div class="wsa-hd">'
    + '<div class="wsa-hd-t"><span>Wholesale Account Application</span>'
    + '<span class="src-tag">' + escapeHtml(label(t.source)) + '</span></div>'
    + '<div class="wsa-hd-b">' + escapeHtml(legal || dba || t.customer_name || 'Unnamed business') + '</div>'
    + (dba && dba !== legal ? '<div class="wsa-hd-s">Trading as ' + escapeHtml(dba) + '</div>' : '')
    + (cName ? '<div class="wsa-hd-s">' + escapeHtml(cName) + (cEmail ? ' &middot; ' + escapeHtml(cEmail) : '') + '</div>' : '')
    + '<div class="wsa-pills">' + pills.join('') + '</div>'
    + '</div>';

  /* ---- sections, in the order they appear in the submission ---- */
  for(let i=0;i<p.secOrder.length;i++){
    const sec = p.secOrder[i];
    out += '<div class="wsa-sec"><div class="wsa-sec-t">' + escapeHtml(sec) + '</div>';

    if(WSA_KEYED.indexOf(sec) !== -1){
      const rows = p.keyed[sec] || [];
      if(!rows.length){
        out += '<div class="wsa-blk muted">Nothing submitted.</div>';
      } else {
        for(let j=0;j<rows.length;j++){
          out += '<div class="wsa-row"><div class="wsa-k">' + escapeHtml(rows[j][0]) + '</div>'
              +  wsaValue(rows[j][0], rows[j][1]) + '</div>';
        }
      }
    } else if(sec === 'ADDRESS'){
      out += '<div class="wsa-addr">' + escapeHtml(addrLines.join('\n')) + '</div>';
    } else {
      const body = (p.blocks[sec] || []).join('\n');
      out += wsaIsEmpty(body)
        ? '<div class="wsa-blk muted">' + escapeHtml(body || 'Not provided') + '</div>'
        : '<div class="wsa-blk">' + escapeHtml(body) + '</div>';
      if(sec === 'RESELLERS PERMIT' && hasFiles) out += renderAttachments(t.attachments);
    }
    out += '</div>';
  }

  /* Attachments that arrived without a permit section still need somewhere to go. */
  if(hasFiles && !p.blocks['RESELLERS PERMIT']){
    out += '<div class="wsa-sec"><div class="wsa-sec-t">Attachments</div>'
        +  renderAttachments(t.attachments) + '</div>';
  }

  /* ---- anything the parser could not classify ---- */
  if(p.unparsed.length){
    out += '<div class="wsa-warn">' + p.unparsed.length + ' line(s) in this submission were not recognised '
        +  'and are shown here so nothing is lost:<ul>'
        +  p.unparsed.map(function(l){ return '<li>' + escapeHtml(l) + '</li>'; }).join('')
        +  '</ul></div>';
  }

  /* ---- actions ---- */
  out += '<div class="wsa-acts">'
    + (cEmail ? '<button class="wsa-btn" onclick="wsaCopy(\'email\',this)">Copy Email</button>' : '')
    + (addrLines.length ? '<button class="wsa-btn" onclick="wsaCopy(\'address\',this)">Copy Address</button>' : '')
    + (code ? '<button class="wsa-btn" onclick="wsaCopy(\'code\',this)">Copy Code</button>' : '')
    + '<button class="wsa-btn" onclick="wsaCopy(\'all\',this)">Copy All</button>'
    + '<button class="wsa-btn" onclick="wsaToggleRaw(this)">Raw Submission</button>'
    + '</div>';

  out += '<pre class="wsa-raw" id="wsa-raw" style="display:none">' + escapeHtml(String(t.description||'')) + '</pre>';
  out += '</div>';
  return out;
}

function wsaCopy(key, btn){
  const store = window._wsaClip || {};
  const text = store[key] || '';
  const done = function(ok){
    const prev = btn.textContent;
    btn.textContent = ok ? 'Copied' : 'Copy failed';
    btn.classList.toggle('on', !!ok);
    setTimeout(function(){ btn.textContent = prev; btn.classList.remove('on'); }, 1400);
  };
  if(!text){ done(false); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(false); });
    return;
  }
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    done(ok);
  }catch(e){ done(false); }
}
window.wsaCopy = wsaCopy;

function wsaToggleRaw(btn){
  const el = document.getElementById('wsa-raw');
  if(!el) return;
  const show = el.style.display === 'none';
  el.style.display = show ? 'block' : 'none';
  btn.classList.toggle('on', show);
  btn.textContent = show ? 'Hide Raw' : 'Raw Submission';
}
window.wsaToggleRaw = wsaToggleRaw;

/* Subtle who/when tracker shown as a thin strip under the panel header.
   Reads last_viewed_* / last_reply_* off the record. Because openTicket renders
   the panel BEFORE stamping the current viewer, opening a ticket shows you who
   was in it before you (a colleague), which is the useful signal. Reused shape
   for emails/orders later -- same column names on those tables. */
function trackerName(email){
  if(!email) return 'someone';
  return email.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
}
function renderTicketTracker(t){
  if(!t) return '';
  var parts=[];
  if(t.last_reply_at) parts.push('<span title="Last staff reply">Last reply: '+escapeHtml(trackerName(t.last_reply_by))+' \u00b7 '+timeAgo(t.last_reply_at)+'</span>');
  if(t.last_viewed_at) parts.push('<span title="Last opened by a team member">Last viewed: '+escapeHtml(trackerName(t.last_viewed_by))+' \u00b7 '+timeAgo(t.last_viewed_at)+'</span>');
  if(!parts.length) return '<div class="tk-tracker" id="tkTracker"></div>';
  return '<div class="tk-tracker" id="tkTracker">'+parts.join('<span class="tk-tracker-dot">\u2022</span>')+'</div>';
}

function switchThreadTab(mode){
  showingNotes = (mode === 'notes');
  document.getElementById('tabConv').classList.toggle('active', mode==='conv');
  document.getElementById('tabNotes').classList.toggle('active', mode==='notes');
  document.getElementById('tabActivity').classList.toggle('active', mode==='activity');
  const composer = document.getElementById('replyComposer');
  const foot = document.getElementById('tkFoot');
  if(mode === 'activity'){
    if(composer) composer.style.display = 'none';
    if(foot) foot.style.display = 'none';
    document.getElementById('threadBox').innerHTML = renderActivityLog(S.activityLog[S.activeTicket.id]||[]);
  } else {
    if(composer) composer.style.display = '';
    if(foot) foot.style.display = 'flex';
    document.getElementById('threadBox').innerHTML = renderThread(S.messages[S.activeTicket.id]||[], showingNotes);
    scrollThreadToBottom();

    if(composer) composer.setAttribute('data-mode', mode);
    const label = document.getElementById('composerModeLabel');
    const msgBox = document.getElementById('msgBox');
    const emailRow = document.getElementById('emailStatusRow');
    const sendBtn = document.getElementById('sendBtn');
    const t = S.activeTicket;
    if(mode === 'notes'){
      if(label){ label.textContent = 'Writing an Internal Note — staff only, never sent to the customer'; label.style.color = 'var(--orange)'; }
      if(msgBox) msgBox.placeholder = 'Type an internal note...';
      if(emailRow) emailRow.style.display = 'none';
      if(sendBtn){ sendBtn.textContent = 'Add Note'; sendBtn.classList.remove('btn-primary'); sendBtn.classList.add('btn-teal'); }
    } else {
      if(label){ label.textContent = 'Replying in Conversation — visible to customer'; label.style.color = 'var(--text3)'; }
      if(msgBox) msgBox.placeholder = 'Type a reply...';
      if(emailRow) emailRow.style.display = 'flex';
      if(sendBtn){ sendBtn.textContent = 'Send'; sendBtn.classList.remove('btn-teal'); sendBtn.classList.add('btn-primary'); }
    }
  }
}
window.switchThreadTab = switchThreadTab;

async function loadActivityLog(ticketId){
  const { data, error } = await sb.from('ticket_activity_log').select('*').eq('ticket_id', ticketId).order('changed_at',{ascending:false});
  if(!error){
    S.activityLog[ticketId] = data || [];
    const activityTab = document.getElementById('tabActivity');
    if(activityTab && activityTab.classList.contains('active')){
      document.getElementById('threadBox').innerHTML = renderActivityLog(S.activityLog[ticketId]);
    }
  }
}

function renderActivityLog(entries){
  if(!entries.length) return `<div class="empty">No changes logged yet.</div>`;
  const FIELD_LABELS = { status:'Status', priority:'Priority', assigned_to:'Assigned To', tag_added:'Tag Added', tag_removed:'Tag Removed' };
  return entries.map(e=>{
    const fieldLabel = FIELD_LABELS[e.field_changed] || e.field_changed;
    let desc;
    if(e.field_changed==='tag_added') desc = `Added tag "${escapeHtml(e.new_value)}"`;
    else if(e.field_changed==='tag_removed') desc = `Removed tag "${escapeHtml(e.old_value)}"`;
    else desc = `${fieldLabel} changed from "${escapeHtml(e.old_value||'—')}" to "${escapeHtml(e.new_value||'—')}"`;
    return `<div class="msg system">
      <div class="meta"><span>${escapeHtml(e.changed_by||'System')}</span><span>·</span><span>${timeAgo(e.changed_at)}</span></div>
      <div>${desc}</div>
    </div>`;
  }).join('');
}

function scrollThreadToBottom(){
  const box = document.getElementById('threadBox');
  if(box) box.scrollTop = box.scrollHeight;
}

function renderAttachments(attachments){
  if(!attachments || !attachments.length) return '';
  return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
    ${attachments.map(a=>{
      const isImg = /\.(png|jpe?g|gif|webp)$/i.test(a.url||a.name||'');
      return isImg
        ? `<a href="${a.url}" target="_blank"><img src="${a.url}" alt="${escapeHtml(a.name||'attachment')}" style="width:72px;height:72px;object-fit:cover;border-radius:var(--r-md);border:1px solid var(--border)"></a>`
        : `<a href="${a.url}" target="_blank" class="src-tag"><span class="ic ic-link"></span>${escapeHtml(a.name||'file')}</a>`;
    }).join('')}
  </div>`;
}

/* Lightweight translator: sends any block of text to the anthropic-proxy and
   shows the English translation inline. Reused by ticket messages, email
   messages, and the original submission. */
async function aiTranslate(text, targetLang){
  const prompt = 'Translate the following text into ' + (targetLang||'English') + '. Auto-detect the source language. Output ONLY the translation itself with no preamble, notes, or quotation marks.\n\n---\n' + text;
  let token = SUPABASE_ANON_KEY;
  try{ const s = await sb.auth.getSession(); if(s && s.data && s.data.session && s.data.session.access_token) token = s.data.session.access_token; }catch(_){}
  const call = (tok)=> fetch(`${SUPABASE_URL}/functions/v1/anthropic-proxy`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+tok },
    body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1500, messages:[{ role:'user', content: prompt }] })
  });
  let resp = await call(token);
  if(resp.status===401){
    try{ await sb.auth.refreshSession(); const s=await sb.auth.getSession(); const nt=s&&s.data&&s.data.session&&s.data.session.access_token; if(nt){ resp = await call(nt); } }catch(_){}
  }
  if(resp.status===503) throw new Error('AI proxy not configured (add ANTHROPIC_API_KEY to the anthropic-proxy edge function secrets).');
  let data=null; try{ data = await resp.json(); }catch(_){ data=null; }
  if(!resp.ok){
    const m = (data && data.error && (data.error.message||data.error.type)) || ('HTTP '+resp.status);
    throw new Error(typeof m==='string'?m:JSON.stringify(m));
  }
  if(data && data.error){
    const m = data.error.message || data.error.type || (typeof data.error==='string'?data.error:JSON.stringify(data.error));
    throw new Error(m);
  }
  const out = (data && data.content && data.content[0] && data.content[0].text) ? data.content[0].text : '';
  if(!out) throw new Error('Empty response from AI');
  return out.trim();
}
async function translateEl(bodyId){
  const el = document.getElementById(bodyId); if(!el) return;
  const existing = document.getElementById(bodyId+'_xl');
  if(existing){ existing.remove(); return; } // toggle off
  const text = (el.innerText||'').trim(); if(!text) return;
  const holder = document.createElement('div');
  holder.id = bodyId+'_xl';
  holder.style.cssText = 'margin-top:6px;padding:8px 10px;border-left:2px solid var(--teal);background:var(--teal-dim);border-radius:var(--r-sm);font-size:var(--t-sm)';
  holder.innerHTML = '<span style="color:var(--text3)">Translating\u2026</span>';
  el.parentNode.insertBefore(holder, el.nextSibling);
  try{
    const t = await aiTranslate(text, 'English');
    holder.innerHTML = '<div style="font-size:var(--t-xs);color:var(--teal);font-weight:700;letter-spacing:.06em;margin-bottom:3px">TRANSLATION (EN)</div>' + escapeHtml(t).replace(/\n/g,'<br>');
  }catch(e){ holder.innerHTML = '<span style="color:var(--red)">Translation failed: ' + escapeHtml(e.message) + '</span>'; }
}
window.translateEl = translateEl;
// Detects text that isn't plain English (accented Latin, Cyrillic, Greek,
// Arabic, CJK, Hangul, etc.) so the translate control only shows when useful.
function looksNonEnglish(text){
  return /[\u00C0-\u024F\u0370-\u03FF\u0400-\u04FF\u0590-\u06FF\u3040-\u30FF\u3400-\u9FFF\uAC00-\uD7AF]/.test(String(text||''));
}
function threadTranslateBar(needed){
  if(!needed) return '';
  return `<div style="display:flex;justify-content:flex-end;margin:0 0 8px"><button class="btn btn-sm" id="xlToggleBtn" data-on="0" onclick="toggleThreadTranslation(this)" title="Translate this conversation to English">Translate to English</button></div>`;

async function toggleThreadTranslation(btn){
  const scope = document.getElementById('threadBox') || document.getElementById('tk-panel');
  if(!scope) return;
  const bodies = Array.prototype.slice.call(scope.querySelectorAll('.xl-body'));
  if(btn.getAttribute('data-on')==='1'){
    bodies.forEach(el=>{ const x=document.getElementById(el.id+'_xl'); if(x) x.remove(); });
    btn.setAttribute('data-on','0'); btn.textContent='Translate to English';
    return;
  }
  btn.setAttribute('data-on','1'); btn.disabled=true; btn.textContent='Translating\u2026';
  for(const el of bodies){
    if(document.getElementById(el.id+'_xl')) continue;
    const text=(el.getAttribute('data-xltext')||el.innerText||'').trim(); if(!text) continue;
    const holder=document.createElement('div');
    holder.id=el.id+'_xl';
    holder.style.cssText='margin-top:6px;padding:8px 10px;border-left:2px solid var(--teal);background:var(--teal-dim);border-radius:var(--r-sm);font-size:var(--t-sm)';
    holder.innerHTML='<span style="color:var(--text3)">Translating\u2026</span>';
    el.parentNode.insertBefore(holder, el.nextSibling);
    try{
      const t=await aiTranslate(text,'English');
      holder.innerHTML='<div style="font-size:var(--t-xs);color:var(--teal);font-weight:700;letter-spacing:.06em;margin-bottom:3px">TRANSLATION (EN)</div>'+escapeHtml(t).replace(/\n/g,'<br>');
    }catch(e){ holder.innerHTML='<span style="color:var(--red)">Translation failed: '+escapeHtml(e.message)+'</span>'; }
  }
  btn.disabled=false; btn.textContent='Show original';
}

// Strips a customer reply's quoted history (the "On ... wrote:" block + Gmail/
// Apple quote containers) at render time, so already-stored messages read clean
// too. Conservative: never touches a forwarded message.
function stripReplyQuoteHtml(html){
  let h = String(html||'');
  if(/forwarded message/i.test(h)) return h;
  h = h.replace(/<div[^>]*class="?[^">]*gmail_quote[\s\S]*$/i, '');
  h = h.replace(/<div[^>]*class="?[^">]*gmail_attr[\s\S]*$/i, '');
  h = h.replace(/(?:<[^>]+>\s*)*On\b[\s\S]{0,400}?\bwrote:[\s\S]*$/i, '');
  h = h.replace(/<blockquote[^>]*(type="?cite|gmail_quote)[\s\S]*$/i, '');
  h = h.replace(/-{2,}\s*Original Message\s*-{2,}[\s\S]*$/i, '');
  const t = h.trim();
  return t.replace(/<[^>]+>/g,'').replace(/\s+/g,'').length >= 2 ? t : html;
}
function stripReplyQuoteText(text){
  let t = String(text||'');
  if(/forwarded message/i.test(t)) return t;
  const cut = t.search(/\n?\s*On\b.{0,300}?\bwrote:/i);
  if(cut>0) t = t.slice(0, cut);
  return t.trim() || String(text||'');
}
// Renders a message body: real (sanitized) HTML in a sandboxed iframe so it
// looks like a true email and the sender's CSS can't bleed into the app; falls
// back to linkified plain text for older/plain-text messages.
function emailFrame(html){
  const doc = '<!doctype html><html><head><meta charset="utf-8"><base target="_blank"><style>html,body{margin:0}body{padding:8px 10px;font-family:sans-serif;font-size:13px;line-height:1.5;color:#111827;word-break:break-word;overflow-x:hidden}img{max-width:100%;height:auto}a{color:#0d9488}table{max-width:100%!important}*{max-width:100%}</style></head><body>'+String(html||'')+'</body></html>';
  const esc = doc.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  return '<iframe class="email-html" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" srcdoc="'+esc+'" style="width:100%;border:0;display:block;min-height:60px" onload="sizeEmailFrame(this)"></iframe>';
}
window.sizeEmailFrame = function(f){
  try{ const d=f.contentDocument||f.contentWindow.document; f.style.height=((d.body?d.body.scrollHeight:0)+18)+'px'; }
  catch(e){ f.style.height='320px'; }
};
// Notes saved by earlier versions begin with the icon's markup as plain text (<span class="ic ic-box"></span>). Draw it as the icon it was
// meant to be. Only that exact, attribute-free tag is turned back into an icon; everything else stays escaped text.
function restoreNoteIcons(escapedHtml){
  return String(escapedHtml).replace(/&lt;span class=&quot;ic ic-([a-z0-9-]+)&quot;&gt;&lt;\/span&gt;/g, '<span class="ic ic-$1"></span>');
}
function stripLegacyIcons(text){
  return String(text==null?'':text).replace(/<span class="ic ic-[a-z0-9-]+"><\/span>/g, '');
}
function msgBody(m){
  if(m && m.body_html && String(m.body_html).trim()) return emailFrame(stripReplyQuoteHtml(m.body_html));
  return restoreNoteIcons(linkifyBody(stripReplyQuoteText(m ? (m.body||'') : '')));
}

/* ============================================================
   EMAILS TAB (v1.29)
   Inbox for support@ conversations that are NOT tied to a live ticket.
   Reads emails / email_messages. Reply threads out via send-email-reply
   (stamps [TGK-E####]); Convert to Ticket carries the whole thread into a
   new ticket. Reuses the ticket slide-over panel and thread styles.

async function loadEmails(){
  try{
    const cutoff = recentCutoffISO();
    const [active, recent] = await Promise.all([
      // status can be NULL on older rows -- null-safe the same way loadBoundedTickets does,
      // matching the app's existing e.status!=='archived' truthy-check semantics.
      fetchAll((f,t)=> sb.from('emails').select('*')
        .or('status.is.null,status.not.in.(archived,completed)')
        .order('last_message_at',{ascending:false}).range(f,t)),
      fetchAll((f,t)=> sb.from('emails').select('*').gte('last_message_at', cutoff).order('last_message_at',{ascending:false}).range(f,t))
    ]);
    S.emails = mergeRowsById(recent, active).sort((a,b)=> new Date(b.last_message_at||b.created_at) - new Date(a.last_message_at||a.created_at));
  }catch(e){ S.emails = S.emails || []; }
}

async function loadEmailMessages(emailId){
  const { data, error } = await sb.from('email_messages').select('*').eq('email_id', emailId).order('created_at',{ascending:true});
  if(error){ toast('Failed to load email', true); return []; }
  S.emailMessages[emailId] = data;
  return data;
}

function currentMailbox(){ return S.page==='orders' ? 'orders' : 'support'; }
function emailInMailbox(e, mb){ return mb==='orders' ? e.mailbox==='orders' : e.mailbox!=='orders'; }
function emailFiltered(){
  const mb = currentMailbox();
  let list = (S.emails||[]).filter(e=>emailInMailbox(e, mb));
  const f = S.emailFilters;
  if(f.view==='archived') list = list.filter(e=>e.status==='archived');
  else if(f.view==='completed') list = list.filter(e=>e.status==='completed');
  else if(f.view==='unread') list = list.filter(e=>e.status!=='archived' && e.status!=='completed' && e.has_unread);
  else list = list.filter(e=>e.status!=='archived' && e.status!=='completed');
  if(f.q){
    const q=f.q.toLowerCase();
    const bodyHits = window._emailBodyMatches || null;
    list = list.filter(e=>(e.subject||'').toLowerCase().includes(q) || (e.customer_email||'').toLowerCase().includes(q) || (e.po_number||'').toLowerCase().includes(q) || (bodyHits && bodyHits.has(e.id)));
  }
  return list;
}
async function runEmailBodySearch(q){
  q=(q||'').trim();
  if(q.length < 3){ window._emailBodyMatches=null; renderEmailsBody(); return; }
  try{
    const { data } = await sb.from('email_messages').select('email_id').ilike('body', '%'+q+'%').limit(1000);
    window._emailBodyMatches = new Set((data||[]).map(r=>r.email_id));
  }catch(_){ window._emailBodyMatches=null; }
  renderEmailsBody();
}

async function updateEmailField(id, field, value, quiet, skipUndo){
  if(value==='') value = null;
  const before = (S.emails.find(x=>x.id===id)||{})[field];
  try{
    const { data, error } = await sb.from('emails').update({ [field]: value, updated_at:new Date().toISOString() }).eq('id', id).select().single();
    if(error) throw error;
    const i=S.emails.findIndex(x=>x.id===id); if(i!==-1) S.emails[i]=data;
    if(S.activeEmail && S.activeEmail.id===id) S.activeEmail=data;
    if(!skipUndo && JSON.stringify(before) !== JSON.stringify(value)){
      pushUndo({ label:'order/email '+field, undo:()=>updateEmailField(id, field, before, true, true), redo:()=>updateEmailField(id, field, value, true, true) });
    }
    if(!quiet) toast('Saved');
  }catch(e){ toast('Save failed: '+e.message, true); }
}

function orderSourcePill(e){

async function bulkEmailUpdate(patch){

function dealerWholesalePct(id){ if(!id) return null; const d=(S.dealers||[]).find(x=>String(x.id)===String(id)); return d && d.discount_pct!=null ? Math.round(d.discount_pct*1000)/10 : null; }

    window._orderLinesFor = e.id;
  }
  if(!window._orderLines.length) window._orderLines = [{sku:'',qty:1}];
  return window._orderLines;
}
function deriveDealerPrefix(dealerId){
  const d=(S.dealers||[]).find(x=>String(x.id)===String(dealerId));
  if(d && (d.po_code_prefix||'').trim()) return String(d.po_code_prefix).replace(/[^a-zA-Z0-9]/g,'').toUpperCase();
  const nm = dealerName(dealerId) || '';
  const first = nm.trim().split(/\s+/)[0] || '';
  return first.replace(/[^a-zA-Z0-9]/g,'').toUpperCase().slice(0,4);
}
function suggestOrderCode(e){
  const px = deriveDealerPrefix(e.dealer_id);

}

function partSku(r){ return (r.use_new_sku && r.new_sku && String(r.new_sku).trim()) ? String(r.new_sku).trim() : (r.pn||''); }
function partDesc(r){ return r.description || r.name || r.title || r.part_name || r.product_title || r.desc || ''; }
function partPrice(r){ const v = (r.msrp!=null?r.msrp:(r.price!=null?r.price:(r.retail_price!=null?r.retail_price:r.unit_price))); return v!=null ? v : null; }
// Best-effort stock read from whatever column the ERP uses; null if none present.
function partStock(r){
  const cands = ['total_unpckgd','on_hand','qty_on_hand','stock','stock_qty','available','qty','quantity','in_stock'];
  for(const c of cands){ if(r[c]!=null && r[c]!=='' && !isNaN(Number(r[c]))) return Number(r[c]); }
  return null;
}
function partStockBadge(r){
  // Explicit backorder flag wins if present.
  const bo = (r.backorder ?? r.backordered ?? r.is_backorder ?? r.on_backorder);
  if(bo===true) return '<span class="pill pill-orange" style="font-size:9px">Backorder</span>';
  const s = partStock(r);
  if(s==null) return '';
  if(s<=0) return '<span class="pill pill-orange" style="font-size:9px">Out / backorder</span>';
  if(s<=3) return '<span class="pill pill-muted" style="font-size:9px">'+s+' left</span>';
  return '<span class="pill pill-green" style="font-size:9px">'+s+' in stock</span>';
}
async function searchParts(q){
  q = (q||'').trim();
  if(q.length < 2) return [];
  const safe = q.replace(/[^a-zA-Z0-9 _.\-]/g,'');
  if(!safe) return [];
  const pat = '*'+safe+'*';
  const run = async (table)=>{
    try{
      const { data } = await sb.from(table).select('*').or(`pn.ilike.${pat},new_sku.ilike.${pat}`).limit(6);
      return (data||[]).map(r=>({ ...r, _table:table }));
    }catch(e){ return []; }
  };
  const [a,p] = await Promise.all([run('assemblies'), run('parts')]);
  return [...a, ...p].slice(0,8);
}

    </div>`).join('');

  }, 200);
}

function renderTotalsStrip(t){

function trackingUrl(carrier, num){
  const c=String(carrier||'').toLowerCase();
  if(/ups/.test(c)) return 'https://www.ups.com/track?tracknum='+encodeURIComponent(num);
  if(/usps/.test(c)) return 'https://tools.usps.com/go/TrackConfirmAction?tLabels='+encodeURIComponent(num);
  if(/fedex/.test(c)) return 'https://www.fedex.com/fedextrack/?trknbr='+encodeURIComponent(num);
  if(/dhl/.test(c)) return 'https://www.dhl.com/us-en/home/tracking.html?tracking-id='+encodeURIComponent(num);
  return 'https://www.google.com/search?q='+encodeURIComponent((carrier?carrier+' ':'')+num+' tracking');
}
function computeOrderFulfillment(lines){
  if(!lines || !lines.length) return null;
  const low = lines.map(l=>String(l.fulfillment_status||'Open').trim().toLowerCase());
  const shippedLike = s=>['shipped','delivered','fulfilled','complete','completed'].includes(s);
  const total = low.length;
  const shippedCount = low.filter(shippedLike).length;
  const trackMap = new Map();
  lines.forEach(l=>{ if(l.tracking_number) trackMap.set(l.tracking_number, { carrier:l.carrier||'', number:l.tracking_number }); });
  const tracking = [...trackMap.values()];
  let label='Processing', color='pill-teal', allShipped=false;
  if(low.every(s=>s==='cancelled')){ label='Cancelled'; color='pill-muted'; }
  else if(low.some(s=>s==='refunded')){ label='Refunded'; color='pill-orange'; }
  else if(low.every(s=>s==='delivered'||s==='cancelled')){ label='Delivered'; color='pill-green'; allShipped=true; }
  else if(low.every(s=>shippedLike(s)||s==='cancelled')){ label='Shipped'; color='pill-green'; allShipped=true; }
  else if(shippedCount>0){ label='Partially shipped'; color='pill-teal'; }
  else if(low.some(s=>s==='on hold')){ label='On hold'; color='pill-orange'; }
  else if(low.some(s=>s==='packed')){ label='Packed'; color='pill-teal'; }
  else if(low.some(s=>s==='open')){ label='Open'; color='pill-teal'; }
  return { label, color, allShipped, tracking, shippedCount, total };
}
async function autoCompleteOrder(id){
  try{
    const { data } = await sb.from('emails').update({ status:'completed', has_unread:false, unread_count:0, completed_at:new Date().toISOString(), updated_at:new Date().toISOString() }).eq('id', id).select().single();
    const i=S.emails.findIndex(x=>x.id===id);
    if(i!==-1 && data){ data._fulfillment = S.emails[i]._fulfillment; S.emails[i]=data; if(S.activeEmail && S.activeEmail.id===id) S.activeEmail=data; }
    try{ logOrderAudit(id,'Auto-completed (shipped)',''); }catch(_){}
  }catch(_){}
}
async function loadOrdersFulfillment(){
  const orders = (S.emails||[]).filter(e=>e.mailbox==='orders' && e.shopify_order_id && e.status!=='archived');
  if(!orders.length) return;
  const nums = [...new Set(orders.map(e=>e.shopify_order_id))];
  let rows=[];
  try{
    for(let i=0;i<nums.length;i+=100){
      const { data } = await sb.from('sales').select('order_number,pn,qty,fulfillment_status,tracking_number,carrier,shipped_at').in('order_number', nums.slice(i,i+100));
      if(data) rows=rows.concat(data);
    }
  }catch(_){ return; }
  const byOrder={};
  rows.forEach(r=>{ (byOrder[r.order_number]=byOrder[r.order_number]||[]).push(r); });
  const toComplete=[];
  orders.forEach(e=>{
    e._fulfillment = computeOrderFulfillment(byOrder[e.shopify_order_id]);
    if(e._fulfillment && e._fulfillment.allShipped && e.status!=='completed') toComplete.push(e);
  });
  for(const e of toComplete){ await autoCompleteOrder(e.id); }
}

async function refreshOrderFulfillment(id){

    e._fulfillment = computeOrderFulfillment(data||[]);

}

function rerenderOrderBuilder(){ const el=document.getElementById('orderBuilder'); if(el && S.activeEmail) el.outerHTML = renderOrderBuilder(S.activeEmail); }
function addOrderLine(){ clearOrderTotals(); orderLinesFor(S.activeEmail).push({sku:'',qty:1,desc:''}); rerenderOrderBuilder(); }
function removeOrderLine(i){ clearOrderTotals(); const l=orderLinesFor(S.activeEmail); l.splice(i,1); rerenderOrderBuilder(); }
function updateOrderLine(i,field,val){ clearOrderTotals(); const l=orderLinesFor(S.activeEmail)[i]; if(!l) return; l[field] = field==='qty' ? Math.max(1,parseInt(val)||1) : val; }
window.addOrderLine=addOrderLine; window.removeOrderLine=removeOrderLine; window.updateOrderLine=updateOrderLine;

async function saveOrderLines(id){
  try{
    const lines = (window._orderLines||[]).filter(l=>l.sku && l.sku.trim()).map(l=>({sku:l.sku.trim(), qty:Math.max(1,parseInt(l.qty)||1), desc:l.desc||'', price:(l.price!=null&&String(l.price).trim()!=='')?Number(l.price):null}));
    const { data, error } = await sb.from('emails').update({ order_line_items: lines, updated_at:new Date().toISOString() }).eq('id', id).select().single();
    if(error) throw error;
    const i=S.emails.findIndex(x=>x.id===id); if(i!==-1) S.emails[i]=data; if(S.activeEmail&&S.activeEmail.id===id) S.activeEmail=data;
    toast('Order lines saved');
  }catch(e){ toast('Save failed: '+e.message, true); }
}
window.saveOrderLines=saveOrderLines;

async function createShopifyDraft(id){
  const e=(S.emails||[]).find(x=>x.id===id); if(!e) return;
  const lines=(window._orderLines||[]).filter(l=>l.sku&&l.sku.trim()).map(l=>({sku:l.sku.trim(), qty:Math.max(1,parseInt(l.qty)||1), price:(l.price!=null&&String(l.price).trim()!=='')?Number(l.price):null, desc:l.desc||''}));
  if(!lines.length){ toast('Add at least one line item', true); return; }
  const btn=document.getElementById('createDraftBtn'); if(btn){ btn.disabled=true; btn.textContent='Creating in Shopify...'; }
  // One payload builder for preview and create so the two can never disagree.
  const payload = orderDraftPayload(id);
  if(!payload){ if(btn){ btn.disabled=false; btn.textContent='Save draft'; } return null; }
  payload.line_items = lines;
  try{
    await sb.from('emails').update({ order_line_items: lines, updated_at:new Date().toISOString() }).eq('id', id);
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/create-draft-order`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`, 'apikey':SUPABASE_ANON_KEY },
      body: JSON.stringify(payload)
    });
    const result = await resp.json();
    if(!resp.ok) throw new Error(result.error||'Shopify draft failed');
    const i=S.emails.findIndex(x=>x.id===id);
    if(i!==-1){ S.emails[i].shopify_draft_id=result.draft_id; S.emails[i].shopify_draft_gid=result.draft_gid; S.emails[i].shopify_draft_url=result.invoice_url; S.emails[i].order_line_items=lines; S.activeEmail=S.emails[i]; }
    renderEmailPanel(S.activeEmail);
    logOrderAudit(id,'Draft created', result.draft_id||''); renderOrderAudit(id);
    toast('Shopify draft created' + (result.total?(' \u2014 '+result.total):''));
    // Belt-and-braces: the draft function pins USD; if Shopify ever reports anything
    // else, staff-entered prices/shipping were read in that currency -- say so loudly.
    if(result.currency && String(result.currency).toUpperCase()!=='USD'){
      toast('WARNING: this draft is in '+result.currency+', not USD -- custom prices and shipping were read as '+result.currency+'. Check it in Shopify before invoicing.', true);
    }
    return result;
  }catch(err){
    toast('Draft failed: '+err.message, true);
    if(btn){ btn.disabled=false; btn.textContent='Create Draft in Shopify'; }
    return null;
  }
}
window.createShopifyDraft=createShopifyDraft;

async function draftAction(id, action, extra){
  const e=(S.emails||[]).find(x=>x.id===id); if(!e) return null;
  if(!e.shopify_draft_gid){ toast('Recreate the draft first (older drafts are missing their Shopify reference).', true); return null; }
  const resp = await fetch(`${SUPABASE_URL}/functions/v1/create-draft-order`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`, 'apikey':SUPABASE_ANON_KEY },
    body: JSON.stringify({ action, email_id:id, draft_gid:e.shopify_draft_gid, ...(extra||{}) })
  });
  const r = await resp.json();
  if(!resp.ok) throw new Error(r.error||'Shopify action failed');
  return r;
}
async function sendShopifyInvoice(id){
  try{ const r = await draftAction(id, 'invoice'); if(r){ logOrderAudit(id,'Invoice sent',''); renderOrderAudit(id); toast('Invoice sent to the customer'); } }
  catch(err){ toast('Invoice failed: '+err.message, true); }
}
window.sendShopifyInvoice = sendShopifyInvoice;
async function completeShopifyDraft(id, paymentPending, skipConfirm){
  const e=(S.emails||[]).find(x=>x.id===id); if(!e) return;
  if(!skipConfirm && !confirm(paymentPending?'Complete this draft into an order with payment PENDING (net terms)?':'Mark this draft PAID and complete it into a real order?')) return;
  try{
    const r = await draftAction(id, 'complete', { payment_pending: !!paymentPending });
    if(!r) return;
    const i=S.emails.findIndex(x=>x.id===id);
    if(i!==-1){ S.emails[i].shopify_order_id=r.order_id; S.activeEmail=S.emails[i]; }
    renderEmailPanel(S.activeEmail);
    if(S.activeEmail && S.activeEmail.shopify_order_id) refreshOrderFulfillment(id);
    logOrderAudit(id, paymentPending?'Completed (net terms)':'Marked paid & completed', r.order_id||''); renderOrderAudit(id);
    toast('Order created'+(r.order_id?(' '+r.order_id):''));
  }catch(err){ toast('Complete failed: '+err.message, true); }
}
window.completeShopifyDraft = completeShopifyDraft;

async function cancelShopifyDraft(id){
  const e=(S.emails||[]).find(x=>x.id===id);
  if(!e || !e.shopify_draft_gid){ toast('No draft to cancel', true); return; }
  if(!confirm('Delete this draft from Shopify? The order stays here so you can rebuild it, but the Shopify draft is removed.')) return;
  try{
    const r = await draftAction(id, 'delete'); if(!r) return;
    const i=S.emails.findIndex(x=>x.id===id);
    if(i!==-1){ S.emails[i].shopify_draft_id=null; S.emails[i].shopify_draft_gid=null; S.emails[i].shopify_draft_url=null; S.activeEmail=S.emails[i]; }
    logOrderAudit(id,'Draft cancelled',''); if(document.getElementById('orderAuditBox')) renderOrderAudit(id);
    renderEmailPanel(S.activeEmail);
    toast('Shopify draft cancelled');
  }catch(err){ toast('Cancel failed: '+err.message, true); }
}
window.cancelShopifyDraft = cancelShopifyDraft;

// Dealer flow: create the draft, then complete it as PAID in one step.
async function createAndMarkPaid(id){
  if(window._orderChainBusy) return;
  const e=(S.emails||[]).find(x=>x.id===id); if(!e) return;
  // Either an explicit drop-ship address, or the dealer's own Shopify address.
  const hasShip = shipsToDealer(e) || !!(e.is_dropship && (e.ship_address1 || e.ship_city));
  if(!hasShip && !confirm('This order has no dealer and no ship-to address, so it may not import into ShipStation. Create and mark paid anyway?\n\nTip: pick a dealer above, or enable "Drop-ship / customer order" to enter an address.')) return;
  window._orderChainBusy = true;
  try{
    const r = await createShopifyDraft(id);
    if(!r) return;
    await completeShopifyDraft(id, false, true);
  } finally { window._orderChainBusy = false; }
}
window.createAndMarkPaid = createAndMarkPaid;

// Customer flow: create the draft, then send the Shopify invoice for them to pay.
async function createAndInvoice(id){
  if(window._orderChainBusy) return;
  const e=(S.emails||[]).find(x=>x.id===id);
  // Bill-to is always the dealer when one is assigned, but who gets EMAILED
  // depends on drop-ship: a plain dealer order notifies the dealer (they're
  // the recipient); a drop-ship notifies the end customer's ship-to email
  // even though the dealer is still billed.
  const email = (e && e.dealer_id)
    ? (e.is_dropship ? (e.ship_email||'').trim() : (dealerEmail(e.dealer_id) || '').trim())
    : ((e && e.is_dropship ? (e.ship_email||'') : (e && e.customer_email) || '').trim());
  if(!email){
    const msg = (e && e.dealer_id)
      ? (e.is_dropship ? 'Enter a customer email in the ship-to fields first \u2014 the invoice needs a recipient.' : 'This dealer has no email on file in the ERP \u2014 the invoice needs a recipient.')
      : 'Enter a customer email in the ship-to fields first \u2014 the invoice needs a recipient.';
    toast(msg, true); return;
  }
  window._orderChainBusy = true;
  try{
    const r = await createShopifyDraft(id);
    if(!r) return;
    await sendShopifyInvoice(id);
  } finally { window._orderChainBusy = false; }
}
window.createAndInvoice = createAndInvoice;

function emailTemplatePickerOptions(){

  html += all.slice().sort(function(a,b){return (a.title||'').localeCompare(b.title||'');}).map(function(x){ return '<option value="'+x.id+'">'+escapeHtml(x.title)+'</option>'; }).join('');
  return html;
}
function fillEmailTokens(body, e){
  var agent = (S.user && S.user.email) ? (friendlyStaffName()||S.user.email) : '';
  var name = (e && (e.ship_name || dealerName(e.dealer_id) || e.customer_email)) || '';
  var map = {
    order_number: (e && (e.shopify_order_id || e.shopify_draft_id)) || '',
    customer_name: name,
    first_name: name ? String(name).trim().split(/\s+/)[0] : '',
    customer_email: (e && e.customer_email) || '',
    dealer: (e && dealerName(e.dealer_id)) || '',
    po: (e && e.po_number) || '',
    ref: (e && emailRef(e)) || '',
    agent: agent
  };
  return String(body||'').replace(/\{\{\s*([a-z_]+)\s*\}\}/gi, function(m0, key){ var k=key.toLowerCase(); return (k in map)?map[k]:m0; });
}
function applyEmailTemplate(emailId, templateId){
  if(!templateId) return;
  var e = (S.emails||[]).find(function(x){return x.id===emailId;});
  var tmpl = (S.templates||[]).find(function(x){return x.id===templateId;});
  if(!tmpl) return;
  var box = document.getElementById('msgBox'); if(!box) return;
  var text = fillEmailTokens(tmpl.body, e);
  box.value = box.value.trim() ? (box.value.replace(/\s+$/,'') + '\n\n' + text) : text;
  box.focus();
  try{ box.selectionStart = box.selectionEnd = box.value.length; }catch(_){}
}

// ---- "Needs reply" + aging engine (shared by aging flags and Needs Reply view) ----
// A conversation needs a reply when the customer spoke last. last_direction is
// set 'inbound' by the inbound webhook and 'outbound' when staff reply; older
// rows without it fall back to has_unread.
function emailNeedsReply(e){
  if(!e || e.status==='archived' || e.status==='completed' || e.converted_ticket_id || e.converted_order_id) return false;
  // An order that's been pushed to Shopify (draft or real order) has been handled
  // -- don't nag for a reply on it.
  if(e.mailbox==='orders' && (e.shopify_order_id || e.shopify_draft_id)) return false;
  if(e.last_direction==='inbound') return true;
  if(e.last_direction==='outbound') return false;
  return !!e.has_unread;
}
function ticketNeedsReply(t){
  if(!t || t.archived || t.merged_into_id || ['resolved','closed','waiting_customer'].includes(t.status)) return false;
  if(t.last_direction==='inbound') return true;
  if(t.last_direction==='outbound') return false;
  return !!t.has_unread && ['open','pending'].includes(t.status);
}
const EMAIL_WAIT_HOURS = 12;
function emailWaitingHours(e){
  if(!emailNeedsReply(e)) return 0;
  return Math.floor((Date.now() - new Date(e.last_message_at||e.created_at).getTime())/3600000);
}
function waitingPill(e){
  const h = emailWaitingHours(e);
  if(h < EMAIL_WAIT_HOURS) return '';
  const disp = h>=48 ? (Math.floor(h/24)+'d') : (h+'h');
  return '<span class="pill pill-orange" title="Customer waiting '+h+'h for a reply">\u23f0 Waiting '+disp+'</span>';
}
// Unified list of everything where the customer spoke last and no reply followed.
function needsReplyItems(){
  const items=[];
  (S.tickets||[]).forEach(t=>{ if(ticketNeedsReply(t)) items.push({
    type:'ticket', id:t.id, ref:'#'+t.ticket_number,
    who: t.customer_name || t.customer_email || 'Customer',
    subject: t.subject||'(no subject)',
    ts: new Date(t.updated_at || t.created_at).getTime()
  }); });
  (S.emails||[]).forEach(e=>{ if(emailNeedsReply(e)) items.push({
    type: e.mailbox==='orders'?'order':'email', id:e.id, ref: emailRef(e),
    who: (e.mailbox==='orders' ? orderDisplayName(e) : e.customer_email) || 'Customer',
    subject: e.subject||'(no subject)',
    ts: new Date(e.last_message_at || e.created_at).getTime()
  }); });
  return items.sort((a,b)=>a.ts-b.ts); // oldest waiting first
}
function renderNeedsReply(){
  const el=document.getElementById('content');
  const items = needsReplyItems();
  const typePill = { ticket:'<span class="pill pill-muted">Ticket</span>', email:'<span class="pill pill-teal">Email</span>', order:'<span class="pill pill-green">Order</span>' };
  el.innerHTML = `
    <div class="panel-title" style="border:none">Needs Reply${items.length?' ('+items.length+')':''}</div>
    <div style="font-size:var(--t-sm);color:var(--text3);margin-bottom:10px">Everything where the customer spoke last and no reply has gone out yet \u2014 across tickets, emails, and orders. Oldest first.</div>
    ${items.length ? `<div class="tbl-wrap"><table><thead><tr><th>Type</th><th>#</th><th>From</th><th>Subject</th><th>Waiting</th></tr></thead><tbody>
      ${items.map(it=>{
        const h=Math.floor((Date.now()-it.ts)/3600000);
        const wait = h>=48?(Math.floor(h/24)+'d'):(h+'h');
        const overdue = h>=EMAIL_WAIT_HOURS;
        const open = it.type==='ticket' ? `openTicket('${it.id}')` : `openEmail('${it.id}')`;
        return `<tr class="rowlink" onclick="${open}">
          <td>${typePill[it.type]}</td>
          <td class="pn">${escapeHtml(it.ref)}</td>
          <td class="main-col">${escapeHtml(it.who)}</td>
          <td>${escapeHtml(it.subject)}</td>
          <td class="pn"><span style="color:${overdue?'var(--orange)':'var(--text3)'}">${overdue?'\u23f0 ':''}${wait}</span></td>
        </tr>`;
      }).join('')}
    </tbody></table></div>` : '<div class="tbl-wrap"><div class="empty">Nothing waiting on a reply \u2014 you\'re all caught up. \u2705</div></div>'}
  `;
}
window.renderNeedsReply = renderNeedsReply;

async function sendEmailReply(emailId){
  const box = document.getElementById('msgBox');
  const body = box.value.trim();
  if(!body) return;
  const e = (S.emails||[]).find(x=>x.id===emailId);
  if(!e){ toast('Email not found', true); return; }
  if(!e.customer_email){ toast('No sender address on this email', true); return; }
  const btn = document.getElementById('sendBtn');
  if(btn){ btn.disabled=true; btn.textContent='Sending...'; }
  try{
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/send-email-reply`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`, 'apikey':SUPABASE_ANON_KEY },
      body: JSON.stringify({
        email_id: emailId,
        email_number: e.email_number,
        display_number: e.display_number,
        mailbox: e.mailbox,
        to: e.customer_email,
        subject: e.subject ? ('Re: '+e.subject) : 'Re: your message to TGK Motorsport',
        body,
        attachments: pendingMsgAttachments,
        staff_name: (typeof friendlyStaffName==='function')?friendlyStaffName():'',
        staff_email: (S.user&&S.user.email)||null
      })
    });
    const result = await resp.json();
    if(!resp.ok) throw new Error(result.error||'Send failed');
    box.value='';
    pendingMsgAttachments = [];
    await loadEmailMessages(emailId);
    const i=S.emails.findIndex(x=>x.id===emailId);
    if(i!==-1){
      S.emails[i].last_message_at=new Date().toISOString();
      S.emails[i].last_reply_by=(S.user&&S.user.email)||null;
      S.emails[i].last_reply_at=new Date().toISOString();
      S.emails[i].last_direction='outbound';
      S.emails[i].has_unread=false; S.emails[i].unread_count=0;
      if(S.emails[i].status!=='archived') S.emails[i].status='read';
      // Assign-on-reply: claim an unassigned conversation for whoever replied.
      const me=(S.user&&S.user.email)||null;
      if(me && !S.emails[i].assigned_to){ S.emails[i].assigned_to=me; }
      S.activeEmail=S.emails[i];
      try{ await sb.from('emails').update({ last_direction:'outbound', assigned_to:S.emails[i].assigned_to||null }).eq('id', emailId); }catch(_){}
      if(me && S.emails[i].assigned_to===me) toast('Assigned to you');
    }
    renderEmailPanel(S.activeEmail);
    scrollThreadToBottom();
    renderNav();
    toast('Reply sent to '+e.customer_email);
  }catch(err){
    toast('Send failed: '+err.message, true);
    if(btn){ btn.disabled=false; btn.textContent='Send Reply'; }
  }
}
window.sendEmailReply = sendEmailReply;

    const before = S.tickets.find(x=>x.id===id);

    const patch = { [field]: value, updated_at: new Date().toISOString() };
    if(field==='status' && (value==='resolved'||value==='closed')) patch.resolved_at = new Date().toISOString();
    const { data, error } = await sb.from('tickets').update(patch).eq('id', id).select().single();
    if(error) throw error;
    const idx = S.tickets.findIndex(x=>x.id===id);
    if(idx!==-1) S.tickets[idx] = data;
    S.activeTicket = data;
    if(TRACKED_ACTIVITY_FIELDS.includes(field) && oldValue !== value){
      await logActivity(id, field, oldValue, value);
    }
    if(!skipUndo && JSON.stringify(oldValue) !== JSON.stringify(value)){
      const num = (before && before.ticket_number) || '';
      pushUndo({ label:'ticket #'+num+' '+field, undo:()=>updateTicketField(id, field, oldValue, true), redo:()=>updateTicketField(id, field, value, true) });
    }
    toast('Ticket updated');
    renderNav();
    if(S.page!=='dashboard') renderPage();
    if(S.activeTicket && S.activeTicket.id === id){
      renderTicketPanel(data);
    }
  }catch(e){
    toast('Update failed: ' + e.message, true);
  }
}

async function performArchiveTicket(id, alsoDeleteLinked){
  const t = S.tickets.find(x=>x.id===id);
  if(!t) return;
  try{
    // A live chat still marked open/active means the visitor's widget thinks someone is still
    // there. Archiving hides it from staff's view, but does nothing on its own to tell the
    // customer's side that's no longer true - without this, they could keep typing into a
    // conversation nobody will ever see again. Same effect endLiveChat already gives a manual
    // click, applied automatically here since archiving already carries its own confirmation.
    // This also sets status to closed as a side effect, so the universal check just below
    // finds nothing left to do for a live chat specifically - it only has real work left for
    // everything else.
    if(t.is_live_chat && !['resolved','closed'].includes(t.status)){
      try{ await _endLiveChatNow(id); }
      catch(e){ console.warn('[archive] could not end live chat before archiving:', e); }
    }
    if(alsoDeleteLinked){
      if(t.warranty_claim_id){
        const { error } = await sb.from('warranty_claims').delete().eq('id', t.warranty_claim_id);
        if(error) throw error;
        S.warranty = S.warranty.filter(w=>w.id!==t.warranty_claim_id);
      }
      if(t.shipment_error_id){
        const { error } = await sb.from('shipment_errors').delete().eq('id', t.shipment_error_id);
        if(error) throw error;
        S.shipErrors = S.shipErrors.filter(e=>e.id!==t.shipment_error_id);
      }
    }
    // Archiving anything should close it too - a ticket sitting archived but still showing
    // "open" (or "pending", or "waiting on customer") reads as unfinished work that got hidden
    // rather than work that's actually done, which is confusing either way it's found later.
    // 'resolved' is left alone deliberately: it is a distinct, more specific outcome than a
    // generic close, chosen on purpose by whoever handled it - archiving should never quietly
    // downgrade that back to just "closed" and lose what it actually says happened.
    const archivePatch = { archived: true, archived_at: new Date().toISOString() };
    if(!['resolved','closed'].includes(t.status)) archivePatch.status = 'closed';
    const { data, error } = await sb.from('tickets').update(archivePatch).eq('id', id).select().single();
    if(error) throw error;
    const idx = S.tickets.findIndex(x=>x.id===id);
    if(idx!==-1) S.tickets[idx] = data;
    await logActivity(id, 'archived', 'false', 'true');
    closePanel();
    toast('Ticket #' + t.ticket_number + ' archived' + (alsoDeleteLinked ? ' along with its linked ERP record' : ''));
    renderNav();
    renderPage();
  }catch(e){
    toast('Failed to archive: ' + e.message, true);
  }
}

/* ============ FORWARD CONVERSATION (v1.21) ============
   Sends the full ticket thread to any external address through the same
   send-ticket-email edge function used for customer replies. Logs an
   internal note on the ticket; note is removed if the send fails. */
function _fwFormatThread(t, msgs, includeNotes){
  var lines=[];
  lines.push('---------- Forwarded conversation ----------');
  lines.push('Ticket #'+String(t.ticket_number).padStart(4,'0')+(t.subject?' - '+t.subject:''));
  lines.push('Customer: '+(t.customer_name||'-')+' <'+(t.customer_email||'-')+'>'+(t.order_number?'  |  Order #'+t.order_number:''));
  lines.push('Status: '+(t.status||'-')+'  |  Opened: '+new Date(t.created_at).toLocaleString());
  lines.push('=============================================');
  if(t.description){
    lines.push('');
    lines.push('['+new Date(t.created_at).toLocaleString()+'] ORIGINAL CUSTOMER SUBMISSION'+(t.source?' ('+t.source+')':'')+':');
    lines.push((t.description||'').trim());
    lines.push('---------------------------------------------');
  }
  (msgs||[]).forEach(function(m){
    if(m.is_internal_note && !includeNotes) return;
    var who=m.sender_type==='staff'?('TGK Staff ('+(m.sender_name||'staff')+')'):('Customer ('+(m.sender_name||t.customer_name||'customer')+')');
    if(m.is_internal_note) who='[INTERNAL NOTE] '+(m.sender_name||'staff');
    lines.push('');
    lines.push('['+new Date(m.created_at).toLocaleString()+'] '+who+':');
    lines.push((m.body||'').trim());
    (m.attachments||[]).forEach(function(a){ lines.push('  [attachment] '+(a.name||'file')+': '+(a.url||'')); });
    lines.push('---------------------------------------------');
  });
  return lines.join('\n');
}
/* ============ END LIVE CHAT (v1.21) ============
   Closes a live-chat ticket authoritatively so the visitor's widget can tell the
   conversation is over. The widget keeps its ticket id in localStorage, which
   survives closing the browser, so without a terminal status on the ticket it
   reattaches to the same conversation forever. Setting status='closed' plus a
   visible system message gives the widget something definite to check on open. */
// The actual work of ending a live chat, separated from endLiveChat's own confirmation dialog -
// archiving a live chat needs this exact same effect (customer gets a fresh chat next time,
// not a conversation staff can no longer see but the widget still thinks is live), but
// shouldn't stack a second "are you sure?" on top of the one archiving already asked.
async function _endLiveChatNow(ticketId){
  const t=(S.tickets||[]).find(x=>x.id===ticketId);
  if(!t)return;
  const who=(typeof friendlyStaffName==='function')?friendlyStaffName():(S.user&&S.user.email)||'staff';
  const up=await sb.from('tickets').update({status:'closed',updated_at:new Date().toISOString()}).eq('id',ticketId);
  if(up.error)throw up.error;
  try{
    const ins=await sb.from('ticket_messages').insert({
      ticket_id:ticketId,sender_type:'staff',sender_name:who,
      body:'\u23f9 Chat ended by '+who+'.',is_internal_note:false
    }).select().single();
    if(!ins.error&&ins.data){
      if(!S.messages[ticketId])S.messages[ticketId]=[];
      S.messages[ticketId].push(ins.data);
    }
  }catch(_e){}
  t.status='closed';t.updated_at=new Date().toISOString();
}

async function endLiveChat(ticketId){
  const t=(S.tickets||[]).find(x=>x.id===ticketId);
  if(!t){toast('Ticket not found',true);return;}
  if(!confirm('End this live chat?\n\nThe conversation is closed and the visitor gets a fresh chat next time they open the widget.'))return;
  try{
    await _endLiveChatNow(ticketId);
    toast('\u2713 Live chat ended - the visitor will start a new chat next time');
    if(typeof renderApp==='function')renderApp();else if(typeof render==='function')render();
    const tb=document.getElementById('threadBox');
    if(tb&&typeof renderThread==='function')tb.innerHTML=renderThread(S.messages[ticketId]||[],typeof showingNotes!=='undefined'?showingNotes:false);
  }catch(e){
    toast('Could not end the chat: '+(e.message||e),7000);
  }
}

async function sendForward(ticketId){
  var t=(S.tickets||[]).find(function(x){return x.id===ticketId;});
  var to=(document.getElementById('fw-to')||{}).value||''; to=to.trim();
  var note=((document.getElementById('fw-note')||{}).value||'').trim();
  var incNotes=!!(document.getElementById('fw-notes')||{}).checked;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)){toast('Enter a valid email address',true);return;}
  var btn=document.getElementById('fw-send'); if(btn){btn.disabled=true;btn.textContent='Sending\u2026';}
  var msgs=S.messages[ticketId]||[];
  var body=(note?note+'\n\n':'')+_fwFormatThread(t,msgs,incNotes);
  var noteRow=null;
  try{
    var ins=await sb.from('ticket_messages').insert({
      ticket_id:ticketId, sender_type:'staff', sender_name:S.user.email,
      body:'\u2197 Conversation forwarded to '+to+(incNotes?' (including internal notes)':''),
      is_internal_note:true
    }).select().single();
    if(ins.error) throw ins.error;
    noteRow=ins.data;
    var resp=await fetch(SUPABASE_URL+'/functions/v1/send-ticket-email',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_ANON_KEY,'apikey':SUPABASE_ANON_KEY},
      body:JSON.stringify({
        ticket_id:ticketId, ticket_number:t.ticket_number, message_id:noteRow.id,
        to:to,
        subject:'Fwd: TGK Motorsport Support #'+String(t.ticket_number).padStart(4,'0')+(t.subject?' \u2014 '+t.subject:''),
        body:body, attachments:[], staff_name:friendlyStaffName()
      })
    });
    var result=await resp.json();
    if(!resp.ok) throw new Error(result.error||'Email send failed');
    if(!S.messages[ticketId])S.messages[ticketId]=[];
    S.messages[ticketId].push(noteRow);
    var tb=document.getElementById('threadBox');
    if(tb)tb.innerHTML=renderThread(S.messages[ticketId], showingNotes);
    var ovl=document.getElementById('fw-overlay'); if(ovl)ovl.remove();
    toast('Conversation forwarded to '+to);
  }catch(e){
    if(noteRow&&noteRow.id){try{await sb.from('ticket_messages').delete().eq('id',noteRow.id);}catch(_){}}
    if(btn){btn.disabled=false;btn.textContent='\u2197 Forward';}
    toast('Forward failed: '+e.message,true);
  }
}

async function submitRefund(ticketId){
  const t = S.tickets.find(x=>x.id===ticketId);
  const btn = document.getElementById('refundSubmitBtn');
  const refundAmount = parseFloat(document.getElementById('refundAmount').value);
  const restockingFee = parseFloat(document.getElementById('refundRestockingFee').value) || 0;
  const reason = document.getElementById('refundReason').value.trim();

  if(!refundAmount || refundAmount <= 0){
    toast('Enter a valid refund amount', true);
    return;
  }

  const selectedItems = refundLineItems.filter(i => i.selected && i.shopify_line_item_id);

  btn.disabled = true;
  btn.textContent = 'Processing...';

  try{
    const rows = await findSalesByOrderNumber(t.order_number);
    const shopifyOrderId = rows[0]?.shopify_order_id;

    const resp = await fetch(`${SUPABASE_URL}/functions/v1/process-shopify-refund`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({
        ticket_id: ticketId,
        ticket_number: t.ticket_number,
        shopify_order_id: shopifyOrderId,
        line_items: selectedItems.map(i => ({ shopify_line_item_id: i.shopify_line_item_id, quantity: i.qty })),
        refund_amount: refundAmount,
        restocking_fee: restockingFee,
        reason
      })
    });
    const result = await resp.json();
    if(!resp.ok) throw new Error(result.error || 'Refund failed');

    const { data: updated } = await sb.from('tickets').select('*').eq('id', ticketId).single();
    if(updated){
      const idx = S.tickets.findIndex(x=>x.id===ticketId);
      if(idx!==-1) S.tickets[idx] = updated;
      S.activeTicket = updated;
      await loadMessages(ticketId);
      renderTicketPanel(updated);
    }
    closeModal();
    toast(`Refund of $${refundAmount.toFixed(2)} processed successfully`);
  }catch(e){
    toast('Refund failed: ' + e.message, true);
    btn.disabled = false;
    btn.textContent = 'Process Refund';
  }
}
window.submitRefund = submitRefund;

async function confirmMerge(sourceId, targetId){
  const source = S.tickets.find(x=>x.id===sourceId);
  const target = S.tickets.find(x=>x.id===targetId);
  if(!source || !target) return;
  if(!confirm(`Merge ticket #${source.ticket_number} into #${target.ticket_number}? This moves all its messages and closes #${source.ticket_number}.`)) return;

  try{
    // Move all messages from source to target. .select() returns the moved rows
    // so we can confirm the move actually took -- a 0-row result here (rather
    // than an error) is the classic silent half-merge and we surface it loudly.
    const { data: movedRows, error: moveErr } = await sb.from('ticket_messages')
      .update({ ticket_id: targetId }).eq('ticket_id', sourceId).select('id');
    if(moveErr) throw new Error('moving messages: ' + moveErr.message);

    // Drop a system note in the target thread noting the merge. Error-checked
    // now (it was fire-and-forget before) so a rejected insert can't leave a
    // half-done merge with no trace.
    const { error: noteErr } = await sb.from('ticket_messages').insert({
      ticket_id: targetId,
      sender_type: 'system',
      sender_name: 'System',
      body: `Ticket #${source.ticket_number} ("${source.subject}") was merged into this ticket by ${S.user.email}. ${(movedRows||[]).length} message(s) moved over.`,
      is_internal_note: true
    });
    if(noteErr) throw new Error('writing merge note: ' + noteErr.message);

    // Close and flag the source ticket
    const { data: updatedSource, error: srcErr } = await sb.from('tickets')
      .update({ status:'closed', merged_into_id: targetId, resolved_at: new Date().toISOString(), updated_at: new Date().toISOString() })
      .eq('id', sourceId).select().single();
    if(srcErr) throw new Error('closing source ticket: ' + srcErr.message);
    if(!updatedSource) throw new Error('source ticket update matched 0 rows -- merge_into_id may not have saved');

    const { data: updatedTarget, error: tgtErr } = await sb.from('tickets')
      .update({ updated_at: new Date().toISOString() })
      .eq('id', targetId).select().single();
    if(tgtErr) throw new Error('touching target ticket: ' + tgtErr.message);

    const si = S.tickets.findIndex(x=>x.id===sourceId);
    if(si!==-1) S.tickets[si] = updatedSource;
    const ti = S.tickets.findIndex(x=>x.id===targetId);
    if(ti!==-1) S.tickets[ti] = updatedTarget;
    delete S.messages[sourceId];
    await loadMessages(targetId);

    closeModal();
    closePanel();
    toast(`Merged into ticket #${updatedTarget.ticket_number}`);
    renderNav();
    renderPage();
  }catch(e){
    toast('Merge failed: ' + e.message, true);
  }
}
window.confirmMerge = confirmMerge;

async function sendMessage(ticketId){
  const box = document.getElementById('msgBox');
  const composer = document.getElementById('replyComposer');
  const isNote = composer && composer.getAttribute('data-mode') === 'notes';
  const body = box.value.trim();
  if(!body) return;
  const t = S.tickets.find(x=>x.id===ticketId);
  // A conversation reply always emails the customer automatically -- no opt-in
  // checkbox to forget. Exceptions: live chat (delivered in the widget) and
  // internal notes (staff-only).
  const shouldEmail = !isNote && !!(t && t.customer_email) && !(t && t.is_live_chat);

  try{
    const { data, error } = await sb.from('ticket_messages').insert({
      ticket_id: ticketId,
      sender_type: 'staff',
      sender_name: S.user.email,
      body,
      is_internal_note: isNote,
      attachments: pendingMsgAttachments
    }).select().single();
    if(error) throw error;
    if(!S.messages[ticketId]) S.messages[ticketId] = [];
    S.messages[ticketId].push(data);
    box.value = '';
    pendingMsgAttachments = [];
    const preview = document.getElementById('msgAttachPreview');
    if(preview) preview.innerHTML = '';
    document.getElementById('threadBox').innerHTML = renderThread(S.messages[ticketId], showingNotes);
    scrollThreadToBottom();
    // Bump activity, and on an actual reply (not an internal note) record who
    // replied for the tracker, then refresh the subtle strip in place.
    const _replyStamp = { updated_at: new Date().toISOString() };
    if(!isNote){
      _replyStamp.last_reply_by = (S.user && S.user.email) || null;
      _replyStamp.last_reply_at = new Date().toISOString();
      _replyStamp.last_direction = 'outbound';
      const _me = (S.user && S.user.email) || null;
      if(_me && t && !t.assigned_to){ _replyStamp.assigned_to = _me; }
    }
    try{
      const { data: _tu } = await sb.from('tickets').update(_replyStamp).eq('id', ticketId).select().single();
      if(_tu){
        const _i = S.tickets.findIndex(x=>x.id===ticketId);
        if(_i!==-1) S.tickets[_i] = _tu;
        if(S.activeTicket && S.activeTicket.id===ticketId) S.activeTicket = _tu;
        const _tk = document.getElementById('tkTracker');
        if(_tk && S.activeTicket) _tk.outerHTML = renderTicketTracker(S.activeTicket);
      }
      if(!isNote && _replyStamp.assigned_to) toast('Assigned to you');
    }catch(_){ /* non-critical */ }

    if(!isNote && !(t && t.is_live_chat) && !(t && t.customer_email)){
      toast("Reply saved, but there's no email on file so the customer won't receive it. Add a customer email to reach them.", true);
    }

    if(shouldEmail && t && t.customer_email){
      toast('Sending email...');
      try{
        const resp = await fetch(`${SUPABASE_URL}/functions/v1/send-ticket-email`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY },
          body: JSON.stringify({
            ticket_id: ticketId,
            ticket_number: t.ticket_number,
            message_id: data.id,
            to: t.customer_email,
            subject: `TGK Motorsport Support #${String(t.ticket_number).padStart(4,'0')}`,
            body,
            attachments: data.attachments || [],
            staff_name: friendlyStaffName()
          })
        });
        const result = await resp.json();
        if(!resp.ok) throw new Error(result.error || 'Email send failed');
        data.emailed_at = new Date().toISOString();
        document.getElementById('threadBox').innerHTML = renderThread(S.messages[ticketId], showingNotes);
        scrollThreadToBottom();
        toast('Reply sent and emailed to ' + t.customer_email);
      }catch(emailErr){
        toast('Message saved, but email failed to send: ' + emailErr.message, true);
      }
    }
  }catch(e){
    toast('Failed to send: ' + e.message, true);
  }
}

/* ============================================================
   ORDER NUMBER LOOKUP HELPER
   Shopify order numbers are usually stored with a leading '#'
   (e.g. "#1041"), but staff/customers often type just "1041".
   Try both forms so this isn't a silent gotcha.
   ============================================================ */
async function findSalesByOrderNumber(orderNumberInput){
  const raw = (orderNumberInput||'').trim();
  if(!raw) return [];
  const variants = raw.startsWith('#') ? [raw, raw.slice(1)] : [raw, '#'+raw];
  for(const variant of variants){
    const { data, error } = await sb.from('sales').select('*').eq('order_number', variant);
    if(!error && data && data.length) return data;
  }
  return [];
}
window.findSalesByOrderNumber = findSalesByOrderNumber;

/* ============================================================
   ORDER → PARTS CONTEXT (expands assemblies into BOM children,
   since a customer issue is often with a component, not the
   top-level assembly they actually purchased)
   ============================================================ */
async function fetchOrderContext(orderNumber){
  if(!orderNumber) return null;
  const rows = await findSalesByOrderNumber(orderNumber);
  if(!rows.length) return null;
  const pns = [...new Set(rows.map(r=>r.pn).filter(Boolean))];
  let children = [];
  if(pns.length){
    const { data: bomRows } = await sb.from('bom_items').select('parent_pn,child_pn,qty').in('parent_pn', pns);
    children = bomRows || [];
  }
  return { rows, pns, children };
}

function buildPartOptions(ctx){
  const opts = [];
  ctx.pns.forEach(pn=>{
    const row = ctx.rows.find(r=>r.pn===pn);
    opts.push({ pn, label: `${pn}${row && row.qty ? ' (qty '+row.qty+')' : ''}`, indent:false });
    ctx.children.filter(c=>c.parent_pn===pn).forEach(k=>{
      opts.push({ pn: k.child_pn, label: `↳ ${k.child_pn} — component of ${pn}`, indent:true });
    });
  });
  return opts;
}

function renderPartOptionsHtml(opts, onClickFn){
  if(!opts.length) return `<div style="font-size:var(--t-sm);color:var(--text3)">No parts found on this order.</div>`;
  return `<div class="form-label" style="margin:8px 0 4px">Parts On This Order — Click To Select</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      ${opts.map(o=>`<button type="button" class="btn btn-sm ${o.indent?'btn-teal':''}" onclick="${onClickFn}('${o.pn.replace(/'/g,"\\'")}')">${escapeHtml(o.label)}</button>`).join('')}
    </div>`;
}

  if(!orderNumber){ box.innerHTML=''; return; }
  box.innerHTML = `<div style="font-size:var(--t-sm);color:var(--text3)">Looking up order...</div>`;
  const ctx = await fetchOrderContext(orderNumber);
  if(!ctx){
    box = document.getElementById('tkPartOptions');
    if(box) box.innerHTML = `<div style="font-size:var(--t-sm);color:var(--text3)">No matching order found.</div>`;
    return;
  }
  const t = S.tickets.find(x=>x.id===ticketId);
  const first = ctx.rows[0];
  const patch = {};
  if(t && !t.customer_name && first.customer_name) patch.customer_name = first.customer_name;
  if(t && !t.customer_email && first.customer_email) patch.customer_email = first.customer_email;
  if(t && !t.customer_phone && first.customer_phone) patch.customer_phone = first.customer_phone;

  // Confirmed against the real `sales` schema: shipping_address1/2, shipping_city,
  // shipping_province, shipping_zip, shipping_country. Keys here match the ERP's
  // own shipping_details shape exactly: name/street1/street2/city/state/postal_code/country.
  const pick = (...keys) => { for(const k of keys){ if(first[k]) return first[k]; } return ''; };
  const hasExistingAddress = t && t.shipping_address && (t.shipping_address.street1 || t.shipping_address.city);
  if(t && !hasExistingAddress){
    const autoAddress = {
      name: t.customer_name || first.customer_name || '',
      street1: pick('shipping_address1'),
      street2: pick('shipping_address2'),
      city: pick('shipping_city'),
      state: pick('shipping_province'),
      postal_code: pick('shipping_zip'),
      country: pick('shipping_country') || 'US'
    };
    if(autoAddress.street1 || autoAddress.city) patch.shipping_address = autoAddress;
  }

  if(Object.keys(patch).length){
    for(const [field,value] of Object.entries(patch)) await updateTicketField(ticketId, field, value);
    renderTicketPanel(S.activeTicket); // rebuilds the panel; tkPartOptions div is fresh, so re-grab it
  }
  box = document.getElementById('tkPartOptions');
  if(!box) return;
  box.innerHTML = renderPartOptionsHtml(buildPartOptions(ctx), `selectTkPn_${ticketId.replace(/-/g,'_')}`);
  window[`selectTkPn_${ticketId.replace(/-/g,'_')}`] = (pn)=>{
    const pnInput = document.getElementById('tkPnInput');
    if(pnInput) pnInput.value = pn;
    updateTicketField(ticketId, 'pn', pn);
  };
}

async function createTicket(){
  const subject = document.getElementById('ntSubject').value.trim();
  if(!subject){ toast('Subject is required', true); return; }
  const payload = {
    subject,
    customer_name: document.getElementById('ntName').value.trim() || null,
    customer_email: document.getElementById('ntEmail').value.trim() || null,
    order_number: document.getElementById('ntOrder').value.trim() || null,
    pn: document.getElementById('ntPn').value.trim() || null,
    priority: document.getElementById('ntPriority').value,
    source: document.getElementById('ntSource').value,
    status: 'open'
  };
  try{
