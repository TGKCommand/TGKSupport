<style>
/* TGK machined design system: aluminum field, hairline-ringed plates, forged-carbon trim,
   teal-orange signature. Built into the base rules (single source of truth) -- there is no
   override/skin layer. New component variants: write them as .btn.btn-x (two classes) and
   restate color on :hover. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f8fa;--bg3:#f0f2f5;--bg4:#e9ebee;--bg5:#dde0e5;
  --border:#e2e6eb;--border2:#c8cdd5;
  --text:#111827;--text2:#374151;--text3:#565f6d;
  --teal:#0d9488;--teal-d:#0f766e;--teal-dim:rgba(13,148,136,.09);
  --orange:#ea580c;--orange-d:#c2410c;--orange-dim:rgba(234,88,12,.09);
  --red:#dc2626;--red-dim:rgba(220,38,38,.09);
  --green:#16a34a;--green-dim:rgba(22,163,74,.09);
  --yellow:#d97706;--yellow-dim:rgba(217,119,6,.09);
  --blue:#2563eb;--blue-dim:rgba(37,99,235,.09);
  --purple:#7c3aed;--purple-dim:rgba(124,58,237,.09);
  --r:4px;--r-lg:6px;--r-sm:4px;--r-md:8px;--r-pill:999px;--t-xs:10px;--t-sm:11.5px;--t-md:12.5px;--t-lg:15px;--t-xl:16px;--t-2xl:20px;--font:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace;
  --hdrh:64px;
  /* Forged-carbon trim (KPI band, table headers, sidebar status pill) */
  --cb-c:#0D0F10;
  --cb-i:none;
  --cb-s:100% 100%,100% 100%,100% 100%,auto 240px;
  --cb-p:0 0,0 0,0 0,0 0;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:var(--t-lg);line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
body{font-size:var(--t-md)}
input,button,select,textarea{font-family:var(--font)}
.shell{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar-wrap{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100vh;overflow:hidden}
.sidebar{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.sidebar-logo{position:sticky;top:0;z-index:30;background:var(--bg2);height:var(--hdrh);min-height:var(--hdrh);max-height:var(--hdrh);box-sizing:border-box;padding:0 16px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.sidebar-logo::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:var(--teal)}
.sidebar-brand{font-size:var(--t-sm);font-weight:800;color:var(--teal);letter-spacing:.18em;text-transform:uppercase}
.sidebar-brand small{display:block;font-size:var(--t-lg);font-weight:700;color:var(--text);letter-spacing:0;text-transform:none;margin-top:2px}
.sidebar-section{padding:14px 14px 4px;font-size:var(--t-xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);opacity:.85}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 14px;margin:1px 8px;border-radius:var(--r-sm);cursor:pointer;transition:all .12s;border:1px solid transparent;background:transparent;width:calc(100% - 16px);text-align:left;color:var(--text2);font-size:var(--t-md);font-weight:500;outline:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--teal-dim);color:var(--teal);border-color:rgba(13,148,136,.2)}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:all .15s}
.nav-sub{margin:2px 8px 8px 8px;display:flex;flex-direction:column;gap:1px}
.nav-subitem{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 26px;border-radius:var(--r-md);cursor:pointer;border:1px solid transparent;background:transparent;color:var(--text3);font-size:var(--t-sm);text-align:left;width:100%;transition:all .12s}
.nav-subitem:hover{background:var(--bg3);color:var(--text)}
.nav-subitem.active{background:var(--teal-dim);color:var(--teal);border-color:rgba(13,148,136,.2)}
.nav-subitem .nav-badge{margin-left:auto}
.nav-subdot{width:4px;height:4px;border-radius:50%;background:var(--text3);flex-shrink:0}
.nav-subitem.active .nav-subdot{background:var(--teal)}
.nav-item.active .nav-dot{background:var(--teal)}
.nav-badge{font-size:var(--t-xs);font-family:var(--mono);font-weight:700;color:var(--text3);background:var(--bg4);border:1px solid var(--border);padding:1px 6px;border-radius:var(--r-md);min-width:22px;text-align:center;margin-left:auto}
.nav-item.active .nav-badge{color:var(--teal);background:var(--teal-dim);border-color:rgba(13,148,136,.22)}
.nav-item.alert-nav .nav-badge{color:var(--red);background:var(--red-dim);border-color:rgba(224,85,85,.25)}
.sidebar-footer{margin-top:auto;padding:10px 14px 14px;border-top:1px solid var(--border);flex-shrink:0}
.sync-pill{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 10px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0}
.sync-dot.ok{background:var(--green)}
.sync-label{font-size:var(--t-sm);color:var(--text2);flex:1;font-weight:500}
.sync-sub{font-size:var(--t-xs);color:var(--text3)}
.sidebar-footer .sync-pill{background-color:var(--cb-c);background-image:var(--cb-i);background-size:100% 100%,100% 100%,100% 100%,auto 120px;background-position:var(--cb-p);border:none;border-radius:var(--r-sm);padding:8px 12px;box-shadow:0 2px 6px rgba(17,24,39,.3),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.55)}
.sidebar-footer .sync-label{color:#E2E8EB}
.sidebar-footer .sync-sub{color:#B7C1C7}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:#ECEEF0}
.topbar{height:var(--hdrh);min-height:var(--hdrh);background:rgba(255,255,255,.9);backdrop-filter:blur(3px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;z-index:10;position:relative}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--teal) 0,var(--teal) 6%,var(--orange) 55%,rgba(0,0,0,0) 94%);opacity:.7}
.topbar-title{font-size:var(--t-2xl);font-weight:800;color:var(--text);letter-spacing:.005em;display:flex;flex-direction:column;gap:2px;line-height:1.1}
/* Nameplate title: eyebrow + title, built by the nameplate script at the end of the page */
.tb-eb{font-family:var(--mono);font-size:var(--t-xs);font-weight:600;letter-spacing:.18em;color:var(--text3)}
.tb-tt{font-size:var(--t-2xl);font-weight:800;text-transform:uppercase;letter-spacing:.012em;color:var(--text)}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:7px}
.content{flex:1;overflow-y:auto;overflow-x:auto;padding:20px 24px;position:relative}

/* ============================================================
   MOBILE — sidebar becomes an off-canvas drawer below 768px
   instead of a permanently-visible 220px column. On a ~375px
   phone screen, a fixed 220px sidebar was leaving barely 150px
   for actual content — effectively unusable.
   ============================================================ */
.mobile-menu-btn{display:none}
#sidebar-scrim{display:none}
@media(max-width:768px){
  .mobile-menu-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;flex-shrink:0}
  .mobile-menu-btn:hover{background:var(--bg3)}
  .sidebar-wrap{position:fixed;top:0;left:0;bottom:0;z-index:200;width:250px;min-width:250px;transform:translateX(-100%);transition:transform .22s ease;box-shadow:4px 0 24px rgba(0,0,0,.25)}
  .sidebar-wrap.mobile-open{transform:translateX(0)}
  #sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:199}
  #sidebar-scrim.active{display:block}
  .topbar{padding:0 12px;gap:8px}
  .content{padding:14px 12px}
  table{font-size:var(--t-sm)}
  .modal{width:calc(100vw - 24px);padding:16px}
  #tk-panel{width:100vw;max-width:100vw}
  .kpi-grid-4,.kpi-grid-5,.kpi-grid-6{grid-template-columns:repeat(2,1fr)}
  .cols-2{grid-template-columns:1fr}
  .stack-sm{grid-template-columns:1fr!important}
  /* Ticket list: table -> cards (important: beats the base .tk-cards{display:none} which appears later in source) */
  .tk-desktop{display:none!important}
  .tk-cards{display:flex!important;flex-direction:column;gap:10px}
  /* Filter bar: stack full-width, tappable */
  .filter-bar{flex-direction:column;align-items:stretch;gap:10px}
  .filter-bar .search-wrap{max-width:none;min-width:0;width:100%}
  .filter-bar .form-input{width:100%!important}
  .filter-bar .checkbox-row{padding:6px 2px}
  .filter-bar > .btn{width:100%;justify-content:center}
  /* Bigger touch targets; 16px inputs stop iOS zoom-on-focus */
  .form-input{min-height:44px;font-size:var(--t-xl);padding:11px 12px}
  .btn{min-height:42px;padding:10px 14px;font-size:var(--t-md)}
  .btn-sm{min-height:38px}
  .topbar-actions .btn{padding:9px 12px}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:var(--t-sm);font-weight:600;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;transition:all .12s;letter-spacing:.01em}
.btn:hover{background:#F2F4F6;color:var(--text);transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-d);border-color:var(--orange-d);color:#fff}
.btn-teal{background:var(--teal-dim);color:var(--teal);border-color:rgba(13,148,136,.22)}
.btn-teal:hover{background:rgba(13,148,136,.13);border-color:rgba(13,148,136,.35);color:var(--teal)}
/* Irreversible actions only (permanent delete, empty archive, cancel an external
   order) -- NOT archive/soft-delete, which can be restored and should stay as a
   plain or muted button. */
/* Written as .btn.btn-danger (two classes) so it always beats .btn and .btn:hover
   regardless of source order -- the same rule every button variant should follow. */
.btn.btn-danger{background:var(--red-dim);color:var(--red);border-color:rgba(220,38,38,.25)}
.btn.btn-danger:hover{background:rgba(220,38,38,.16);border-color:rgba(220,38,38,.4);color:var(--red)}
/* Solid tier -- same relationship to .btn-danger as .btn-primary has to .btn-teal.
   Reserved for the single highest-stakes confirm in a flow (e.g. processing a
   real refund), not for ordinary row/list deletes -- those use .btn-danger. */
.btn.btn-danger-solid{background:var(--red);border-color:var(--red);color:#fff}
.btn.btn-danger-solid:hover{background:#b91c1c;border-color:#b91c1c;color:#fff}
.btn-sm{padding:4px 10px;font-size:var(--t-sm)}

/* Panels / KPIs */
.panel{background:rgba(255,255,255,.78);border:1px solid transparent;border-radius:var(--r-lg);padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(14,20,24,.05),0 0 0 1px var(--border)}
.panel-title{font-size:var(--t-xs);font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--text2);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
/* KPI cluster: one continuous forged-carbon sheet */
.kpi-grid{display:grid;gap:0;margin-bottom:18px;border-radius:var(--r-lg);overflow:hidden;background-color:var(--cb-c);background-image:var(--cb-i);background-size:var(--cb-s);background-position:var(--cb-p);box-shadow:0 3px 12px rgba(17,24,39,.32),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.6)}
.kpi-grid-4{grid-template-columns:repeat(4,1fr)}
.kpi-grid-5{grid-template-columns:repeat(5,1fr)}
.kpi-grid-6{grid-template-columns:repeat(6,1fr)}
.kpi,.kpi:hover{background:transparent!important;border:none;border-left:1px solid rgba(255,255,255,.22);border-radius:0;padding:16px 18px}
.kpi:first-child{border-left:none}
.kpi-label{font-size:var(--t-xs);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#E4E9EC;text-shadow:0 1px 2px rgba(0,0,0,.75)}
.kpi-value{font-size:27px;font-weight:600;line-height:1.1;font-family:var(--mono);margin-top:4px;color:#EDF1F0;text-shadow:0 1px 3px rgba(0,0,0,.75);letter-spacing:-.01em}
.kpi-sub{font-size:var(--t-sm);color:#BCC6CC;text-shadow:0 1px 2px rgba(0,0,0,.75);margin-top:3px}
.kpi-teal .kpi-value{color:#2BC7B1}
.kpi-green .kpi-value{color:#4ADE9F}
.kpi-orange .kpi-value{color:#F0812E}
.kpi-red .kpi-value{color:#FF8A5B}
.kpi-yellow .kpi-value{color:#F2C14E}
.kpi-blue .kpi-value{color:#7FB5FF}
/* Inline color:var(--x) on a KPI value is remapped to the carbon-legible tone */
.kpi .kpi-value[style*="var(--text)"]{color:#EDF1F0!important}
.kpi .kpi-value[style*="var(--red)"]{color:#FF8A5B!important}
.kpi .kpi-value[style*="var(--yellow)"]{color:#F2C14E!important}
.kpi .kpi-value[style*="var(--green)"]{color:#4ADE9F!important}
.kpi .kpi-value[style*="var(--orange)"]{color:#F0812E!important}
.kpi .kpi-value[style*="var(--teal)"]{color:#2BC7B1!important}

/* Table */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-md);border:1px solid transparent;background:rgba(255,255,255,.66);box-shadow:0 1px 2px rgba(14,20,24,.05),0 0 0 1px var(--border)}
table{width:100%;border-collapse:collapse;font-size:var(--t-md)}
/* Continuous carbon header band + teal bezel */
thead{background-color:var(--cb-c);background-image:var(--cb-i);background-size:100% 100%,100% 100%,100% 100%,auto 140px;background-position:var(--cb-p);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
thead th{background:transparent;padding:10px 12px;text-align:left;font-size:var(--t-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#E8EDF0;text-shadow:0 1px 2px rgba(0,0,0,.75);border-bottom:2px solid rgba(13,148,136,.6);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover td{background:rgba(13,148,136,.05)}
tbody td{padding:10px 12px;color:var(--text2);vertical-align:middle;font-size:var(--t-md)}
td.main-col{color:var(--text);font-weight:500}
.rowlink{cursor:pointer}
.rowlink:hover td{background:var(--teal-dim)!important}
.pn{font-family:var(--mono);font-size:var(--t-sm);color:var(--text3)}
.tk-cards{display:none}
.tk-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px;cursor:pointer;display:flex;flex-direction:column;gap:7px}
.tk-card:active{background:var(--bg3)}
.tk-card-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tk-card-num{font-family:var(--mono);font-size:var(--t-sm);color:var(--text3);font-weight:600}
.tk-card-subj{font-size:var(--t-lg);font-weight:600;color:var(--text);line-height:1.32}
.tk-card-meta{font-size:var(--t-sm);color:var(--text3);display:flex;flex-wrap:wrap;gap:3px 12px}
.tk-card-chk{width:20px;height:20px;flex-shrink:0}

/* Pills */
.pill{display:inline-flex;align-items:center;padding:2.5px 9px;font-size:var(--t-xs);font-weight:600;border-radius:var(--r-sm);border:1px solid transparent}
.pill-teal{background:var(--teal-dim);color:var(--teal);border-color:rgba(13,148,136,.2)}
.pill-orange{background:var(--orange-dim);color:var(--orange);border-color:rgba(224,123,40,.2)}
.pill-red{background:var(--red-dim);color:var(--red);border-color:rgba(224,85,85,.2)}
.pill-green{background:var(--green-dim);color:var(--green);border-color:rgba(76,175,125,.2)}
.pill-yellow{background:var(--yellow-dim);color:var(--yellow);border-color:rgba(212,168,67,.2)}
.pill-muted{background:var(--bg4);color:var(--text3);border-color:var(--border)}
.src-tag{font-size:var(--t-xs);color:var(--text3);border:1px solid var(--border);padding:2px 8px;border-radius:var(--r-md)}

/* Filters */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:300px}
.search-wrap input{width:100%;padding:7px 10px 7px 30px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:var(--t-md);outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--teal)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:var(--t-md);pointer-events:none}
input[type=text],input[type=email],select,textarea{background:var(--bg);border-color:var(--border2)}
.form-input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:9px 11px;font-size:var(--t-md);outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--teal)}
select.form-input{cursor:pointer}

/* Modal / overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.overlay.hidden{display:none}
.modal{background:var(--bg);border:1px solid transparent;border-radius:var(--r-lg);width:480px;max-width:96vw;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 16px 48px rgba(14,20,24,.16),0 0 0 1px var(--border2)}
.modal-title{font-size:var(--t-lg);font-weight:700;margin-bottom:18px}
.form-row{display:grid;gap:10px;margin-bottom:12px}
.form-row.cols-2{grid-template-columns:1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:var(--t-xs);font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}

/* Slide-over ticket panel (styled after the ERP's cart panel) */
#tk-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:600;display:none}
#tk-overlay.open{display:block}
#tk-panel{position:fixed;top:0;right:0;bottom:0;width:var(--tk-w,960px);max-width:96vw;background:var(--bg);border-left:1px solid var(--border2);z-index:601;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:-4px 0 24px rgba(0,0,0,.12)}
#tk-panel.open{transform:translateX(0)}
#tk-panel[data-w="narrow"]{--tk-w:520px}
#tk-panel[data-w="wide"]{--tk-w:960px}
#tk-panel[data-w="full"]{--tk-w:1600px}
/* Once there is real width to work with, stop stretching single fields across the whole
   panel - two columns reads far better. Below this the panel stays single-column. */
#tk-panel[data-w="wide"] .tk-body .form-row.cols-2,
#tk-panel[data-w="full"] .tk-body .form-row.cols-2{grid-template-columns:1fr 1fr}
#tk-panel .tk-body{max-width:100%}
.tk-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);gap:10px;flex-shrink:0;background:var(--bg2)}
.tk-head-title{font-size:var(--t-lg);font-weight:700;color:var(--text);flex:1}
.tk-tracker{font-size:var(--t-xs);color:var(--text3);padding:4px 18px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;opacity:.75;letter-spacing:.01em}
.tk-tracker .tk-tracker-dot{opacity:.45}
.tk-close{background:none;border:none;font-size:var(--t-xl);color:var(--text3);cursor:pointer;padding:2px 6px;border-radius:var(--r-sm)}
.tk-close:hover{background:var(--bg4);color:var(--text)}
.tk-body{flex:1;overflow-y:auto;padding:16px 18px}
#threadBox{max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-lg);padding:10px;background:var(--bg2)}
.tk-foot{padding:14px 18px;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg);display:flex;gap:8px}

.linked-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;margin:10px 0;font-size:var(--t-md);color:var(--text2)}
.linked-box .lk-title{font-weight:700;font-size:var(--t-xs);color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
/* ---- Wholesale application card (v1.22) ---- */
.wsa{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--bg);margin:10px 0;overflow:hidden}
.wsa-hd{padding:11px 13px;background:var(--bg2);border-bottom:1px solid var(--border)}
.wsa-hd-t{font-size:var(--t-sm);font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:8px}
.wsa-hd-b{font-size:var(--t-lg);font-weight:700;color:var(--text);margin-top:5px;line-height:1.3}
.wsa-hd-s{font-size:var(--t-sm);color:var(--text3);margin-top:2px}
.wsa-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.wsa-sec{padding:10px 13px;border-bottom:1px solid var(--border)}
.wsa-sec:last-child{border-bottom:none}
.wsa-sec-t{font-size:var(--t-xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:7px}
.wsa-row{display:grid;grid-template-columns:128px 1fr;gap:10px;padding:4.5px 0;align-items:baseline}
.wsa-row+.wsa-row{border-top:1px solid var(--border)}
.wsa-k{font-size:var(--t-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);line-height:1.5}
.wsa-v{font-size:var(--t-md);color:var(--text);word-break:break-word;line-height:1.45}
.wsa-v a{color:var(--blue);text-decoration:none}
.wsa-v a:hover{text-decoration:underline}
.wsa-v.mono{font-family:var(--mono);font-size:var(--t-sm)}
.wsa-v.strong{font-weight:700}
.wsa-blk{font-size:var(--t-md);color:var(--text2);white-space:pre-wrap;line-height:1.5}
.wsa-blk.muted{color:var(--text3);font-style:italic}
.wsa-addr{font-size:var(--t-md);color:var(--text);line-height:1.55;white-space:pre-wrap}
.wsa-code{display:inline-block;font-family:var(--mono);font-size:var(--t-md);font-weight:700;color:var(--teal);background:var(--teal-dim);border:1px solid rgba(13,148,136,.25);border-radius:var(--r);padding:3px 9px;letter-spacing:.04em}
.wsa-acts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 13px;background:var(--bg2);border-top:1px solid var(--border)}
.wsa-btn{font-family:inherit;font-size:var(--t-sm);font-weight:700;letter-spacing:.03em;padding:6px 11px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;transition:background-color .12s,border-color .12s,color .12s}
.wsa-btn:hover{background:var(--bg3);border-color:var(--text3);color:var(--text)}
.wsa-btn.on{background:var(--teal-dim);border-color:rgba(13,148,136,.35);color:var(--teal)}
.wsa-warn{margin:0;padding:9px 13px;background:var(--orange-dim);border-top:1px solid rgba(234,88,12,.25);font-size:var(--t-sm);color:var(--orange);font-weight:600;line-height:1.45}
.wsa-warn ul{margin:5px 0 0;padding-left:16px;font-weight:500}
.wsa-raw{margin:0;padding:11px 13px;background:var(--bg3);border-top:1px solid var(--border);font-family:var(--mono);font-size:var(--t-sm);color:var(--text2);white-space:pre-wrap;word-break:break-word;line-height:1.5;max-height:320px;overflow:auto}

.tabs-row{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:14px}
.tab{padding:8px 14px;font-size:var(--t-sm);font-weight:600;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--teal);border-bottom-color:var(--teal)}

.msg{border-radius:var(--r-lg);padding:10px 13px;margin-bottom:8px;font-size:var(--t-md);line-height:1.5}
.msg.customer{background:var(--blue-dim)}
.msg.staff{background:var(--teal-dim)}
.msg.system{background:var(--bg3);color:var(--text3);font-style:italic}
.msg.note{background:var(--orange-dim);border:1px dashed var(--orange)}
.msg .meta{font-size:var(--t-xs);color:var(--text3);margin-bottom:3px;display:flex;gap:6px;align-items:center;font-weight:600}
.checkbox-row{display:flex;align-items:center;gap:6px;font-size:var(--t-sm);color:var(--text3);margin-top:6px}

#toast{position:fixed;bottom:20px;right:20px;background:var(--bg4);border:1px solid var(--border2);color:var(--text);padding:9px 16px;border-radius:var(--r-sm);font-size:var(--t-md);z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.1)}
#toast.show{opacity:1}
#toast.err{border-color:rgba(220,38,38,.4);color:var(--red)}

.empty{text-align:center;padding:40px;color:var(--text3);font-size:var(--t-md)}.watermark{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:0;opacity:.09}.watermark img{width:640px;height:auto}

/* Login gate */
#auth-gate{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center}
#auth-gate.hidden{display:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#ECEEF0}

.tk-head{gap:6px}

<style id="tgk-rebate">
#rebateCard{border:2px solid #0d9488;border-radius:10px;padding:16px;margin-bottom:16px;background:var(--bg)}
#rebateCard.rb-ok{border-color:#16a34a}
#rebateCard.rb-done{border-color:var(--border)}
#rebateCard .rb-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
#rebateCard .rb-title{font-weight:700;font-size:15px}
#rebateCard .rb-grid{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:18px;align-items:start}
#rebateCard .rb-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
#rebateCard table{width:100%;border-collapse:collapse;font-size:13px}
#rebateCard td{padding:6px 0;border-bottom:1px solid var(--border)}
#rebateCard td.n{text-align:right;white-space:nowrap;padding-left:12px}
#rebateCard .rb-amt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
#rebateCard .rb-amt .form-input{width:130px}
#rebateCard .rb-shots{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
#rebateCard .rb-shots img{width:100%;border:1px solid var(--border);border-radius:6px;display:block}
#rebateCard .rb-warn{margin-top:10px;padding:9px 12px;border-left:4px solid #f5a524;background:rgba(245,165,36,.14);font-size:12.5px;border-radius:4px}
#rebateCard .rb-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#rebateCard .rb-note{font-size:12px;color:var(--text3);margin-top:10px}
@media(max-width:768px){#tk-panel a.src-tag{display:inline-flex;align-items:center;min-height:40px;padding:0 12px}#rebateCard .rb-grid{grid-template-columns:minmax(0,1fr)}#rebateCard .rb-btns .btn{flex:1 1 100%}#rebateCard .rb-amt .form-input{width:100%}}
</style>
</head>

<script>
/* ============================================================
   CONFIG — same Supabase project as the ERP
   ============================================================ */
const SUPABASE_URL = "https://piamamighqiielfztgic.supabase.co";

const TGK_SUPPORT_VERSION = 'v2.00';
const TGK_SUPPORT_BUILD_DATE = '2026-10-22';
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYW1hbWlnaHFpaWVsZnp0Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjkxMzUsImV4cCI6MjA5MzQ0NTEzNX0.YwLflTw6F4cRzmY78QoAY6Zud2IHGVP5xL_yvMFxheA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const IDLE_TIMEOUT_MS = 8 * 60 * 60 * 1000; // 8 hours, matches the ERP
const CHAT_IDLE_TIMEOUT_MS = 30 * 60 * 1000; // 30 minutes of no activity in this tab before auto-going-offline. Safe to exceed the server's 10-min staleness window: the 3-min heartbeat keeps the server fresh while the toggle is on, so this is the sole idle enforcer; the server window only catches dead tabs.

/* ============================================================
   STATE
   ============================================================ */
const S = {
  user: null,
  role: 'customer_service',
  page: 'dashboard',
  tickets: [],
  messages: {},
  activityLog: {},
  selectedTickets: new Set(),
  selectedEmails: new Set(),
  warranty: [],
  shipErrors: [],
  quarantine: [],
  dealers: [],
  team: [],
  templates: [],
  settings: {},
  settingsTable: 'unknown',
  settingsTab: 'categories',
  activeTicket: null,
  emails: [],
  emailMessages: {},
  activeEmail: null,
  emailFilters: { view: 'open', q: '' },
  filters: { status: '__active__', priority: '', source: '', category: '', tag: '', assignedTo: '', staleOnly: false, showArchived: false, q: '' },
  reportFilters: { range: '30', start: '', end: '', status: '', priority: '', source: '', category: '', tag: '', assignedTo: '', dealer: '' },
  lastActivity: Date.now()
};
window.S = S;

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function desktopNotify(title, body, ticketId){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  // Skip if the tab is already focused and visible — the in-app toast covers that case
  if(document.hasFocus() && !document.hidden) return;
  // OS notifications render title/body as PLAIN TEXT only, so any HTML we use for
  // in-app toasts (icon <span>s, etc.) would show up as literal markup. Strip tags
  // and collapse whitespace here so every caller is covered.
  const plain = (s)=> String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
  title = plain(title);
  body = plain(body);
  try{
    const n = new Notification(title, { body, icon: undefined, tag: ticketId || undefined });
    n.onclick = () => {
      window.focus();
      if(ticketId){
        goPage('tickets');
        setTimeout(()=>openTicket(ticketId), 100);
      }
      n.close();
    };
  }catch(e){ /* non-critical */ }
}

function toast(msg, isErr){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 3200);
  // Route real operation failures (not validation prompts) into the error log.
  try{ if(isErr){ const plain=String(msg||'').replace(/<[^>]+>/g,''); if(/fail|error|denied|violat|could not|unable/i.test(plain)) logError(plain, 'toast'); } }catch(_){}
}
window.toast = toast;

// ---- Error logging: the app records its own failures so bugs surface without
// a screenshot. Best-effort, deduped, never throws. ----
window._errSeen = window._errSeen || {};
async function logError(message, detail){
  try{
    const msg = String(message||'').slice(0,600); if(!msg) return;
    const sig = msg.slice(0,120), now = Date.now();
    if(window._errSeen[sig] && (now - window._errSeen[sig]) < 60000) return; // dedupe 1 min
    window._errSeen[sig] = now;
    if(typeof sb==='undefined' || !sb) return;
    await sb.from('error_log').insert({
      user_email: (typeof S!=='undefined' && S.user && S.user.email) || null,
      page: (typeof S!=='undefined' && S.page) || null,
      message: msg,
      detail: detail ? String(detail).slice(0,4000) : null,
      url: (typeof location!=='undefined' && location.href) || null,
      user_agent: (typeof navigator!=='undefined' && navigator.userAgent) || null,
      app_version: (typeof TGK_SUPPORT_VERSION!=='undefined') ? TGK_SUPPORT_VERSION : null
    });
  }catch(_){ /* never let logging break the app */ }
}
window.logError = logError;
window.addEventListener('error', (ev)=>{ try{ logError((ev && (ev.message || (ev.error&&ev.error.message))) || 'Uncaught error', ev && ev.error && ev.error.stack); }catch(_){} });
window.addEventListener('unhandledrejection', (ev)=>{ try{ const r = ev && ev.reason; logError('Unhandled rejection: '+((r&&r.message)||r||''), r&&r.stack); }catch(_){} });

function isUserActivelyWorking(){
  const ae = document.activeElement;
  if(!ae) return false;
  const tag = ae.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
}

// Any interaction in this tab resets the idle clock: mouse movement, clicks,
// typing, wheel, touch, scrolling (capture:true so scrolls inside panels count),
// and refocusing the tab after working elsewhere.
['mousemove','mousedown','keydown','wheel','touchstart'].forEach(function(evt){
  document.addEventListener(evt, function(){ S.lastActivity = Date.now(); }, { passive: true });
});
document.addEventListener('scroll', function(){ S.lastActivity = Date.now(); }, { passive: true, capture: true });
document.addEventListener('visibilitychange', function(){
  if(!document.hidden) S.lastActivity = Date.now();
});
setInterval(async ()=>{
  if(Date.now() - S.lastActivity > IDLE_TIMEOUT_MS){
    sb.auth.signOut();
    location.reload();
    return;
  }
  // Chat availability has its own, much shorter idle timeout — someone who steps away shouldn't
  // keep showing as available to customers just because their tab is still open. Without this, the
  // heartbeat below would keep chat_available_updated_at fresh regardless of whether they're actually
  // at their desk, silently defeating the staleness check this is meant to back up.
  const chatToggle = document.getElementById('chatAvailableToggle');
  if(chatToggle && chatToggle.checked && Date.now() - S.lastActivity > CHAT_IDLE_TIMEOUT_MS){
    chatToggle.checked = false;
    await toggleChatAvailability(false); // awaited so its own generic toast fires first, not last
    toast('Live chat availability turned off - no activity for ' + Math.round(CHAT_IDLE_TIMEOUT_MS/60000) + ' minutes', true);
  }
}, 60000);

// Keeps chat_available_updated_at fresh every 3 minutes while the toggle
// is on, so availability doesn't silently expire (see check-chat-availability's
// 10-minute staleness window) just because nothing else changed.
setInterval(async ()=>{
  const toggle = document.getElementById('chatAvailableToggle');
  if(toggle && toggle.checked && S.user){
    try{ await sb.from('team_members').update({ chat_available_updated_at: new Date().toISOString() }).ilike('email', S.user.email); }catch(e){}
  }
}, 180000);

// Recompute time-based flags (Waiting Xh pills, Needs Reply counts) every 5
// minutes so idle conversations re-flag themselves without a manual refresh.
setInterval(()=>{
  if(!S.user) return;
  try{
    renderNav();
    if(['emails','orders','needsreply','dashboard','tickets'].includes(S.page)) renderPage();
  }catch(_){}
}, 300000);

/* ============================================================
   AUTH
   ============================================================ */
async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Enter email and password.'; return; }
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error) throw error;
    await afterLogin(data.user);
  }catch(e){
    errEl.textContent = e.message || 'Login failed.';
  }
}
window.doLogin = doLogin;

async function toggleChatAvailability(available){
  if(!S.user) return;
  try{
    await sb.from('team_members').update({
      chat_available: available,
      chat_available_updated_at: new Date().toISOString()
    }).ilike('email', S.user.email);
    toast(available ? 'You\'re now available for live chat' : 'You\'re now offline for live chat');
  }catch(e){
    toast('Failed to update availability: ' + e.message, true);
  }
}
window.toggleChatAvailability = toggleChatAvailability;

async function doLogout(){
  try{ await logApp('sign_out', null, null, 'Signed out'); sessionStorage.removeItem('tgk_alog_session'); }catch(_){}
  if(S.user){
    try{ await sb.from('team_members').update({ chat_available: false }).ilike('email', S.user.email); }catch(e){}
  }
  await sb.auth.signOut();
  location.reload();
}
window.doLogout = doLogout;

async function afterLogin(user){
  S.user = user;
  let lookupError = null;
  let row = null;
  try{
    const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if(error) throw error;
    row = data;
  }catch(e){
    lookupError = e;
  }
  S.role = (row && row.role) ? row.role : null;

  if(!['admin','customer_service'].includes(S.role)){
    let msg = 'Your account does not have Support Center access.';
    if(lookupError){
      msg += ` (profiles lookup failed: ${lookupError.message})`;
      console.error('profiles lookup error:', lookupError);
    } else if(!row){
      msg += ` No profiles row found for user id ${user.id}.`;
    } else {
      msg += ` Role on file: "${row.role}".`;
    }
    document.getElementById('login-error').textContent = msg;
    console.log('Support Center access check — user:', user.email, 'row:', row, 'error:', lookupError);
    await sb.auth.signOut();
    return;
  }
  try{ const r = await sb.rpc('is_activity_log_viewer'); S.canViewActivityLog = !r.error && r.data === true; }catch(_){ S.canViewActivityLog = false; }
  // One 'opened' entry per browser tab session, not one per page refresh.
  try{ if(!sessionStorage.getItem('tgk_alog_session')){ sessionStorage.setItem('tgk_alog_session','1'); logApp('sign_in', null, null, 'Opened the Support Center'); } }catch(_){ logApp('sign_in', null, null, 'Opened the Support Center'); }
  document.getElementById('auth-gate').classList.add('hidden');
  document.getElementById('tgk-app').style.display = 'block';
  document.getElementById('userLabel').textContent = user.email;
  const vb = document.getElementById('support-version-badge'); if(vb) vb.textContent = TGK_SUPPORT_VERSION;
  const bd = document.getElementById('support-build-date'); if(bd) bd.textContent = TGK_SUPPORT_BUILD_DATE;
  await loadAll();
  renderNav();
  goPage('dashboard');
  setupBackButton();
  subscribeRealtime();
  window._tgkSupportLoaded = true; try{ _tgkAnnounceReady(); }catch(_){} // [v1.99] lets the Command Center open an exact item

  try{
    const { data: myRow } = await sb.from('team_members').select('chat_available').ilike('email', user.email).maybeSingle();
    const toggle = document.getElementById('chatAvailableToggle');
    if(toggle) toggle.checked = !!(myRow && myRow.chat_available);
  }catch(e){ /* non-critical */ }

  if('Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission();
  }
}

/* ============================================================
   OPEN THE EXACT ITEM FROM A COMMAND CENTER NOTIFICATION (v1.99)
   Clicking "New ticket ..." (or an email, live chat, warranty claim or shipment error) in the Command Center opens
   this app and asks it to show that one item. Three ways in, the same as the ERP uses for orders:
     1. an OPEN_ITEM message from the Command Center (origin checked like the sign-in token)
     2. an address like https://support.example/?open=tickets:<id> (a cold start; also works as a bookmark)
     3. a READY announcement once everything has loaded, so the Command Center knows to ask
   It waits until the app has finished loading, opens the item, then answers ITEM_OPENED so the Command Center stops asking.
   Tickets and emails open in the side panel (the app already keeps every ACTIVE one in memory; an older one is fetched
   by its id). Warranty claims and shipment errors have no panel here, so the right list opens with that row highlighted.
   ============================================================ */
var _tgkItSeen={},_tgkItWait={},_tgkItLast={key:'',t:0};
var _TGK_ITEM_KINDS={
  tickets:{page:'tickets',table:'tickets',list:'tickets',what:'ticket'},
  livechat:{page:'livechat',table:'tickets',list:'tickets',what:'chat'},
  orderemails:{page:'orders',table:'emails',list:'emails',what:'email'},
  supportemails:{page:'emails',table:'emails',list:'emails',what:'email'},
  warranty:{page:'warranty',table:'warranty_claims',list:'warranty',what:'warranty claim'},
  shiperrors:{page:'shiperrors',table:'shipment_errors',list:'shipErrors',what:'shipment error'}
};
function _tgkSupportReady(){
  var app=document.getElementById('tgk-app');
  return !!(window._tgkSupportLoaded && typeof S!=='undefined' && S && S.user && app && app.style.display!=='none');
}
function _tgkAnnounceReady(){
  if(window.parent===window) return;
  try{ window.parent.postMessage({source:'TGK_SUPPORT',type:'READY',version:TGK_SUPPORT_VERSION,items:true},'https://command.tgkmotorsport.com'); }catch(_){}
}
(function(){ try{ var st=document.createElement('style'); st.id='tgk-flash-css';
  st.textContent='@keyframes tgkFlash{0%,45%{background:rgba(232,115,28,.32)}100%{background:transparent}} tr.tgk-flash>td{animation:tgkFlash 3.2s ease-out} tr.tgk-flash>td:first-child{box-shadow:inset 3px 0 0 #e8731c}';
  document.head.appendChild(st); }catch(_){} })();
function _tgkFlashClaim(row,m){
  var id=String(row.id).replace(/["\\]/g,'');
  var el=document.querySelector('tr[data-claim-id="'+id+'"]');
  if(!el){ toast('That '+m.what+' is already '+(row.status||'closed')+' in the ERP, so it is not in the active list.'); return; }
  try{ el.scrollIntoView({block:'center'}); }catch(_){}
  el.classList.remove('tgk-flash'); void el.offsetWidth; el.classList.add('tgk-flash');
}
async function _tgkShowItem(kind,item){
  var m=_TGK_ITEM_KINDS[kind]; if(!m||!item) return;
  var id=String(item), arr=S[m.list]||[];
  var row=arr.find(function(x){ return String(x.id)===id; });
  if(!row){ // older than what the app keeps in memory: fetch just this one
    try{ var r=await sb.from(m.table).select('*').eq('id',item).maybeSingle(); if(r && r.data){ row=r.data; S[m.list]=[row].concat(arr); } }catch(_){}
  }
  if(!row){ toast('Could not find that '+m.what+'. It may have been deleted.', true); return; }
  try{ closePanel(); }catch(_){}
  if(S.page!==m.page) goPage(m.page);
  if(m.table==='tickets') await openTicket(row.id);
  else if(m.table==='emails') await openEmail(row.id);
  else _tgkFlashClaim(row,m);
}
function _tgkOpenItemFromCC(id,it,ev){
  function ack(){ try{ if(ev && ev.source) ev.source.postMessage({source:'TGK_SUPPORT',type:'ITEM_OPENED',id:id}, ev.origin); }catch(_){} }
  if(id && _tgkItSeen[id]){ ack(); return; }
  var kind=String((it && it.kind)||''), item=String((it && it.item)||'').trim().slice(0,80);
  if(!_TGK_ITEM_KINDS[kind] || !item) return;
  if(id && _tgkItWait[id]) return;
  if(id) _tgkItWait[id]=1;
  var tries=0;
  (function go(){
    if(!_tgkSupportReady()){ if(tries++<240) setTimeout(go,500); return; }
    if(id){ if(_tgkItSeen[id]){ ack(); return; } _tgkItSeen[id]=1; }
    // the same item asked for twice within a few seconds (the address AND the message on a cold start) is opened once
    var key=kind+':'+item;
    if(_tgkItLast.key===key && Date.now()-_tgkItLast.t<8000){ ack(); return; }
    _tgkItLast={key:key,t:Date.now()};
    _tgkShowItem(kind,item).then(ack,function(e){ console.warn('[CC] open item failed:',e); toast('Could not open that item: '+((e&&e.message)||e), true); ack(); });
  })();
}
window.addEventListener('message', function(event){
  if(event.origin!=='https://command.tgkmotorsport.com') return; // only the Command Center, like the sign-in token
  var d=event.data; if(!d || d.source!=='TGK_CC' || d.type!=='OPEN_ITEM') return;
  try{ _tgkOpenItemFromCC(d.id,{kind:d.kind,item:d.item,ref:d.ref,label:d.label},event); }catch(e){ console.warn('[CC] open item failed:',e); }
});
// an address like https://support.example/?open=tickets:<id> opens that item once the app has loaded, then tidies the address
try{
  var _tgkOp=new URLSearchParams(location.search).get('open');
  if(_tgkOp){
    var _tgkIx=_tgkOp.indexOf(':');
    if(_tgkIx>0) _tgkOpenItemFromCC('qo'+Date.now(),{kind:_tgkOp.slice(0,_tgkIx),item:_tgkOp.slice(_tgkIx+1)},null);
    try{ history.replaceState(history.state,'',location.pathname+location.hash); }catch(_){}
  }
}catch(_){}

(async function checkSession(){
  const { data } = await sb.auth.getSession();
  if(data && data.session){ await afterLogin(data.session.user); }
})();

/* ============================================================
   SSO — when opened inline inside the Command Center (as an iframe),
   accept the auth token it posts so staff don't have to log in twice.
   Same pattern as the ERP's own Command Center integration.

   Security note: this checks the message shape (source/type) but does
   NOT restrict which origin can send it. If you know the Command
   Center's exact hosted URL, tighten this by also checking
   event.origin === 'https://your-command-center-domain' below.
   ============================================================ */
window.addEventListener('message', async (event) => {
  if (event.origin !== 'https://command.tgkmotorsport.com') return; // [SSO] only accept the token from the Command Center's own origin
  if (!event.data || event.data.source !== 'TGK_CC' || event.data.type !== 'AUTH_TOKEN') return;
  try{
    const { error } = await sb.auth.setSession({
      access_token: event.data.access_token,
      refresh_token: event.data.refresh_token || ''
    });
    if(error){ console.error('SSO setSession failed:', error.message); return; }
    const { data: sessionData } = await sb.auth.getSession();
    if(sessionData?.session && !S.user){
      await afterLogin(sessionData.session.user);
    }
  }catch(e){
    console.error('SSO token accept failed:', e);
  }
});

/* ============================================================
   DATA LOADING
   ============================================================ */
async function fetchAll(queryFn, pageSize=1000){
  let all = [], from = 0;
  while(true){
    const { data, error } = await queryFn(from, from + pageSize - 1);
    if(error) throw error;
    all = all.concat(data || []);
    if(!data || data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}

// [PERF] loadAll()/loadEmails() used to pull every row of tickets, warranty_claims,
// shipment_errors, and emails -- unbounded, full history -- on every single login.
// As those tables grow year over year that's an ever-slower login with no ceiling.
//
// The bound below is deliberately NOT "load recent stuff and hope nothing older
// matters" -- that would violate accuracy (an old-but-still-open ticket must never
// silently disappear). Instead, for each table, everything that's still genuinely
// ACTIVE loads regardless of age, PLUS anything touched in the last RECENT_WINDOW_DAYS
// (for a reasonable default "Completed"/"Archived" view), PLUS -- for warranty_claims
// and shipment_errors specifically -- anything a currently-loaded ticket links to,
// even if that claim itself is old and Resolved/Closed/Denied, because the ticket
// detail panel (openTicketDetail, etc.) reads that claim's live status/cost directly
// off S.warranty/S.shipErrors and must never render it as missing.
// Nothing outside these windows is ever permanently hidden: loadFullHistory() below
// fetches the true complete table on demand, wired to a button in each list view.
const RECENT_WINDOW_DAYS = 90;
function recentCutoffISO(){ return new Date(Date.now() - RECENT_WINDOW_DAYS*24*60*60*1000).toISOString(); }
function mergeRowsById(...lists){
  const map = new Map();
  for(const list of lists){ for(const r of (list||[])) map.set(r.id, r); }
  return Array.from(map.values());
}
// Tracks which tables have had loadFullHistory() run, so the "Load full history"
// buttons in the list views can hide themselves once there's nothing left to load.
const HISTORY_LOADED = { tickets:false, warranty:false, shipErrors:false, emails:false };

async function loadBoundedTickets(){
  const cutoff = recentCutoffISO();
  const [active, recent] = await Promise.all([
    // Same condition as the rest of the app's "!t.archived && status not in (resolved,closed)"
    // check, made null-safe: archived/status can be NULL on older rows, and JS falsy
    // checks (!t.archived) treat that as "not archived" -- a plain .eq('archived',false)
    // would wrongly exclude those rows, so both fields use an is-null-or fallback.
    fetchAll((f,t)=> sb.from('tickets').select('*')
      .or('archived.is.null,archived.eq.false')
      .or('status.is.null,status.not.in.(resolved,closed)')
      .order('created_at',{ascending:false}).range(f,t)),
    fetchAll((f,t)=> sb.from('tickets').select('*').gte('created_at', cutoff).order('created_at',{ascending:false}).range(f,t))
  ]);
  return mergeRowsById(recent, active).sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
}

// Shared loader for warranty_claims and shipment_errors -- see the loadAll() comment
// above for why "linked to a loaded ticket" is a required third bucket, not optional.
async function loadBoundedClaims(table, ticketLinkField){
  const cutoff = recentCutoffISO();
  const linkedIds = [...new Set((S.tickets||[]).map(t=>t[ticketLinkField]).filter(Boolean))];
  const queries = [
    fetchAll((f,t)=> sb.from(table).select('*')
      .or('status.is.null,status.not.in.(Resolved,Closed,Denied)')
      .order('created_at',{ascending:false}).range(f,t)),
    fetchAll((f,t)=> sb.from(table).select('*').gte('created_at', cutoff).order('created_at',{ascending:false}).range(f,t)),
  ];
  if(linkedIds.length) queries.push(fetchAll((f,t)=> sb.from(table).select('*').in('id', linkedIds).range(f,t)));
  const results = await Promise.all(queries);
  return mergeRowsById(...results).sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
}

async function loadAll(){
  try{
    // Tickets load first (not in parallel with warranty/shipment_errors) because
    // loadBoundedClaims needs to know which claims S.tickets actually references
    // before it can decide what counts as "linked" -- see comment above.
    const [ticketsR, dealersR, teamR, templatesR, settingsR] = await Promise.allSettled([
      loadBoundedTickets(),
      sb.from('dealers').select('id,name,email,discount_pct,po_code_prefix').then(r=>r.data||[]),
      sb.from('team_members').select('email,display_name').then(r=>r.data||[]),
      sb.from('ticket_templates').select('*').order('sort_order',{ascending:true}).then(r=>r.data||[]),
      loadSettings() // resolves to undefined; writes straight into S.settings
    ]);
    const val = (r, def)=> r.status==='fulfilled' ? r.value : def;
    // A single failing table no longer blanks the whole app -- keep whatever loaded.
    S.tickets   = val(ticketsR, S.tickets||[]);
    S.dealers   = val(dealersR, S.dealers||[]);
    S.team      = val(teamR, S.team||[]);
    S.templates = val(templatesR, S.templates||[]);

    const [warrantyR, shipErrR] = await Promise.allSettled([
      loadBoundedClaims('warranty_claims', 'warranty_claim_id'),
      loadBoundedClaims('shipment_errors', 'shipment_error_id')
    ]);
    S.warranty   = val(warrantyR, S.warranty||[]);
    S.shipErrors = val(shipErrR, S.shipErrors||[]);

    const failed = [ticketsR, dealersR, teamR, templatesR, settingsR, warrantyR, shipErrR].filter(r=>r.status==='rejected').length;
    if(failed) toast('Some data failed to load ('+failed+' of 7). Showing what loaded.', true);
    await loadEmails();
    await loadOrdersFulfillment();
    await loadQuarantine();
  }catch(e){
    toast('Failed to load data: ' + e.message, true);
  }
}

// On-demand full backfill for one table, wired to a "Load full history" button in
// the relevant list view (see renderTicketsList/renderEmailsList). Safe to call more
// than once -- HISTORY_LOADED guards it into a no-op once a table is fully loaded.
async function loadFullHistory(kind){
  if(HISTORY_LOADED[kind]) return;
  toast('Loading full history\u2026 this may take a moment for a large table.');
  try{
    if(kind==='tickets'){
      S.tickets = await fetchAll((f,t)=> sb.from('tickets').select('*').order('created_at',{ascending:false}).range(f,t));
    } else if(kind==='warranty'){
      S.warranty = await fetchAll((f,t)=> sb.from('warranty_claims').select('*').order('created_at',{ascending:false}).range(f,t));
    } else if(kind==='shipErrors'){
      S.shipErrors = await fetchAll((f,t)=> sb.from('shipment_errors').select('*').order('created_at',{ascending:false}).range(f,t));
    } else if(kind==='emails'){
      S.emails = await fetchAll((f,t)=> sb.from('emails').select('*').order('last_message_at',{ascending:false}).range(f,t));
    } else {
      return;
    }
    HISTORY_LOADED[kind] = true;
    renderNav();
    if(typeof renderPage==='function') renderPage();
    toast('Full history loaded');
  }catch(e){ toast('Failed to load full history: '+e.message, true); }
}
window.loadFullHistory = loadFullHistory;

async function loadMessages(ticketId){
  const { data, error } = await sb.from('ticket_messages').select('*').eq('ticket_id', ticketId).order('created_at',{ascending:true});
  if(error){ toast('Failed to load messages', true); return []; }
  S.messages[ticketId] = data;
  return data;
}

/* ============================================================
   REALTIME
   ============================================================ */
function subscribeRealtime(){
  sb.channel('support-tickets')
    .on('postgres_changes', { event:'*', schema:'public', table:'tickets' }, payload=>{
      if(isUserActivelyWorking() && S.activeTicket) return;
      handleTicketRealtime(payload);
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'ticket_messages' }, payload=>{
      const m = payload.new;
      if(!S.messages[m.ticket_id]) S.messages[m.ticket_id] = [];
      const alreadyHave = S.messages[m.ticket_id].some(x=>x.id===m.id);
      if(!alreadyHave){
        S.messages[m.ticket_id].push(m);
        if(S.activeTicket && S.activeTicket.id === m.ticket_id){
          document.getElementById('threadBox').innerHTML = renderThread(S.messages[m.ticket_id], showingNotes);
          scrollThreadToBottom();
        } else if(m.sender_type === 'customer' && !m.is_internal_note){
          const t = S.tickets.find(x=>x.id===m.ticket_id);
          const nowStr = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
          toast('New reply on ticket' + (t ? ' #' + t.ticket_number : '') + ' from ' + (m.sender_name||'customer') + ' · ' + nowStr);
          desktopNotify(
            '<span class="ic ic-chat"></span>New reply' + (t ? ' — Ticket #' + t.ticket_number : ''),
            (m.sender_name||'Customer') + ': ' + (m.body||'').slice(0,120),
            m.ticket_id
          );
        }
      }
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'emails' }, payload=>{
      const idx = S.emails.findIndex(x=>x.id === (payload.new?.id || payload.old?.id));
      if(payload.eventType==='INSERT'){
        if(idx===-1){
          S.emails.unshift(payload.new);
          const isOrder = payload.new.mailbox==='orders';
          toast('<span class="ic ic-mail"></span>New ' + (isOrder?'order':'email') + ' from ' + (payload.new.customer_email||'someone'));
          desktopNotify('<span class="ic ic-mail"></span>New ' + (isOrder?'Order':'Email'), (payload.new.customer_email||'') + ': ' + (payload.new.subject||''), null);
        }
      } else if(payload.eventType==='UPDATE'){
        if(idx!==-1) S.emails[idx] = payload.new;
      } else if(payload.eventType==='DELETE'){
        if(idx!==-1) S.emails.splice(idx,1);
      }
      renderNav();
      if(S.page==='emails' || S.page==='orders') renderEmailsList();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'sales' }, payload=>{
      const on = payload.new?.order_number || payload.old?.order_number;
      if(!on) return;
      const e = (S.emails||[]).find(x=>x.mailbox==='orders' && x.shopify_order_id===on);
      if(e) refreshOrderFulfillment(e.id);
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'email_messages' }, payload=>{
      const m = payload.new;
      if(!S.emailMessages[m.email_id]) S.emailMessages[m.email_id] = [];
      if(!S.emailMessages[m.email_id].some(x=>x.id===m.id)){
        S.emailMessages[m.email_id].push(m);
        if(S.activeEmail && S.activeEmail.id===m.email_id){
          const tb=document.getElementById('threadBox');
          if(tb){ tb.innerHTML = renderEmailThread(S.emailMessages[m.email_id]); scrollThreadToBottom(); }
        }
      }
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'warranty_claims' }, payload=>{
      if(payload.eventType==='DELETE'){ handleErpClaimDelete('warranty', payload.old); }
      else if(payload.eventType==='UPDATE'){ handleErpClaimUpdate('warranty', payload.old, payload.new); }
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'shipment_errors' }, payload=>{
      if(payload.eventType==='DELETE'){ handleErpClaimDelete('shipment_error', payload.old); }
      else if(payload.eventType==='UPDATE'){ handleErpClaimUpdate('shipment_error', payload.old, payload.new); }
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'ticket_templates' }, payload=>{
      if(payload.eventType==='INSERT'){ if(!(S.templates||[]).some(x=>x.id===payload.new.id)) S.templates=[...(S.templates||[]),payload.new]; }
      else if(payload.eventType==='UPDATE'){ S.templates=(S.templates||[]).map(x=>x.id===payload.new.id?payload.new:x); }
      else if(payload.eventType==='DELETE'){ S.templates=(S.templates||[]).filter(x=>x.id!==(payload.old&&payload.old.id)); }
      var _pk=document.getElementById('tmplPicker'); if(_pk && S.activeTicket) _pk.innerHTML=templatePickerOptions(S.activeTicket);
      if(document.getElementById('tmpl-mgr-body')) renderTemplateManagerBody();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'support_settings' }, function(payload){
      var row = payload.new || payload.old; if(!row || !row.key) return;
      if(payload.eventType === 'DELETE') delete S.settings[row.key];
      else S.settings[row.key] = row.value;
      renderNav();
      if(S.page === 'settings') renderSettings();
      else if(S.page === 'tickets' || S.page === 'dashboard') renderPage();
    })
    .subscribe();
}

/* ============================================================
   ERP → TICKET PING-BACK
   When the ERP ships a warranty claim (status → 'Shipped') or a
   shipment error (tracking_number newly set / status → 'Reshipping'),
   reflect that on the linked ticket automatically: bump its status,
   flag it unread, and drop an internal note so staff see it happened
   without having to go check the ERP themselves.
   ============================================================ */
async function handleErpClaimUpdate(kind, oldRow, newRow){
  const idx = kind==='warranty' ? S.warranty.findIndex(w=>w.id===newRow.id) : S.shipErrors.findIndex(e=>e.id===newRow.id);
  if(idx!==-1){ if(kind==='warranty'){ S.warranty[idx]=newRow; } else { S.shipErrors[idx]=newRow; } }
  if(S.page==='warranty' || S.page==='shiperrors') renderPage();

  const justShipped = (!oldRow.tracking_number && newRow.tracking_number) ||
    (oldRow.status !== newRow.status && ['Shipped','Reshipping'].includes(newRow.status));
  if(!justShipped) return;

  const ticket = kind==='warranty'
    ? S.tickets.find(t=>t.warranty_claim_id===newRow.id)
    : S.tickets.find(t=>t.shipment_error_id===newRow.id);
  if(!ticket) return;

  try{
    const noteBody = `ERP update: ${kind==='warranty'?'Warranty claim':'Shipment error'} marked as shipped`
      + (newRow.carrier ? ` via ${newRow.carrier}` : '')
      + (newRow.tracking_number ? ` — tracking: ${newRow.tracking_number}` : '')
      + `. Ticket marked resolved automatically — if the customer replies, it'll reopen. (Synced automatically from the ERP.)`;

    await sb.from('ticket_messages').insert({
      ticket_id: ticket.id,
      sender_type: 'system',
      sender_name: 'System',
      body: noteBody,
      is_internal_note: true
    });

    const needsUpdate = ticket.status !== 'closed';
    const { data: updated, error } = await sb.from('tickets').update({
      status: needsUpdate ? 'resolved' : ticket.status,
      resolved_at: needsUpdate ? new Date().toISOString() : ticket.resolved_at,
      has_unread: true,
      updated_at: new Date().toISOString()
    }).eq('id', ticket.id).select().single();
    if(error) throw error;

    const tIdx = S.tickets.findIndex(t=>t.id===ticket.id);
    if(tIdx!==-1) S.tickets[tIdx] = updated;
    if(S.activeTicket && S.activeTicket.id===ticket.id){
      S.activeTicket = updated;
      await loadMessages(ticket.id);
      renderTicketPanel(updated);
    }
    toast(`Ticket #${updated.ticket_number} marked resolved — shipped from the ERP`);
    renderNav();
    if(S.page==='tickets' || S.page==='dashboard') renderPage();
  }catch(e){
    console.error('Failed to sync ERP shipment back to ticket:', e);
  }
}

function handleTicketRealtime(payload){
  const idx = S.tickets.findIndex(t=>t.id === (payload.new?.id || payload.old?.id));
  if(payload.eventType === 'INSERT'){
    if(idx === -1) S.tickets.unshift(payload.new);
    if(payload.new.is_live_chat){
      toast('<span class="ic ic-chat"></span>New live chat from ' + (payload.new.customer_name||'a visitor'));
      desktopNotify('<span class="ic ic-chat"></span>New Live Chat', (payload.new.customer_name||'A visitor') + ' started a chat', payload.new.id);
    } else {
      toast('New ticket: ' + payload.new.subject);
      desktopNotify('<span class="ic ic-ticket"></span>New Ticket #' + payload.new.ticket_number, payload.new.subject, payload.new.id);
    }
  } else if(payload.eventType === 'UPDATE'){
    if(idx !== -1) S.tickets[idx] = payload.new;
  } else if(payload.eventType === 'DELETE'){
    if(idx !== -1) S.tickets.splice(idx,1);
  }
  renderNav();
  if(S.page === 'tickets' || S.page === 'dashboard') renderPage();
}

/* ============================================================
   UNDO / REDO (universal, for reversible field edits)
   Covers record field changes routed through updateTicketField /
   updateEmailField. Does NOT cover irreversible/external actions
   (sent emails, Shopify draft/invoice/complete, permanent deletes,
   merges, convert-to-order) -- those are never pushed.
   ============================================================ */
const UNDO = { stack: [], redo: [], max: 60 };
function updateUndoButtons(){
  const u=document.getElementById('undoBtn'), r=document.getElementById('redoBtn');
  if(u){ u.disabled = !UNDO.stack.length; u.title = UNDO.stack.length ? ('Undo: '+UNDO.stack[UNDO.stack.length-1].label+' (Ctrl+Z)') : 'Nothing to undo'; }
  if(r){ r.disabled = !UNDO.redo.length; r.title = UNDO.redo.length ? ('Redo: '+UNDO.redo[UNDO.redo.length-1].label+' (Ctrl+Shift+Z)') : 'Nothing to redo'; }
}
function pushUndo(entry){ UNDO.stack.push(entry); if(UNDO.stack.length>UNDO.max) UNDO.stack.shift(); UNDO.redo=[]; updateUndoButtons(); }
window.pushUndo = pushUndo;
async function doUndo(){
  const e = UNDO.stack.pop(); if(!e){ toast('Nothing to undo'); updateUndoButtons(); return; }
  try{ await e.undo(); UNDO.redo.push(e); toast('Undid: '+e.label); }
  catch(err){ UNDO.stack.push(e); toast('Undo failed: '+err.message, true); }
  updateUndoButtons();
}
window.doUndo = doUndo;
async function doRedo(){
  const e = UNDO.redo.pop(); if(!e){ toast('Nothing to redo'); updateUndoButtons(); return; }
  try{ await e.redo(); UNDO.stack.push(e); toast('Redid: '+e.label); }
  catch(err){ UNDO.redo.push(e); toast('Redo failed: '+err.message, true); }
  updateUndoButtons();
}
window.doRedo = doRedo;
document.addEventListener('keydown', (ev)=>{
  if(!(ev.ctrlKey || ev.metaKey)) return;
  const k = (ev.key||'').toLowerCase();
  const tag = (ev.target && ev.target.tagName || '').toLowerCase();
  const editable = tag==='input' || tag==='textarea' || (ev.target && ev.target.isContentEditable);
  if(editable) return; // let the browser's native text undo work inside fields
  if(k==='z' && !ev.shiftKey){ ev.preventDefault(); doUndo(); }
  else if((k==='z' && ev.shiftKey) || k==='y'){ ev.preventDefault(); doRedo(); }
});

// [PERF] Badge counts used to be recomputed with 7-8 independent array scans
// EVERY time renderNav() runs (which is often -- most mutations and every
// matching realtime event call it). Two of those scans were quadratic: the
// warranty/shiperrors badges each ran S.tickets.some(...) INSIDE a .filter()
// over every claim, i.e. O(claims x tickets) work just to draw a sidebar
// number. As both tables grow this only gets worse.
//
// computeNavCounts() does the equivalent work in one pass each over
// S.tickets and S.emails (collecting ticket->claim link ids into Sets along
// the way), so the warranty/shiperrors lookups below become O(1) Set.has()
// calls instead of O(tickets) scans per claim. Every condition below is
// copied verbatim from the original per-badge filters -- same results,
// computed once instead of piecemeal, so this is a speed change only, not a
// behavior change.
function computeNavCounts(){
  let activeChats = 0, unreadTix = 0, openTix = 0;
  const ticketWarrantyIds = new Set(), ticketShipErrorIds = new Set();
  for(const t of S.tickets){
    if(t.warranty_claim_id) ticketWarrantyIds.add(t.warranty_claim_id);
    if(t.shipment_error_id) ticketShipErrorIds.add(t.shipment_error_id);
    const notDoneNotArchived = !t.archived && !['resolved','closed'].includes(t.status);
    if(notDoneNotArchived && t.is_live_chat) activeChats++;
    if(notDoneNotArchived && !t.merged_into_id){
      if(t.has_unread) unreadTix++;
      if(['open','pending','waiting_customer'].includes(t.status)) openTix++;
    }
  }
  let unreadEmails = 0, unreadOrders = 0;
  for(const e of (S.emails||[])){
    if(e.status==='archived' || !e.has_unread) continue;
    if(e.mailbox==='orders') unreadOrders++; else unreadEmails++;
  }
  const warrantyCount = S.warranty.filter(w=>isActiveClaim(w.status) && !ticketWarrantyIds.has(w.id)).length;
  const shipErrorsCount = S.shipErrors.filter(e=>isActiveClaim(e.status) && !ticketShipErrorIds.has(e.id)).length;
  const quarantineCount = (S.quarantine||[]).length; // query already loads released=false only
  return { activeChats, unreadTix, openTix, unreadEmails, unreadOrders, warrantyCount, shipErrorsCount, quarantineCount };
}

function renderNav(){
  const nav = document.getElementById('navList');
  let lastSection = null;
  const counts = computeNavCounts();
  nav.innerHTML = NAV.filter(n=>!n.viewerOnly || S.canViewActivityLog).map(n=>{
    let sectionHeader = '';
    if(n.section && n.section !== lastSection){ lastSection = n.section; sectionHeader = `<div class="sidebar-section">${escapeHtml(n.section)}</div>`; }
    let badge = '';
    let alertClass = '';
    if(n.badgeKey==='livechat'){
      if(counts.activeChats){ badge = `<span class="nav-badge" style="color:var(--red);background:var(--red-dim);border-color:rgba(220,38,38,.25)">${counts.activeChats}</span>`; alertClass='alert-nav'; }
    }
    if(n.badgeKey==='tickets'){
      if(counts.unreadTix){
        badge = `<span class="nav-badge" style="color:var(--red);background:var(--red-dim);border-color:rgba(220,38,38,.25)" title="${counts.unreadTix} ticket${counts.unreadTix===1?'':'s'} with new messages">${counts.unreadTix}</span>`;
        alertClass = 'alert-nav';
      } else {
        if(counts.openTix) badge = `<span class="nav-badge">${counts.openTix}</span>`;
      }
    }
    if(n.badgeKey==='needsreply'){
      const nr = needsReplyItems().length;
      if(nr){ badge = `<span class="nav-badge" style="color:var(--red);background:var(--red-dim);border-color:rgba(220,38,38,.25)">${nr}</span>`; alertClass='alert-nav'; }
    }
    if(n.badgeKey==='emails'){
      if(counts.unreadEmails){ badge = `<span class="nav-badge" style="color:var(--red);background:var(--red-dim);border-color:rgba(220,38,38,.25)">${counts.unreadEmails}</span>`; alertClass='alert-nav'; }
    }
    if(n.badgeKey==='orders'){
      if(counts.unreadOrders){ badge = `<span class="nav-badge" style="color:var(--red);background:var(--red-dim);border-color:rgba(220,38,38,.25)">${counts.unreadOrders}</span>`; alertClass='alert-nav'; }
    }
    if(n.badgeKey==='rebates'){
      const rbN = rebateReviewItems().length;
      if(rbN){ badge = `<span class="nav-badge">${rbN}</span>`; alertClass='alert-nav'; }
    }
    if(n.badgeKey==='warranty'){
      if(counts.warrantyCount){ badge = `<span class="nav-badge">${counts.warrantyCount}</span>`; alertClass='alert-nav'; }
    }
    if(n.badgeKey==='shiperrors'){
      if(counts.shipErrorsCount){ badge = `<span class="nav-badge">${counts.shipErrorsCount}</span>`; alertClass='alert-nav'; }
    }
    if(n.badgeKey==='quarantine'){
      if(counts.quarantineCount){ badge = `<span class="nav-badge" style="color:var(--orange);background:var(--orange-dim);border-color:rgba(224,123,40,.2)">${counts.quarantineCount}</span>`; alertClass='alert-nav'; }
    }
    return sectionHeader + `<button class="nav-item ${S.page===n.id?'active':''} ${alertClass}" onclick="goPage('${n.id}')">
      <span class="nav-dot"></span>${n.label}${badge}
    </button>` + (n.id==='tickets' && S.page==='tickets' ? renderCategorySubnav() : '');
  }).join('');
}

function setupBackButton(){
  // Trap the phone/browser Back button so it dismisses the current layer instead of closing the app.
  // Order: modal -> ticket panel -> mobile sidebar drawer -> non-dashboard page. One spare history
  // entry is kept and re-armed after each dismissal; only a Back from the dashboard (nothing open) exits.
  try{ history.pushState({tkTrap:1}, ''); }catch(_){}
  window.addEventListener('popstate', function(){
    const ov=document.getElementById('modalOverlay');
    const modalOpen = ov && !ov.classList.contains('hidden') && (ov.innerHTML||'').trim()!=='';
    const panel=document.getElementById('tk-panel');
    const panelOpen = panel && panel.classList.contains('open');
    const drawer=document.querySelector('.sidebar-wrap');
    const drawerOpen = drawer && drawer.classList.contains('mobile-open');
    let handled=false;
    if(modalOpen){ try{closeModal();}catch(_){} handled=true; }
    else if(panelOpen){ try{closePanel();}catch(_){} handled=true; }
    else if(drawerOpen){ try{closeMobileSidebar();}catch(_){} handled=true; }
    else if(S.page && S.page!=='dashboard'){ try{goPage('dashboard');}catch(_){} handled=true; }
    if(handled){ try{ history.pushState({tkTrap:1}, ''); }catch(_){} }
    // else: at dashboard with nothing open -> allow the app to close (do not re-arm)
  });
}
window.setupBackButton = setupBackButton;
