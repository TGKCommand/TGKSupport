    if(error) throw error;
    S.tickets.unshift(data);
    const body = document.getElementById('ntBody').value.trim();
    if(body){
      await sb.from('ticket_messages').insert({
        ticket_id: data.id, sender_type: 'staff', sender_name: S.user.email, body, is_internal_note: false
      });
    }
    closeModal();
    toast('Ticket #' + data.ticket_number + ' created');
    goPage('tickets');
    openTicket(data.id);
  }catch(e){

}

        + '<button class="btn btn-sm" style="padding:2px 7px" ' + (i===list.length-1 ? 'disabled' : '') + ' onclick="moveCategory(' + i + ',1)" title="Move down">&#9660;</button>'

      + '</select></td>'
      + '<td style="width:150px"><span class="pill ' + (c.color||'pill-muted') + '">' + escapeHtml(c.name) + '</span></td>'
      + '<td style="width:100px;font-family:var(--mono);font-size:var(--t-sm);color:var(--text3)">' + n + ' ticket' + (n===1?'':'s') + '</td>'
      + '<td style="width:76px"><button class="btn btn-sm btn-danger" onclick="promptDeleteCategory(' + i + ')">Delete</button></td>'

  var addColor = PILL_COLORS.map(function(p){ return '<option value="' + p.v + '">' + p.label + '</option>'; }).join('');

  var html = '<div class="panel">'
    + '<div class="panel-title">Ticket Categories</div>'

      + 'These drive the sidebar sub-nav, the tickets filter bar, the category field on a ticket and the reply-template grouping. '
      + 'Renaming a category also renames it on every ticket that uses it.'

    + '<div class="tbl-wrap"><table><thead><tr><th>Order</th><th>Name</th><th>Colour</th><th>Preview</th><th>In use</th><th></th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table></div>';

    var dc = list[S._catDeleteIdx];
    var dn = categoryTicketCount(dc.name);
    var destOpts = '<option value="__clear__">Clear the category (leave blank)</option>'
      + list.filter(function(x){ return x.name !== dc.name; })
            .map(function(x){ return '<option value="' + escapeHtml(x.name) + '">Move to "' + escapeHtml(x.name) + '"</option>'; }).join('');
    html += '<div style="margin-top:14px;border:1px solid rgba(224,85,85,.4);border-radius:var(--r-lg);padding:14px 16px">'
      + '<div style="font-size:var(--t-md);font-weight:700;color:var(--red);margin-bottom:8px">Delete "' + escapeHtml(dc.name) + '"</div>'
      + '<div style="font-size:var(--t-md);color:var(--text2);margin-bottom:10px">' + dn + ' ticket' + (dn===1?'':'s') + ' currently use this category. Choose what happens to them:</div>'
      + '<select class="form-input" id="catDelDest" style="max-width:340px;margin-bottom:10px">' + destOpts + '</select>'
      + '<div style="display:flex;gap:8px">'

      + '<div class="form-group" style="flex:1;min-width:200px"><label class="form-label">New category</label>'
        + '<input class="form-input" id="newCatName" placeholder="e.g. Tech Support" onkeydown="if(event.key===\'Enter\')addCategory()"></div>'
      + '<div class="form-group" style="width:130px"><label class="form-label">Colour</label>'
        + '<select class="form-input" id="newCatColor">' + addColor + '</select></div>'

async function moveCategory(i, dir){
  var list = tkCategoryList().slice();
  var j = i + dir;
  if(j < 0 || j >= list.length) return;
  var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
  await commitCategories(list);
}

async function setCategoryColor(i, color){
  var list = tkCategoryList().slice();
  if(!list[i]) return;
  list[i] = { name:list[i].name, color:color };
  await commitCategories(list);
}

async function addCategory(){
  var inp = document.getElementById('newCatName');
  var name = ((inp && inp.value) || '').trim();
  if(!name){ toast('Enter a category name', true); return; }
  var list = tkCategoryList().slice();
  if(list.some(function(c){ return c.name.toLowerCase() === name.toLowerCase(); })){
    toast('That category already exists', true); return;
  }
  var colEl = document.getElementById('newCatColor');
  list.push({ name:name, color:(colEl && colEl.value) || 'pill-muted' });
  await commitCategories(list, 'Category added');
}

// Renaming has to carry the tickets with it, otherwise every ticket holding the
// old string silently drops out of the sub-nav and the filters.
async function renameCategory(i, raw, inputEl){
  var list = tkCategoryList();
  var c = list[i]; if(!c) return;
  var oldName = c.name;
  var newName = String(raw||'').trim();
  if(!newName){ toast('Category name cannot be empty', true); if(inputEl) inputEl.value = oldName; return; }
  if(newName === oldName) return;
  if(list.some(function(x, j){ return j !== i && x.name.toLowerCase() === newName.toLowerCase(); })){
    toast('A category with that name already exists', true); if(inputEl) inputEl.value = oldName; return;
  }
  var n = categoryTicketCount(oldName);
  if(n && !confirm('Rename "' + oldName + '" to "' + newName + '"?\n\n' + n + ' ticket(s) use this category and will be updated to match.')){
    if(inputEl) inputEl.value = oldName; return;
  }
  var next = list.slice();
  next[i] = { name:newName, color:c.color||'pill-muted' };
  var ok = await saveSetting('ticket_categories', next);
  if(!ok){ if(inputEl) inputEl.value = oldName; return; }
  try{
    if(n){
      var r = await sb.from('tickets').update({ category:newName }).eq('category', oldName);
      if(r.error) throw r.error;
      S.tickets.forEach(function(t){ if(t.category === oldName) t.category = newName; });
    }
    var tr = await sb.from('ticket_templates').update({ category:newName }).eq('category', oldName);
    if(tr.error) throw tr.error;
    (S.templates||[]).forEach(function(x){ if(x.category === oldName) x.category = newName; });
    toast('Category renamed' + (n ? (' - ' + n + ' ticket(s) updated') : ''));
  }catch(e){
    toast('Renamed in settings but updating tickets failed: ' + e.message, true);
  }
  if(S.filters.category === oldName) S.filters.category = newName;
  renderNav();
  renderSettings();
}
window.renameCategory = renameCategory;

function promptDeleteCategory(i){
  var list = tkCategoryList();
  var c = list[i]; if(!c) return;
  if(!categoryTicketCount(c.name)){
    if(!confirm('Delete the category "' + c.name + '"?')) return;
    var next = list.slice(); next.splice(i, 1);
    if(!next.length){ toast('Keep at least one category', true); return; }
    commitCategories(next, 'Category deleted');
    return;
  }
  S._catDeleteIdx = i;
  renderSettings();
}
window.promptDeleteCategory = promptDeleteCategory;

async function confirmDeleteCategory(){
  var i = S._catDeleteIdx; if(i == null) return;
  var list = tkCategoryList();
  var c = list[i]; if(!c) return;
  var next = list.slice(); next.splice(i, 1);
  if(!next.length){ toast('Keep at least one category', true); return; }
  var destEl = document.getElementById('catDelDest');
  var dest = (destEl && destEl.value) || '__clear__';
  var newVal = (dest === '__clear__') ? null : dest;
  var affected = categoryTicketCount(c.name);

  // Settings row first: if that write fails no ticket data has been touched.
  var ok = await saveSetting('ticket_categories', next);
  if(!ok) return;
  try{
    if(affected){
      var r = await sb.from('tickets').update({ category:newVal }).eq('category', c.name);
      if(r.error) throw r.error;
      S.tickets.forEach(function(t){ if(t.category === c.name) t.category = newVal; });
    }
    var tr = await sb.from('ticket_templates').update({ category:newVal }).eq('category', c.name);
    if(tr.error) throw tr.error;
    (S.templates||[]).forEach(function(x){ if(x.category === c.name) x.category = newVal; });
    toast('Category deleted' + (affected ? (' - ' + affected + ' ticket(s) reassigned') : ''));
  }catch(e){
    toast('Category removed but reassigning tickets failed: ' + e.message, true);
  }
  if(S.filters.category === c.name) S.filters.category = '';
  S._catDeleteIdx = null;
  renderNav();
  renderSettings();
}
window.confirmDeleteCategory = confirmDeleteCategory;

window.addTagPreset = addTagPreset;

async function renameTagPreset(i, raw, inputEl){
  var tags = window.TICKET_CATEGORIES.slice();
  var oldName = tags[i]; if(oldName == null) return;
  var newName = String(raw||'').trim();
  if(!newName){ toast('Tag cannot be empty', true); if(inputEl) inputEl.value = oldName; return; }
  if(newName === oldName) return;
  if(tags.some(function(t, j){ return j !== i && t.toLowerCase() === newName.toLowerCase(); })){
    toast('That tag already exists', true); if(inputEl) inputEl.value = oldName; return;
  }
  var affected = S.tickets.filter(function(t){ return (t.tags||[]).indexOf(oldName) !== -1; });
  var migrate = false;
  if(affected.length){
    migrate = confirm('Also rename this tag on the ' + affected.length + ' ticket(s) that carry it?\n\nOK = rename everywhere.\nCancel = only change the preset list.');
  }
  tags[i] = newName;
  var ok = await saveSetting('tag_presets', tags);
  if(!ok){ if(inputEl) inputEl.value = oldName; return; }
  if(migrate){
    var failed = 0;
    for(var k = 0; k < affected.length; k++){
      var t = affected[k];
      var nt = (t.tags||[]).map(function(x){ return x === oldName ? newName : x; });
      try{
        var r = await sb.from('tickets').update({ tags:nt }).eq('id', t.id);
        if(r.error) throw r.error;
        t.tags = nt;
      }catch(e){ failed++; }
    }
    toast(failed ? ('Renamed, but ' + failed + ' ticket(s) failed to update') : ('Tag renamed on ' + affected.length + ' ticket(s)'), !!failed);
  } else {
    toast('Tag preset renamed');
  }
  renderSettings();
}
window.renameTagPreset = renameTagPreset;

async function deleteTagPreset(i){
  var tags = window.TICKET_CATEGORIES.slice();
  var name = tags[i]; if(name == null) return;
  var affected = S.tickets.filter(function(t){ return (t.tags||[]).indexOf(name) !== -1; });
  if(!confirm('Remove "' + name + '" from the preset list?' + (affected.length ? ('\n\n' + affected.length + ' ticket(s) currently carry this tag - they keep it unless you strip it in the next step.') : ''))) return;
  tags.splice(i, 1);
  var ok = await saveSetting('tag_presets', tags);
  if(!ok) return;
  if(affected.length && confirm('Also strip "' + name + '" from those ' + affected.length + ' ticket(s)?')){
    var failed = 0;
    for(var k = 0; k < affected.length; k++){
      var t = affected[k];
      var nt = (t.tags||[]).filter(function(x){ return x !== name; });
      try{
        var r = await sb.from('tickets').update({ tags:nt }).eq('id', t.id);
        if(r.error) throw r.error;
        t.tags = nt;
      }catch(e){ failed++; }
    }
    if(failed) toast(failed + ' ticket(s) failed to update', true);
  }
  if(S.filters.tag === name) S.filters.tag = '';
  toast('Tag preset deleted');
  renderSettings();
}
window.deleteTagPreset = deleteTagPreset;

function renderSettingsWorkflow(){

async function saveWorkflowSettings(){
  var el = document.getElementById('setStaleHours');

  if(!isFinite(n) || n <= 0){ toast('Enter a positive number of hours', true); return; }
  var ok = await saveSetting('stale_hours', n);
  if(!ok) return;
  toast('Workflow settings saved');
  renderNav();
  renderSettings();
}

function renderSettingsTeam(){
  var rows = (S.team||[]).slice().sort(function(a,b){

  + '</div>';

async function saveTeamDisplayName(email, raw, inputEl){
  var name = String(raw||'').trim();
  var prev = ((S.team||[]).filter(function(m){ return m.email === email; })[0]||{}).display_name || '';
  try{
    var r = await sb.from('team_members').update({ display_name: name || null }).ilike('email', email);
    if(r.error) throw r.error;
    (S.team||[]).forEach(function(m){ if(m.email === email) m.display_name = name || null; });
    toast('Display name saved');
  }catch(e){
    toast('Save failed: ' + e.message, true);
    if(inputEl) inputEl.value = prev;
  }
}
window.saveTeamDisplayName = saveTeamDisplayName;

/* ---------------- SQL setup ---------------- */
var SUPPORT_SETTINGS_SQL = [
  'create table if not exists public.support_settings (',
  '  key         text primary key,',
  '  value       jsonb not null,',
  '  updated_at  timestamptz default now(),',
  '  updated_by  text',
  ');',
  '',
  'alter table public.support_settings enable row level security;',
  '',
  'drop policy if exists "support_settings read" on public.support_settings;',
  'create policy "support_settings read" on public.support_settings',
  '  for select to authenticated using (true);',
  '',
  'drop policy if exists "support_settings write" on public.support_settings;',
  'create policy "support_settings write" on public.support_settings',
  '  for all to authenticated using (true) with check (true);',
  '',
  '-- let the Support Center pick up edits live',
  'do $$ begin',
  '  alter publication supabase_realtime add table public.support_settings;',
  'exception when duplicate_object then null; end $$;',
  '',
  '-- seed with the categories and tags the app ships with',
  'insert into public.support_settings (key, value) values',
  '  (\'ticket_categories\', \'[',
  '    {"name":"Inquiry","color":"pill-muted"},',
  '    {"name":"Return","color":"pill-orange"},',
  '    {"name":"Warranty","color":"pill-red"},',
  '    {"name":"Shipment Error","color":"pill-yellow"},',
  '    {"name":"Wholesale/Dealer","color":"pill-teal"},',
  '    {"name":"Other","color":"pill-muted"}',
  '  ]\'::jsonb),',
  '  (\'tag_presets\', \'["Shipping","Warranty/Defect","Billing","Return/Refund","Part Compatibility","General Question","Other"]\'::jsonb),',
  '  (\'stale_hours\', \'24\'::jsonb)',
  'on conflict (key) do nothing;'
].join('\n');

function renderSettingsSql(){
  var status = S.settingsTable === 'ok'
    ? '<span class="pill pill-green">Table present</span>'
    : (S.settingsTable === 'missing' ? '<span class="pill pill-red">Table missing</span>' : '<span class="pill pill-muted">Not checked</span>');
  return '<div class="panel">'
    + '<div class="panel-title" style="display:flex;align-items:center;gap:10px"><span style="flex:1">SQL Setup</span>' + status + '</div>'
    + '<div style="font-size:var(--t-sm);color:var(--text3);margin-bottom:10px;line-height:1.6">'
      + 'Run this once in the Supabase SQL editor for project <code>piamamighqiielfztgic</code>. It is safe to run more than once.'
    + '</div>'
    + '<textarea class="form-input" readonly rows="30" style="font-family:var(--mono);font-size:var(--t-sm);line-height:1.5;resize:vertical" onclick="this.select()">' + escapeHtml(SUPPORT_SETTINGS_SQL) + '</textarea>'
    + '<div style="margin-top:10px;display:flex;gap:8px">'
      + '<button class="btn btn-sm" onclick="copySettingsSql()">Copy SQL</button>'
      + '<button class="btn btn-sm" onclick="recheckSettingsTable()">Re-check table</button>'
    + '</div></div>';
}

function copySettingsSql(){
  try{
    navigator.clipboard.writeText(SUPPORT_SETTINGS_SQL);
    toast('SQL copied to clipboard');
  }catch(e){ toast('Copy failed - select the text and copy manually', true); }
}
window.copySettingsSql = copySettingsSql;

async function recheckSettingsTable(){
  await loadSettings();
  toast(S.settingsTable === 'ok' ? 'Settings table found' : 'Still not reachable', S.settingsTable !== 'ok');
  renderNav();
  renderSettings();
}
window.recheckSettingsTable = recheckSettingsTable;

<script>
/* ---- Push notifications (Support tickets) ---- */
const _VAPID_PUBLIC='BD8x6PsDMpDA9WRl7Lt9qOd8COvYowpkG67OW8M4EXzBw2DI_qsiC-5a_DHEFTje4Lq1HBWi_dKj9S6HrFYaQMU';
function _b64ToU8(b64){const pad='='.repeat((4-b64.length%4)%4);const t=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(t);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));}
async function enableSupportPush(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)){
      alert('Push is not available here.\n\nOn iPhone: tap Share -> Add to Home Screen, then open the app from that icon (requires iOS 16.4+).');
      return;
    }
    const reg=await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ alert('Notifications were not enabled.'); return; }
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:_b64ToU8(_VAPID_PUBLIC)});
    const j=sub.toJSON();
    await sb.from('push_subscriptions').upsert({
      endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth,
      user_email:(S&&S.user&&S.user.email)||null, audience:'support', user_agent:navigator.userAgent
    },{onConflict:'endpoint'});
    const b=document.getElementById('enablePushBtn'); if(b)b.innerHTML='&#128276; Notifications on';
    alert('Notifications enabled on this device.');
  }catch(e){ alert('Could not enable notifications: '+(e.message||e)); }
}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
window.enableSupportPush=enableSupportPush;
</script>
<script>
/* MACHINED nameplate header (Support v1.21) - presentation only. */
(function(){
  function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function meta(){
    var act=document.querySelector('.nav-item.active');
    var group='SUPPORT', gi=0, ii=0;
    if(act){
      var sib=act.previousElementSibling, count=0;
      while(sib){
        if(sib.classList&&sib.classList.contains('sidebar-section')){group=sib.textContent.trim();break;}
        if(sib.classList&&sib.classList.contains('nav-item'))count++;
        sib=sib.previousElementSibling;
      }
      ii=count;
      var secs=Array.prototype.slice.call(document.querySelectorAll('.sidebar-section'));
      for(var k=0;k<secs.length;k++){if(secs[k].textContent.trim()===group){gi=k;break;}}
    }
    var code=gi*10+ii; code=(code<10?'0':'')+code;
    return {code:code, group:group.toUpperCase()};
  }
  function decorate(){
    var t=document.querySelector('.topbar-title');
    if(!t)return;
    var eb=t.querySelector('.tb-eb');
    if(eb&&t.getAttribute('data-tb-raw')===(t.querySelector('.tb-tt')||{}).textContent)return;
    var raw=(eb?(t.querySelector('.tb-tt')||t).textContent:t.textContent)||'';
    raw=raw.trim(); if(!raw)return;
    var m=meta();
    t.innerHTML='<span class="tb-eb">SEC '+m.code+' \u2014 '+esc(m.group)+'</span><span class="tb-tt">'+esc(raw)+'</span>';
    t.setAttribute('data-tb-raw',raw);
  }
  function arm(){
    var t=document.querySelector('.topbar-title');
    if(!t){setTimeout(arm,400);return;}
    decorate();
    try{new MutationObserver(function(){decorate();}).observe(t,{childList:true,characterData:true,subtree:true});}catch(e){}
    document.addEventListener('click',function(){setTimeout(decorate,60);},true);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',arm);else arm();
})();
</script>

<script>/* ===== phone: "More" sheet and search button ===== */
(function () {
  'use strict';
  var CFG = window.__TGK_MORE || {};
  function el(sel) { return document.querySelector(sel); }
  function close() { document.body.classList.remove('tgk-sheet-open'); }
  function build() {
    var bar = el(CFG.bar || '.topbar-actions'); if (!bar || el('#tgk-more-btn')) return;
    var b = document.createElement('button'); b.id = 'tgk-more-btn'; b.type = 'button'; b.className = CFG.btnClass || 'btn btn-sm'; b.setAttribute('aria-label', 'More actions'); b.setAttribute('aria-haspopup', 'dialog');
    b.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';
    var first = CFG.insertBefore ? el(CFG.insertBefore) : null; if (first && first.parentNode === bar) bar.insertBefore(b, first); else bar.appendChild(b);
    var scrim = document.createElement('div'); scrim.id = 'tgk-sheet-scrim'; document.body.appendChild(scrim);
    var sh = document.createElement('div'); sh.id = 'tgk-sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-label', 'More actions'); document.body.appendChild(sh);
    scrim.addEventListener('click', close); document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    b.addEventListener('click', function () {
      sh.innerHTML = '<h6>More</h6>';
      (CFG.items || []).forEach(function (it) {
        var o = el(it[1]); if (!o) return; var r = document.createElement('button'); r.type = 'button'; r.textContent = it[0]; if (o.disabled) r.disabled = true;
        r.addEventListener('click', function () { close(); setTimeout(function () { o.click(); }, 30); }); sh.appendChild(r);
      });
      document.body.classList.add('tgk-sheet-open');
    });
  }
  function searchBtn() {
    if (!CFG.search || el('#tgk-search-btn')) return; var w = el(CFG.search); var bar = el(CFG.bar || '.topbar-actions'); if (!w || !bar) return;
    var b = document.createElement('button'); b.id = 'tgk-search-btn'; b.type = 'button'; b.className = CFG.btnClass || 'btn btn-sm'; b.setAttribute('aria-label', 'Search');
    b.innerHTML = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
    var first = bar.firstChild; bar.insertBefore(b, first);
    b.addEventListener('click', function () { document.body.classList.add('tgk-search-open'); var i = w.querySelector('input'); if (i) setTimeout(function () { i.focus(); }, 60); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.body.classList.remove('tgk-search-open'); });
    document.addEventListener('click', function (e) { if (document.body.classList.contains('tgk-search-open') && !w.contains(e.target) && e.target !== b && !b.contains(e.target)) document.body.classList.remove('tgk-search-open'); });
  }
  function init() { build(); searchBtn(); setTimeout(function () { build(); searchBtn(); }, 1500); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
