/* ============================================================
   REBATES (v1.98): 5% back for a Facebook review.
   Customers send name, email, order number and a screenshot on the website. Each request arrives as a ticket in
   the category "Rebate" and lists in the Rebates queue. Opening it shows the order, the review screenshot and the
   5% amount; Send makes a PARTIAL REFUND through Shopify (the same process-shopify-refund function the Refund screen
   uses, with no line items) to the way the customer paid.
   Safety: a confirmation first; the button locks the moment it is pressed; once sent the ticket cannot send again
   (it is remembered on the ticket AND locally, even if saving the ticket fails). Declining closes the ticket with
   nothing refunded, which also lets the customer try again from the website.
   ============================================================ */
const REBATE_PCT = 0.05;
function isRebate(t){ return !!t && String(t.category||'').toLowerCase() === 'rebate'; }
function rebateIsSent(t){ return !!(t && (t.shopify_refund_id || Number(t.refund_amount) > 0 || (S.rebate && S.rebate[t.id] && S.rebate[t.id].sentLocal))); }
function rebateIsDeclined(t){ return !!t && t.status === 'closed' && !rebateIsSent(t); }
function rebateReviewItems(){ return (S.tickets||[]).filter(t=>isRebate(t) && !t.archived && !rebateIsSent(t) && !['resolved','closed'].includes(t.status)); }
function rebateMoney(n){ return '$' + (Number(n)||0).toFixed(2); }
function rebateRound(n){ return Math.round((Number(n)||0) * 100) / 100; }
function rebateState(id){ S.rebate = S.rebate || {}; return S.rebate[id] || (S.rebate[id] = { loaded:false, loading:false, err:'', sale:null, summary:null, summaryNote:'', itemsTotal:'', amount:'', amountEdited:false, busy:false, sentLocal:0 }); }
function rebateOrderId(id){ const st = rebateState(id); return (st.sale && st.sale.shopify_order_id) || (st.summary && st.summary.shopify_order_id) || ''; }

/* ---------- the Rebates queue ---------- */
function renderRebatesList(){
  const el = document.getElementById('content');
  const all = S.tickets.filter(t=>isRebate(t) && !t.archived).sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));
  const groups = {
    review: all.filter(t=>!rebateIsSent(t) && !['resolved','closed'].includes(t.status)),
    sent: all.filter(rebateIsSent),
    declined: all.filter(rebateIsDeclined),
    all: all
  };
  const tab = groups[S.rebateTab] ? S.rebateTab : 'review';
  const tabBtn = (id, label) => `<button type="button" class="btn btn-sm ${tab===id?'btn-teal':''}" onclick="S.rebateTab='${id}';renderRebatesList()">${label} (${groups[id].length})</button>`;
  const thumb = t => { const a = (t.attachments||[]).find(x=>x && x.url); return a ? `<img src="${escapeHtml(a.url)}" alt="" loading="lazy" style="height:34px;width:auto;border-radius:4px;border:1px solid var(--border);vertical-align:middle">` : '&mdash;'; };
  const status = t => rebateIsSent(t) ? '<span class="pill pill-green">Sent</span>' : (rebateIsDeclined(t) ? '<span class="pill pill-muted">Declined</span>' : '<span class="pill pill-orange">To review</span>');
  const rows = groups[tab];
  const empty = { review:'No rebate requests waiting for review.', sent:'No rebates have been sent yet.', declined:'No declined rebates.', all:'No rebate requests yet.' }[tab];
  el.innerHTML = `
    <p style="font-size:var(--t-md);color:var(--text3);margin-bottom:14px">5% rebates for customers who posted a Facebook review. Open one to see the order and the review screenshot, then send the rebate to the way they paid.</p>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${tabBtn('review','To review')}${tabBtn('sent','Sent')}${tabBtn('declined','Declined')}${tabBtn('all','All')}</div>
    ${!rows.length ? `<div class="tbl-wrap"><div class="empty">${empty}</div></div>` : `
    <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Customer</th><th>Order</th><th>Review</th><th>Received</th><th>Status</th><th>Rebate</th></tr></thead>
    <tbody>${rows.map(t=>`
      <tr style="cursor:pointer" onclick="openTicket('${escapeHtml(t.id)}')">
        <td class="pn">#${escapeHtml(String(t.ticket_number||''))}</td>
        <td>${escapeHtml(t.customer_name||'')}<div style="font-size:var(--t-sm);color:var(--text3)">${escapeHtml(t.customer_email||'')}</div></td>
        <td class="pn">${t.order_number ? '#'+escapeHtml(t.order_number) : '&mdash;'}</td>
        <td>${thumb(t)}</td>
        <td>${escapeHtml(timeAgo(t.created_at))}</td>
        <td>${status(t)}</td>
        <td class="pn">${rebateIsSent(t) ? rebateMoney((S.rebate&&S.rebate[t.id]&&S.rebate[t.id].sentLocal)||t.refund_amount) : '&mdash;'}</td>
      </tr>`).join('')}</tbody></table></div>`}`;
}

/* ---------- the rebate card inside a ticket ---------- */
function rebateCardHost(){
  const body = document.querySelector('#tk-panel .tk-body');
  if(!body) return null;
  let c = document.getElementById('rebateCard');
  if(!c){ c = document.createElement('div'); c.id = 'rebateCard'; body.insertBefore(c, body.firstChild); }
  return c;
}
function rebateCardMount(t){
  if(!rebateCardHost()) return;
  rebateCardPaint(t);
  const st = rebateState(t.id);
  if(!st.loaded && !st.loading && !rebateIsSent(t) && !rebateIsDeclined(t)) rebateLoad(t);
}
function rebateRepaint(id){
  if(!(S.activeTicket && S.activeTicket.id === id) || !document.getElementById('rebateCard')) return;
  const t = S.tickets.find(x=>x.id === id) || S.activeTicket;
  rebateCardPaint(t);
}
async function rebateLoad(t){
  const st = rebateState(t.id);
  st.loading = true; st.err = ''; st.summaryNote = '';
  rebateRepaint(t.id);
  try{
    if(!t.order_number){ st.err = 'This ticket has no order number, so there is no order to look up.'; }
    else{
      const rows = await findSalesByOrderNumber(t.order_number);
      st.sale = rows.length ? { shopify_order_id: rows[0].shopify_order_id || null, lines: rows.map(r=>({ pn:r.pn, qty:r.qty || 1 })) } : null;
      // Prices come from Shopify through a read-only function. If it is not set up yet, staff type the items total instead.
      try{
        const sess = await sb.auth.getSession();
        const tok = sess && sess.data && sess.data.session && sess.data.session.access_token;
        const resp = await fetch(`${SUPABASE_URL}/functions/v1/rebate-order-summary`, {
          method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + (tok || SUPABASE_ANON_KEY), 'apikey':SUPABASE_ANON_KEY },
          body: JSON.stringify(st.sale && st.sale.shopify_order_id ? { shopify_order_id: String(st.sale.shopify_order_id) } : { order_number: t.order_number })
        });
        const j = await resp.json().catch(()=>({}));
        if(resp.ok && j.ok && j.order) st.summary = j.order;
        else st.summaryNote = j.error || ('Order prices are not available (' + resp.status + ').');
      }catch(e){ st.summaryNote = 'Order prices are not available right now.'; }
      if(st.summary && !st.amountEdited && !st.itemsTotal){
        st.itemsTotal = Number(st.summary.items_total).toFixed(2);
        st.amount = rebateRound(st.summary.items_total * REBATE_PCT).toFixed(2);
      }
    }
  }catch(e){ st.err = 'Could not load the order: ' + (e.message || e); }
  st.loaded = true; st.loading = false;
  rebateRepaint(t.id);
}
function rebateCardPaint(t){
  const c = document.getElementById('rebateCard');
  if(!c) return;
  const st = rebateState(t.id);
  const id = escapeHtml(t.id);
  const shots = (t.attachments||[]).filter(a=>a && a.url);
  const shotHtml = shots.length
    ? `<div class="rb-label">Review screenshot${shots.length>1?'s':''}</div><div class="rb-shots">${shots.map(a=>`<a href="${escapeHtml(a.url)}" target="_blank" rel="noopener"><img src="${escapeHtml(a.url)}" alt="${escapeHtml(a.name||'Facebook review screenshot')}" loading="lazy"></a>`).join('')}</div>`
    : '<div class="rb-warn">No screenshot was attached to this request.</div>';
  if(rebateIsSent(t)){
    const amt = st.sentLocal || t.refund_amount;
    c.className = 'rb-card rb-ok';
    c.innerHTML = `<div class="rb-head"><div class="rb-title">5% Facebook review rebate</div><span class="pill pill-green">Sent</span></div>
      <div class="rb-grid"><div><div style="font-size:15px;font-weight:700">${rebateMoney(amt)} refunded to the original payment method</div>
      <div class="rb-note">Order #${escapeHtml(t.order_number||'')}${t.resolved_at ? ' &middot; ' + escapeHtml(timeAgo(t.resolved_at)) : ''}. This rebate cannot be sent again.</div></div><div>${shotHtml}</div></div>
      ${st.saveWarn ? '<div class="rb-warn">The refund WAS sent, but this ticket could not be saved. Set its status to Resolved yourself, then send the confirmation that is drafted in the reply box.</div>' : ''}`;
    return;
  }
  if(rebateIsDeclined(t)){
    c.className = 'rb-card rb-done';
    c.innerHTML = `<div class="rb-head"><div class="rb-title">5% Facebook review rebate</div><span class="pill pill-muted">Declined</span></div>
      <div class="rb-grid"><div><div style="font-size:14px">This request was declined and nothing was refunded. The customer can send a new request from the website.</div></div><div>${shotHtml}</div></div>`;
    return;
  }
  const sum = st.summary;
  const orderId = rebateOrderId(t.id);
  let linesHtml = '';
  if(sum && sum.lines && sum.lines.length){
    linesHtml = sum.lines.map(l=>`<tr><td>${escapeHtml(l.sku||'')} ${l.title ? '<span style="color:var(--text3)">'+escapeHtml(l.title)+'</span>' : ''} x${Number(l.qty)||1}</td><td class="n">${rebateMoney(l.total)}</td></tr>`).join('');
  } else if(st.sale && st.sale.lines.length){
    linesHtml = st.sale.lines.map(l=>`<tr><td>${escapeHtml(l.pn||'')} x${Number(l.qty)||1}</td><td class="n" style="color:var(--text3)">price not shown</td></tr>`).join('');
  }
  const warns = [];
  if(st.err) warns.push(escapeHtml(st.err));
  if(st.loaded && !st.err && !orderId) warns.push('This order was not found in the ERP sales data or in Shopify, so the rebate cannot be sent from here. Check the order number on the ticket.');
  if(st.loaded && !sum && st.summaryNote) warns.push('Order prices are not available (' + escapeHtml(st.summaryNote) + ') Type the order&#39;s items total below and the 5% is worked out for you.');
  if(sum && sum.email && t.customer_email && String(sum.email).toLowerCase() !== String(t.customer_email).toLowerCase()) warns.push('The email on the Shopify order (<b>' + escapeHtml(sum.email) + '</b>) is different from the email on this request (<b>' + escapeHtml(t.customer_email) + '</b>). Check before sending.');
  if(sum && Number(sum.refunded_total) > 0) warns.push('This order already has <b>' + rebateMoney(sum.refunded_total) + '</b> refunded.');
  if(sum && sum.financial_status && !['paid','partially_paid','partially_refunded'].includes(String(sum.financial_status).toLowerCase())) warns.push('Shopify shows this order as <b>' + escapeHtml(sum.financial_status) + '</b>.');
  const n = parseFloat(st.amount), okAmt = isFinite(n) && n > 0;
  c.className = 'rb-card';
  c.innerHTML = `
    <div class="rb-head"><div class="rb-title">5% Facebook review rebate</div><span class="pill pill-orange">To review</span></div>
    <div class="rb-grid"><div>
      <div class="rb-label">Order ${t.order_number ? '#'+escapeHtml(t.order_number) : ''}${sum ? ' (found in Shopify)' : ''}</div>
      ${st.loading ? '<div class="rb-note">Looking up the order...</div>' : (linesHtml ? `<table>${linesHtml}</table>` : '')}
      <div class="rb-amt"><label for="rbItems" style="font-size:13px">Items total (after discounts, no shipping or tax)</label>
        <div style="position:relative"><span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3)">$</span><input class="form-input" id="rbItems" type="number" step="0.01" min="0" value="${escapeHtml(st.itemsTotal)}" oninput="rebateOnItems('${id}',this.value)" style="padding-left:22px"></div></div>
      <div class="rb-amt"><label for="rbAmount" style="font-size:13px;font-weight:700">Rebate (5%)</label>
        <div style="position:relative"><span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3)">$</span><input class="form-input" id="rbAmount" type="number" step="0.01" min="0" value="${escapeHtml(st.amount)}" oninput="rebateOnAmount('${id}',this.value)" style="padding-left:22px;font-weight:700"></div>
        <span style="font-size:12px;color:var(--text3)">You can change the amount.</span></div>
    </div><div>${shotHtml}</div></div>
    ${warns.map(w=>`<div class="rb-warn">${w}</div>`).join('')}
    <div class="rb-btns">
      <button type="button" class="btn btn-primary" id="rbSendBtn" onclick="rebateSend('${id}')" ${(!okAmt || !orderId || st.busy) ? 'disabled' : ''}>${st.busy ? 'Sending...' : (okAmt ? 'Send ' + rebateMoney(n) + ' rebate to original payment' : 'Enter an amount')}</button>
      <button type="button" class="btn" onclick="rebateAskClearer('${id}')">Ask for a clearer screenshot</button>
      <button type="button" class="btn" style="color:var(--red)" onclick="rebateDecline('${id}')">Decline</button>
    </div>
    <div class="rb-note">Sends a partial refund through Shopify to the way the customer paid. After it is sent the ticket is marked paid and this button locks, so a rebate cannot be sent twice.</div>`;
}
function rebateSyncBtn(id){
  const st = rebateState(id), b = document.getElementById('rbSendBtn');
  if(!b) return;
  const n = parseFloat(st.amount), ok = isFinite(n) && n > 0;
  b.disabled = !(ok && rebateOrderId(id) && !st.busy);
  b.textContent = st.busy ? 'Sending...' : (ok ? 'Send ' + rebateMoney(n) + ' rebate to original payment' : 'Enter an amount');
}
function rebateOnItems(id, v){
  const st = rebateState(id);
  st.itemsTotal = v;
  if(!st.amountEdited){
    const n = parseFloat(v);
    st.amount = (isFinite(n) && n > 0) ? rebateRound(n * REBATE_PCT).toFixed(2) : '';
    const a = document.getElementById('rbAmount'); if(a) a.value = st.amount;
  }
  rebateSyncBtn(id);
}
function rebateOnAmount(id, v){ const st = rebateState(id); st.amount = v; st.amountEdited = true; rebateSyncBtn(id); }
window.rebateOnItems = rebateOnItems; window.rebateOnAmount = rebateOnAmount;

async function rebateSend(id){
  const t = S.tickets.find(x=>x.id === id);
  const st = rebateState(id);
  if(!t || st.busy || rebateIsSent(t)) return;
  const amount = rebateRound(parseFloat(st.amount));
  if(!(amount > 0)){ toast('Enter a rebate amount', true); return; }
  const orderId = rebateOrderId(id);
  if(!orderId){ toast('This order has no Shopify order id on file, so the rebate cannot be sent from here', true); return; }
  const base = parseFloat(st.itemsTotal);
  let msg = 'Send a ' + rebateMoney(amount) + ' rebate to ' + (t.customer_email || 'the customer') + ' for order #' + t.order_number + '?\n\nThis is a REAL partial refund through Shopify to the way they paid. It cannot be undone from here.';
  if(isFinite(base) && base > 0 && amount > base * REBATE_PCT * 1.5) msg += '\n\nNote: that is more than 5% of ' + rebateMoney(base) + '.';
  if(st.summary && Number(st.summary.refunded_total) > 0) msg += '\n\nNote: this order already has ' + rebateMoney(st.summary.refunded_total) + ' refunded.';
  if(!confirm(msg)) return;
  st.busy = true; rebateSyncBtn(id);
  try{
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/process-shopify-refund`, {
      method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`, 'apikey':SUPABASE_ANON_KEY },
      body: JSON.stringify({ ticket_id:id, ticket_number:t.ticket_number, shopify_order_id:orderId, line_items:[], refund_amount:amount, restocking_fee:0, reason:'5% Facebook review rebate' })
    });
    const result = await resp.json().catch(()=>({}));
    if(!resp.ok) throw new Error(result.error || 'Refund failed');
    st.sentLocal = amount;            // the money has moved: lock this ticket for good, whatever happens next
  }catch(e){
    st.busy = false; rebateSyncBtn(id);
    toast('Rebate failed: ' + (e.message || e), true);
    return;
  }
  // Money is sent. Everything below is bookkeeping, and must never make it look as if the rebate failed.
  let saved = true;
  try{
    const { data: updated } = await sb.from('tickets').select('*').eq('id', id).single();
    if(updated){ const i = S.tickets.findIndex(x=>x.id === id); if(i !== -1) S.tickets[i] = updated; S.activeTicket = updated; }
    const cur = S.tickets.find(x=>x.id === id);
    if(cur && !(cur.shopify_refund_id || Number(cur.refund_amount) > 0)) await updateTicketField(id, 'refund_amount', amount);
    await updateTicketField(id, 'status', 'resolved');
  }catch(e){ saved = false; }
  // updateTicketField reports its own errors instead of throwing, so check what the ticket really looks like now.
  const after = S.tickets.find(x=>x.id === id);
  if(!(after && after.status === 'resolved' && (after.shopify_refund_id || Number(after.refund_amount) > 0))) saved = false;
  if(saved) toast('Rebate of ' + rebateMoney(amount) + ' sent');
  else{ st.saveWarn = true; toast('Rebate of ' + rebateMoney(amount) + ' was SENT, but the ticket could not be updated. Mark it Resolved yourself.', true); }
  st.busy = false;
  try{ renderTicketPanel(S.tickets.find(x=>x.id === id) || S.activeTicket); }catch(_e){}
  try{ renderNav(); if(S.page === 'rebates') renderRebatesList(); }catch(_e){}
  if(!saved){ try{ rebateDraft(rebateConfirmText(S.tickets.find(x=>x.id === id), amount)); }catch(_e){} return; }   // keep the warning on screen; staff send the drafted confirmation after fixing the ticket
  try{ await rebateSendConfirmation(id, amount); }catch(e){ toast('Rebate sent. The confirmation email did not go out: ' + (e.message || e), true); }
}
function rebateConfirmText(t, amount){
  const first = String((t && t.customer_name) || '').trim().split(/\s+/)[0] || 'there';
  return 'Hi ' + first + ',\n\nThank you for your review! Your 5% rebate of ' + rebateMoney(amount) + ' for order #' + (t && t.order_number) + ' has been refunded to the payment method you used. Depending on your bank, it can take several business days to show up.\n\nTGK Motorsport';
}
window.rebateSend = rebateSend;
async function rebateSendConfirmation(id, amount){
  const t = S.tickets.find(x=>x.id === id);
  if(!t || !t.customer_email) return;
  const box = document.getElementById('msgBox'), composer = document.getElementById('replyComposer');
  if(!box || (composer && composer.getAttribute('data-mode') === 'notes')){ toast('Rebate sent. Remember to email the customer.'); return; }
  box.value = rebateConfirmText(t, amount);
  await sendMessage(id);
}
function rebateDraft(text){
  const box = document.getElementById('msgBox');
  if(!box) return;
  box.value = text; try{ box.focus(); }catch(_e){}
}
async function rebateAskClearer(id){
  const t = S.tickets.find(x=>x.id === id);
  if(!t) return;
  const first = String(t.customer_name || '').trim().split(/\s+/)[0] || 'there';
  await updateTicketField(id, 'status', 'waiting_customer');
  try{ renderTicketPanel(S.tickets.find(x=>x.id === id) || S.activeTicket); }catch(_e){}
  rebateDraft('Hi ' + first + ',\n\nThanks for sending your rebate request! We could not make out your review in the screenshot. Could you reply with a clearer screenshot that shows your name and the review text?\n\nThank you,\nTGK Motorsport');
  toast('Reply drafted: read it, then press Send');
}
async function rebateDecline(id){
  const t = S.tickets.find(x=>x.id === id);
  if(!t) return;
  if(!confirm('Decline this rebate request? The ticket will be closed with nothing refunded. The customer will be able to send a new request from the website.')) return;
  const first = String(t.customer_name || '').trim().split(/\s+/)[0] || 'there';
  await updateTicketField(id, 'status', 'closed');
  try{ renderTicketPanel(S.tickets.find(x=>x.id === id) || S.activeTicket); }catch(_e){}
  try{ renderNav(); if(S.page === 'rebates') renderRebatesList(); }catch(_e){}
  rebateDraft('Hi ' + first + ',\n\nThanks for reaching out about the 5% rebate. We were not able to find your review, so we cannot send a rebate for this order right now. If you post a review on our Facebook page and send a new request with a screenshot, we will be glad to take another look.\n\nThank you,\nTGK Motorsport');
  toast('Rebate declined. A reply is drafted if you want to let the customer know.');
}

/* ============================================================
   ADMIN ACTIVITY LOG (v1.92)
   Two sources feed admin_activity_log (see admin_activity_log.sql):
     db  -- a database trigger records every insert/update/delete on the
            Support Center's tables, with the signed-in user and time taken
            from the session on the server. The app cannot skip or fake these.
     app -- this file reports actions that don't map to a staff-made row
            change: sign-in/out, CSV exports, and every edge-function call
            (emails sent, Shopify drafts/invoices/refunds, return labels, AI).
            Those functions write as the service role, so without this the log
            would only show "system". Identity + time are still stamped by the
            server (log_activity), so nobody can log as someone else.
   Reading is restricted by row-level security to activity_log_viewers;
   the nav item is hidden for everyone else, but that's only cosmetic.
   ============================================================ */
function logApp(action, entityType, entityId, summary, details){
  try{
    return sb.rpc('log_activity', { p_action: action, p_entity_type: entityType||null, p_entity_id: entityId!=null?String(entityId):null, p_summary: summary||null, p_details: details||null })
      .then(()=>{}, ()=>{});
  }catch(_){ return Promise.resolve(); }
}
window.logApp = logApp;

const ALOG_FN_LABELS = {
  'send-ticket-email':'Sent ticket email', 'send-email-reply':'Sent email reply',
  'create-draft-order':'Shopify draft order', 'process-shopify-refund':'Processed Shopify refund',
  'generate-return-label':'Generated return label', 'get-return-rate':'Quoted return shipping rate',
  'anthropic-proxy':'Used AI assist'
};
// Tag every edge-function call with who made it. Wraps fetch once; never changes the request or response.
(function installActivityFetchHook(){
  if(window.__tgkAlogHook) return; window.__tgkAlogHook = true;
  const orig = window.fetch.bind(window);
  window.fetch = async function(input, init){
    const url = (typeof input==='string') ? input : (input && input.url) || '';
    const m = /\/functions\/v1\/([a-z0-9-]+)/i.exec(url);
    const resp = await orig(input, init);
    if(m && S.user){
      try{
        let b = {}; if(init && typeof init.body==='string'){ try{ b = JSON.parse(init.body)||{}; }catch(_){} }
        const fn = m[1];
        let label = ALOG_FN_LABELS[fn] || fn;
        if(fn==='create-draft-order') label = b.action==='invoice' ? 'Sent Shopify invoice' : b.action==='complete' ? (b.payment_pending ? 'Completed Shopify order (payment pending)' : 'Marked Shopify order paid') : b.action==='delete' ? 'Cancelled Shopify draft' : b.calculate ? 'Previewed Shopify order total' : 'Created Shopify draft order';
        const ent = b.ticket_id ? ['ticket', b.ticket_id] : b.email_id ? ['email', b.email_id] : [null, null];
        logApp('call:'+fn, ent[0], ent[1], label + (resp.ok ? '' : ' (FAILED '+resp.status+')'), { ok: resp.ok, status: resp.status, action: b.action||null });
      }catch(_){}
    }
    return resp;
  };
})();

S.alog = S.alog || { view:'timeline', day:null, timeline:[], settings:null, showSettings:false, rows:[], staff:[], summary:[], done:false, loading:false, showAccess:false,

const ALOG_TABLE_LABEL = { tickets:'ticket', ticket_messages:'ticket message', emails:'email', email_messages:'email message',
  ticket_templates:'template', support_settings:'setting', team_members:'team member', ticket_quarantine:'held (spam) submission',
  warranty_claims:'warranty claim', shipment_errors:'shipment error', dealers:'dealer', profiles:'user role', activity_log_viewers:'Activity Log access' };

function alogWho(email){ return email ? (typeof trackerName==='function' ? trackerName(email) : email) : 'System'; }
function alogStaffEmail(uid){ const x=(S.alog.staff||[]).find(p=>p.user_id===uid); return x ? x.email : uid; }
function alogDescribe(r){
  const row = (r.details && r.details.row) || {};
  if(r.source==='app'){
    if(r.action==='sign_in') return 'Opened the Support Center';
    if(r.action==='sign_out') return 'Signed out';
    return r.summary || r.action;
  }
  const verb = r.action==='insert' ? 'Created' : r.action==='delete' ? 'Deleted' : 'Updated';
  const t = r.entity_type;
  if(t==='activity_log_viewers') return (r.action==='delete' ? 'Removed' : 'Granted') + ' Activity Log access for ' + alogWho(alogStaffEmail(r.entity_id));
  if(t==='tickets') return verb + ' ticket' + (row.ticket_number ? ' #'+row.ticket_number : '') + (row.subject && r.action!=='update' ? ' \u2014 '+row.subject : '');
  if(t==='emails') return verb + ' ' + (row.mailbox==='orders' ? 'order' : 'email') + (row.display_number ? ' #'+row.display_number : '') + (row.subject && r.action!=='update' ? ' \u2014 '+row.subject : '');
  if(t==='ticket_messages'){ const tk=(S.tickets||[]).find(x=>x.id===row.ticket_id); return (r.action==='insert' ? (row.sender_type==='customer' ? 'Received customer message' : 'Added message') : verb+' message') + ' on ticket' + (tk ? ' #'+tk.ticket_number : ''); }
  if(t==='email_messages') return (r.action==='insert' ? (row.direction==='inbound' ? 'Received' : 'Sent') + ' email message' : verb + ' email message');
  if(t==='profiles') return verb + ' user role' + (row.role ? ' ('+row.role+')' : '');
  if(t==='support_settings') return verb + ' setting' + (row.key ? ' "'+row.key+'"' : '');
  return verb + ' ' + (ALOG_TABLE_LABEL[t] || t) + (row.name ? ' "'+row.name+'"' : row.email ? ' '+row.email : row.pn ? ' '+row.pn : '');
}
function alogChanges(r){

    const f = v.from==null ? '\u2014' : String(v.from), to = v.to==null ? '\u2014' : String(v.to);
    return `<span class="pn">${escapeHtml(k)}</span>: ${escapeHtml(f.slice(0,60))} \u2192 ${escapeHtml(to.slice(0,60))}`;
  }).join('<br>');
}
function alogTarget(r){

  let tid = null, eid = null;

  if(eid && (S.emails||[]).some(x=>x.id===eid)) return `<button class="btn btn-sm" onclick="openEmail('${escapeHtml(eid)}')">Open</button>`;

}
function alogStamp(iso){

  return d.toLocaleString([], { year:'numeric', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });

async function alogLoad(more){
  const A = S.alog; if(A.loading) return; A.loading = true;
  try{
    let q = sb.from('admin_activity_log').select('*').not('action','in','(presence,elsewhere,device_tracking)').order('created_at',{ascending:false}).order('id',{ascending:false}).limit(200);
    const f = A.f;
    if(f.user) q = q.eq('user_email', f.user);
    if(!f.system) q = q.not('user_email','is',null);
    if(f.kind==='signin') q = q.in('action',['sign_in','sign_out']);
    else if(f.kind==='app') q = q.eq('source','app').not('action','in','(sign_in,sign_out)');
    else if(f.kind==='tickets') q = q.in('entity_type',['tickets','ticket_messages']);
    else if(f.kind==='emails') q = q.in('entity_type',['emails','email_messages']);
    else if(f.kind==='admin') q = q.in('entity_type',['support_settings','ticket_templates','team_members','profiles','activity_log_viewers']);
    else if(f.kind==='deletes') q = q.eq('action','delete');
    if(f.from) q = q.gte('created_at', new Date(f.from+'T00:00:00').toISOString());
    if(f.to) q = q.lte('created_at', new Date(f.to+'T23:59:59.999').toISOString());
    if(f.q){ const t = f.q.replace(/[%,()]/g,' ').trim(); if(t) q = q.or(`summary.ilike.%${t}%,entity_id.ilike.%${t}%,user_email.ilike.%${t}%,entity_type.ilike.%${t}%,action.ilike.%${t}%`); }
    if(more && A.rows.length) q = q.lt('created_at', A.rows[A.rows.length-1].created_at);
    const { data, error } = await q;
    if(error) throw error;
    A.rows = more ? A.rows.concat(data||[]) : (data||[]);
    A.done = (data||[]).length < 200;
  }catch(e){
    toast('Could not load the activity log: '+e.message, true);
  }finally{ A.loading = false; }
}
// Period for the staff summary: the page's date filters, or the last 7 days.
function alogPeriod(){
  const f = S.alog.f;
  const to = f.to ? new Date(f.to+'T23:59:59.999') : new Date();
  const from = f.from ? new Date(f.from+'T00:00:00') : new Date(Date.now() - 7*86400000);
  return { from, to, label: (f.from||f.to) ? 'Selected dates' : 'Last 7 days' };
}

/* ---- Daily timeline (v1.93) ----------------------------------------------
   Built by staff_day_timeline() in the database from the activity log:
   actions + "active in the app" marks (one per 5 min while someone is using
   the Support Center in a visible tab). Gaps = stretches inside shift hours
   with no activity longer than the threshold in Monitoring settings. */
function alogLocalDate(d){ const x=d||new Date(); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
async function alogLoadTimeline(){
  const A = S.alog; if(!A.day) A.day = alogLocalDate();
  try{
    const { data, error } = await sb.rpc('staff_day_timeline', { p_day: A.day });
    if(error) throw error;
    A.timeline = data || []; A.timelineError = null;
  }catch(e){ A.timeline = []; A.timelineError = e.message; }
}
async function alogLoadSettings(){
  try{ const { data, error } = await sb.from('staff_monitor_settings').select('*').eq('id',1).maybeSingle(); if(error) throw error; S.alog.settings = data; }
  catch(e){ S.alog.settings = null; }
}
async function alogShiftDay(delta){
  const d = new Date(S.alog.day+'T12:00:00'); d.setDate(d.getDate()+delta);
  S.alog.day = alogLocalDate(d); await alogLoadTimeline(); alogPaint();
}
async function alogSetDay(v){ if(!v) return; S.alog.day = v; await alogLoadTimeline(); alogPaint(); }
function alogT(iso){ return iso ? new Date(iso).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }) : '\u2014'; }
const ALOG_GAP_LABEL = { start:'late start', idle:'idle', end:'nothing since', none:'no activity' };

function alogPaintTimeline(){
  const el = document.getElementById('content'); const A = S.alog;
  const rows = (A.timeline||[]).slice().sort((a,b)=> (b.actions||0)-(a.actions||0));
  const st = A.settings;
  const isToday = A.day === alogLocalDate();
  const dayLabel = new Date(A.day+'T12:00:00').toLocaleDateString([], { weekday:'long', month:'short', day:'numeric', year:'numeric' });
  let body = '';
  if(A.timelineError){
    body = `<div class="tbl-wrap"><div class="empty">Couldn't load the timeline (${escapeHtml(A.timelineError)}). Run staff_monitoring.sql in Supabase if you haven't.</div></div>`;
  } else if(!rows.length){
    body = '<div class="tbl-wrap"><div class="empty">No staff activity on this day.</div></div>';
  } else {
    // one shared time window for every row so the bars line up
    const ms = x => new Date(x).getTime();
    let w0 = Math.min(...rows.map(r=>ms(r.shift_start)), ...rows.filter(r=>r.first_at).map(r=>ms(r.first_at)));
    let w1 = Math.max(...rows.map(r=>ms(r.shift_end)), ...rows.filter(r=>r.last_at).map(r=>ms(r.last_at)));
    w0 = Math.floor(w0/3600000)*3600000; w1 = Math.ceil(w1/3600000)*3600000; if(w1<=w0) w1 = w0+3600000;
    const pct = t => Math.max(0, Math.min(100, (t-w0)/(w1-w0)*100));
    const sh = st && st.shift_start ? st.shift_start.split(':').map(Number) : [8,0];
    const dayStart = ms(rows[0].shift_start) - (sh[0]*60 + (sh[1]||0))*60000;
    const hours = []; for(let t=w0; t<=w1; t+=3600000) hours.push(t);
    const axis = `<div style="position:relative;height:16px;margin:0 0 2px">${hours.map(t=>`<span style="position:absolute;left:${pct(t)}%;transform:translateX(-50%);font-size:var(--t-xs);color:var(--text3)">${new Date(t).toLocaleTimeString([], { hour:'numeric' }).replace(' ','').toLowerCase()}</span>`).join('')}</div>`;
    body = `<div class="tbl-wrap" style="padding:12px 14px">
      <div style="display:grid;grid-template-columns:170px 1fr;gap:10px 14px;align-items:center">
        <div></div><div>${axis}</div>
        ${rows.map(r=>{
          const gaps = r.gaps||[];
          const none = gaps.some(g=>g.kind==='none');
          const bigGap = gaps.some(g=>g.minutes>=60);
          const ticks = (r.slots||[]).map(sl=>{ const t = dayStart + sl*300000; return `<span style="position:absolute;top:3px;bottom:3px;left:${pct(t)}%;width:max(2px,${(300000/(w1-w0)*100).toFixed(3)}%);background:var(--teal);border-radius:1px"></span>`; }).join('');
          const gapBlocks = gaps.map(g=>`<span title="${escapeHtml(alogT(g.from)+' \u2013 '+alogT(g.to)+' '+(ALOG_GAP_LABEL[g.kind]||g.kind)+' ('+fmtMins(g.minutes)+')')}" style="position:absolute;top:0;bottom:0;left:${pct(ms(g.from))}%;width:${(pct(ms(g.to))-pct(ms(g.from))).toFixed(3)}%;background:rgba(220,38,38,.14);border-left:1px solid rgba(220,38,38,.45);border-right:1px solid rgba(220,38,38,.45)"></span>`).join('');
          const shiftBand = `<span style="position:absolute;top:0;bottom:0;left:${pct(ms(r.shift_start))}%;width:${(pct(ms(r.shift_end))-pct(ms(r.shift_start))).toFixed(3)}%;background:var(--bg3)"></span>`;
          const awayTicks = (r.away_slots||[]).map(sl=>{ const t = dayStart + sl*300000; return `<span title="computer in use, not in TGK tools" style="position:absolute;top:8px;bottom:8px;left:${pct(t)}%;width:max(2px,${(300000/(w1-w0)*100).toFixed(3)}%);background:#6366f1;opacity:.85"></span>`; }).join('');
          const TRK = { on:['pill-green','device tracking on'], granted:['pill-green','device tracking on'], prompt:['pill-yellow','tracking not enabled'], denied:['pill-red','tracking blocked'], unsupported:['pill-muted','browser can\'t track'] };
          const trk = r.tracking ? TRK[r.tracking] : ['pill-muted','no device data'];
          const toolNames = { support:'Support', erp:'ERP', command:'Command Center' };
          const nowLine = isToday ? `<span title="now" style="position:absolute;top:-2px;bottom:-2px;left:${pct(Date.now())}%;width:2px;background:var(--orange)"></span>` : '';
          return `
          <div style="min-width:0">
            <div style="font-weight:700;color:var(--text);cursor:pointer" onclick="alogOpenPersonDay('${escapeHtml(r.user_email)}')" title="See everything ${escapeHtml(alogWho(r.user_email))} did this day">${escapeHtml(alogWho(r.user_email))} ${none&&r.is_workday?'<span class="pill pill-red">no activity</span>':(bigGap&&r.is_workday?'<span class="pill pill-orange">gap</span>':'')}</div>
            <div style="font-size:var(--t-xs);color:var(--text3)">${r.first_at?alogT(r.first_at)+' \u2013 '+alogT(r.last_at):'\u2014'} \u00b7 ${fmtMins(r.engaged_minutes)} engaged</div>
            <div style="font-size:var(--t-xs);color:var(--text3)">${r.actions||0} actions \u00b7 ${r.replies||0} replies</div>
            ${(r.tools||[]).length?`<div style="font-size:var(--t-xs);color:var(--text3)">in ${(r.tools||[]).map(x=>toolNames[x]||x).join(', ')}</div>`:''}
            ${r.away_minutes?`<div style="font-size:var(--t-xs);color:#6366f1;font-weight:600">${fmtMins(r.away_minutes)} on computer, not in TGK tools</div>`:''}
            <div style="margin-top:2px"><span class="pill ${trk[0]}" style="font-size:10px">${trk[1]}</span></div>
          </div>
          <div>
            <div style="position:relative;height:26px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden">${shiftBand}${gapBlocks}${ticks}${awayTicks}${nowLine}</div>
            ${r.is_workday && gaps.length ? `<div style="font-size:var(--t-xs);margin-top:3px;color:var(--text2)">${gaps.map(g=>`<span style="margin-right:12px;color:${g.minutes>=60?'var(--red)':'var(--orange)'}">${alogT(g.from)}\u2013${alogT(g.to)} ${ALOG_GAP_LABEL[g.kind]||g.kind} (${fmtMins(g.minutes)})</span>`).join('')}</div>` : (r.is_workday ? '' : '<div style="font-size:var(--t-xs);margin-top:3px;color:var(--text3)">Not a scheduled workday \u2014 no gaps flagged</div>')}
          </div>`;}).join('')}
      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:var(--t-xs);color:var(--text3);margin-top:12px;border-top:1px solid var(--border);padding-top:8px">
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--teal);vertical-align:-1px"></span> activity (5-min slots)</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--bg3);border:1px solid var(--border);vertical-align:-1px"></span> shift hours</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#6366f1;vertical-align:-1px"></span> computer in use, not in TGK tools</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:rgba(220,38,38,.14);border:1px solid rgba(220,38,38,.45);vertical-align:-1px"></span> gap over ${st?st.gap_minutes:30} min in shift</span>
        ${isToday?'<span><span style="display:inline-block;width:2px;height:10px;background:var(--orange);vertical-align:-1px"></span> now</span>':''}
      </div>
    </div>`;
  }
  el.innerHTML = `
    ${alogTabs()}
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <button class="btn btn-sm" onclick="alogShiftDay(-1)">\u2039 Prev</button>
      <input class="form-input" style="width:auto" type="date" value="${escapeHtml(A.day)}" onchange="alogSetDay(this.value)">
      <button class="btn btn-sm" onclick="alogShiftDay(1)" ${isToday?'disabled':''}>Next \u203a</button>
      ${isToday?'':'<button class="btn btn-sm" onclick="alogSetDay(alogLocalDate())">Today</button>'}
      <button class="btn btn-sm" onclick="alogLoadTimeline().then(alogPaint)"><span class="ic ic-refresh"></span>Refresh</button>
      <span style="font-weight:700;color:var(--text);margin-left:6px">${escapeHtml(dayLabel)}</span>
      ${st?`<span style="font-size:var(--t-xs);color:var(--text3)">Shift ${escapeHtml(String(st.shift_start).slice(0,5))}\u2013${escapeHtml(String(st.shift_end).slice(0,5))} \u00b7 ${escapeHtml(st.tz)}</span>`:''}
    </div>
    ${body}
    <p style="font-size:var(--t-xs);color:var(--text3);margin-top:10px">Activity = anything done in the Support Center or ERP, plus an "active" mark every 5 minutes while someone is using one of them in a visible tab. Purple = the computer was in use (keyboard/mouse, screen unlocked) but not in a TGK tool; it requires device tracking, which each person enables once in the Command Center (Chrome/Edge) and never reveals which program or site. Work outside the Support Center (phone calls, shipping, meetings) won't show, so treat a gap as a question to ask, not proof.</p>`;
}

/* ============================================================
   TGK ACTIVITY MARKS -- shared by the Support Center, ERP and Command Center
   (identical code in each; only APP / user() / rpc() differ).

   'presence'  -- this tool is visible AND was used (mouse/keys/scroll) in the
                  last 5 min. One mark per 5 min. Says which tool, nothing else.
   'elsewhere' -- TOP-LEVEL PAGE ONLY (the Command Center when tools are opened
                  inside it): the computer is in use (any program) and the screen
                  is unlocked, but this window isn't focused. Uses the browser's
                  Idle Detection permission (Chrome/Edge), which reports only
                  active/idle and locked/unlocked -- never which program or site.
   'device_tracking' -- once per tab session: granted | prompt | denied | unsupported,
                  so the timeline can show who hasn't enabled detection.
   Nothing here records content, keystrokes, screenshots, URLs or app names.
   ============================================================ */
(function(){
  if(window.__tgkActivity) return; window.__tgkActivity = true;
  var APP = 'support';
  function user(){ try{ return S.user; }catch(_){ return null; } }
  function rpc(n, a){ try{ return sb.rpc(n, a); }catch(_){ return null; } }
  function mark(action, details){
    try{ var p = rpc('log_activity', { p_action: action, p_entity_type: APP, p_entity_id: null, p_summary: null, p_details: details || null });
         if(p && p.then) p.then(function(){}, function(){}); }catch(_){}
  }
  var FIVE_MIN = 300000, lastInput = 0;
  ['mousemove','mousedown','keydown','wheel','scroll','touchstart'].forEach(function(ev){
    window.addEventListener(ev, function(){ lastInput = Date.now(); }, { passive: true, capture: true });
  });
  var isTop = (function(){ try{ return window.top === window; }catch(_){ return false; } })();
  var detector = null, reportedState = null;

  setInterval(function(){
    if(!user()) return;
    if(document.visibilityState === 'visible' && Date.now() - lastInput <= FIVE_MIN){ mark('presence'); return; }
    // read the detector live (not a cached copy) so idle/locked can never be mistaken for in-use
    if(isTop && detector && detector.userState === 'active' && detector.screenState === 'unlocked'
       && !(document.visibilityState === 'visible' && document.hasFocus())) mark('elsewhere');
  }, FIVE_MIN);

  function supported(){ return isTop && ('IdleDetector' in window); }
  function report(state){
    if(!user() || reportedState === state) return;
    try{ var k = 'tgk_devtrk_' + APP; if(sessionStorage.getItem(k) === state){ reportedState = state; return; } sessionStorage.setItem(k, state); }catch(_){}
    reportedState = state; mark('device_tracking', { state: state });
  }
  async function permState(){
    if(!supported()) return 'unsupported';
    try{ return (await navigator.permissions.query({ name: 'idle-detection' })).state; }catch(_){ return 'prompt'; }
  }
  async function startDetector(){
    if(detector) return true;
    try{
      detector = new IdleDetector();
      await detector.start({ threshold: 60000 });
      return true;
    }catch(_){ detector = null; return false; }
  }
  function banner(state){
    var el = document.getElementById('tgk-devtrk-banner');
    if(state === 'granted' || state === 'unsupported' || !user()){ if(el) el.remove(); return; }
    if(!el){
      el = document.createElement('div'); el.id = 'tgk-devtrk-banner';
      el.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:99999;max-width:340px;background:#111827;color:#fff;border-left:3px solid #0d9488;border-radius:6px;padding:12px 14px;font:13px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25)';
      document.body.appendChild(el);
    }
    if(state === 'denied'){
      el.innerHTML = '<strong>Activity detection is blocked.</strong><div style="margin-top:4px;color:#cbd5e1">It\'s required on company computers. Click the lock icon in the address bar, set "Idle detection" to Allow, then reload.</div>';
    } else {
      el.innerHTML = '<strong>Turn on activity detection</strong><div style="margin:4px 0 8px;color:#cbd5e1">Required on company computers. It only tells TGK tools whether this computer is in use or idle/locked -- never which programs, sites or content.</div><button id="tgk-devtrk-btn" style="background:#0d9488;color:#fff;border:0;border-radius:4px;padding:6px 12px;font-weight:600;cursor:pointer">Allow</button>';
      document.getElementById('tgk-devtrk-btn').onclick = async function(){
        var r = 'denied';
        try{ r = await IdleDetector.requestPermission(); }catch(_){}
        if(r === 'granted') await startDetector();
        report(r === 'granted' ? 'granted' : 'denied'); banner(r === 'granted' ? 'granted' : 'denied');
      };
    }
  }
  async function check(){
    if(!user() || !isTop) return;
    var s = await permState();
    if(s === 'granted') await startDetector();
    report(s); banner(s);
  }
  // re-check after sign-in and periodically (cheap; no prompt is ever shown without a click)
  setTimeout(check, 4000); setInterval(check, 60000);
})();

async function alogRefresh(){ await Promise.all([alogLoad(false), alogLoadSummary()]); alogPaint(); }
async function alogMore(){ await alogLoad(true); alogPaint(); }
async function alogSetViewer(uid, allow, cb){
  try{
    const { error } = await sb.rpc('set_activity_log_viewer', { p_user: uid, p_allow: !!allow });
    if(error) throw error;
    await alogLoadStaff(); toast(allow ? 'Access granted' : 'Access removed'); alogPaint();
  }catch(e){ if(cb) cb.checked = !allow; toast('Could not change access: '+e.message, true); }
}
function alogExport(){
  const rows = S.alog.rows||[]; if(!rows.length){ toast('Nothing to export', true); return; }
  const esc = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const strip = h => String(h||'').replace(/<br>/g,'; ').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  const lines = [['Timestamp (UTC)','User','Source','Action','Details','Record type','Record id'].map(esc).join(',')]
    .concat(rows.map(r=>[r.created_at, r.user_email||'System', r.source, alogDescribe(r), strip(alogChanges(r)), r.entity_type, r.entity_id].map(esc).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type:'text/csv' }));
  a.download = 'activity-log-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  logApp('export:activity_log', null, null, 'Exported '+rows.length+' activity log entries to CSV');
}
window.alogRefresh = alogRefresh; window.alogMore = alogMore; window.alogSetViewer = alogSetViewer; window.alogExport = alogExport; window.alogPaint = alogPaint;

// ---- Saved filter views (per-user, stored locally) ----
function savedViewsKey(){ return 'tgk_saved_views_' + ((S.user&&S.user.email)||'anon'); }
function getSavedViews(){ try{ return JSON.parse(localStorage.getItem(savedViewsKey())||'[]'); }catch(_){ return []; } }
function setSavedViews(v){ try{ localStorage.setItem(savedViewsKey(), JSON.stringify(v)); }catch(_){} }
function savedViewsOptions(){
  const v=getSavedViews();
  if(!v.length) return '';
  return '<optgroup label="My views">'+v.map((x,i)=>'<option value="v:'+i+'">'+escapeHtml(x.name)+'</option>').join('')+'</optgroup>';
}
function handleSavedView(val){
  if(!val) return;
  if(val==='__save__'){
    const name = prompt('Name this view (saves the current filters):');
    if(!name) return;
    const v=getSavedViews(); v.push({ name:name.trim(), filters:{...S.filters} }); setSavedViews(v);
    toast('View saved'); renderTicketsList(); return;
  }
  const m = val.match(/^v:(\d+)$/); if(!m) return;
  const v=getSavedViews(); const view=v[parseInt(m[1],10)]; if(!view) return;
  // Confirm delete with modifier: shift-click isn't available on select; offer via prompt on re-pick.
  S.filters = { status:'__active__', priority:'', source:'', category:'', tag:'', assignedTo:'', staleOnly:false, showArchived:false, q:'', ...view.filters };
  renderTicketsList();
  toast('Applied: '+view.name);
}
window.handleSavedView = handleSavedView;
function deleteSavedView(i){ const v=getSavedViews(); v.splice(i,1); setSavedViews(v); renderTicketsList(); }

async function bulkUpdateField(field, value){
  const ids = Array.from(S.selectedTickets);
  if(!ids.length) return;
  try{
    const patch = { [field]: value, updated_at: new Date().toISOString() };
    if(field==='status' && (value==='resolved'||value==='closed')) patch.resolved_at = new Date().toISOString();
    const { data, error } = await sb.from('tickets').update(patch).in('id', ids).select();
    if(error) throw error;
    (data||[]).forEach(updated=>{
      const idx = S.tickets.findIndex(x=>x.id===updated.id);
      if(idx!==-1) S.tickets[idx] = updated;
    });
    // Log activity per ticket (best-effort, doesn't block on failure)
    ids.forEach(id=> logActivity(id, field, null, value));
    toast(`Updated ${ids.length} ticket${ids.length===1?'':'s'}`);
    renderNav();
    renderTicketsList();
  }catch(e){
    toast('Bulk update failed: ' + e.message, true);
  }
}

function csvEscape(val){
  if(val==null) return '';
  const s = String(val);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function exportTicketsToCSV(){
  const list = filteredTickets();
  if(!list.length){ toast('Nothing to export with the current filters', true); return; }
  logApp('export:tickets', null, null, 'Exported '+list.length+' tickets to CSV');

  const headers = [
    'Ticket #','Subject','Status','Priority','Source','Tags',
    'Customer Name','Customer Email','Customer Phone',
    'Order Number','Part Number','Assigned To',
    'Created At','Updated At','Resolved At','Archived',
    'Refund Amount','Restocking Fee','Refund Status','Shopify Refund ID',
    'Return Tracking Number','Return Carrier'
  ];

  const rows = list.map(t => [
    t.ticket_number,
    t.subject,
    label(t.status),
    label(t.priority),
    label(t.source),
    (t.tags||[]).join('; '),
    t.customer_name,
    t.customer_email,
    t.customer_phone,
    t.order_number,
    t.pn,
    t.assigned_to,
    t.created_at,
    t.updated_at,
    t.resolved_at,
    t.archived ? 'Yes' : 'No',
    t.refund_amount,
    t.restocking_fee,
    t.refund_status,
    t.shopify_refund_id,
    t.return_tracking_number,
    t.return_carrier
  ]);

  const csv = [headers, ...rows].map(row => row.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tgk-tickets-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);

}

/* ===== Ticket categories + reply templates =====
   Categories, tag presets and the stale threshold are stored in the Supabase
   table public.support_settings (key text PK, value jsonb). They are exposed
   here as live window getters so every existing call site picks up edits with
   no code change. If the table is missing or empty the built-in defaults below
   are used, so the app can never end up with an empty category list. */

var TK_CATEGORY_DEFAULTS = [
  { name:'Inquiry',          color:'pill-muted'  },
  { name:'Return',           color:'pill-orange' },
  { name:'Warranty',         color:'pill-red'    },
  { name:'Shipment Error',   color:'pill-yellow' },
  { name:'Wholesale/Dealer', color:'pill-teal'   },
  { name:'Other',            color:'pill-muted'  }
];
var TAG_PRESET_DEFAULTS = ['Shipping','Warranty/Defect','Billing','Return/Refund','Part Compatibility','General Question','Other'];
var STALE_HOURS_DEFAULT = 24;
var PILL_COLORS = [
  { v:'pill-muted',  label:'Grey'   },
  { v:'pill-teal',   label:'Teal'   },
  { v:'pill-orange', label:'Orange' },
  { v:'pill-red',    label:'Red'    },

];

function tkCategoryListBase(){
  var v = S.settings && S.settings.ticket_categories;
  if(Array.isArray(v) && v.length){
    return v.filter(function(c){ return c && c.name; })
            .map(function(c){ return { name:String(c.name), color:c.color||'pill-muted' }; });
  }
  return TK_CATEGORY_DEFAULTS;
}
function tkCategoryList(){
  var base = tkCategoryListBase();
  if(!base.some(function(c){ return c.name === 'Rebate'; })) base = base.concat([{ name:'Rebate', color:'pill-teal' }]);
  return base;
}
function tkCategoryColor(name){
  if(!name) return 'pill-muted';
  var row = tkCategoryList().filter(function(c){ return c.name === name; })[0];
  return (row && row.color) ? row.color : 'pill-muted';
}
function categoryTicketCount(name){
  return S.tickets.filter(function(t){ return (t.category||'') === name; }).length;
}
Object.defineProperty(window, 'TK_CATEGORY_OPTIONS', {
  configurable: true,
  get: function(){ return tkCategoryList().map(function(c){ return c.name; }); }
});
Object.defineProperty(window, 'TICKET_CATEGORIES', {
  configurable: true,
  get: function(){
    var v = S.settings && S.settings.tag_presets;
    return (Array.isArray(v) && v.length) ? v.map(String) : TAG_PRESET_DEFAULTS;
  }
});
Object.defineProperty(window, 'STALE_THRESHOLD_HOURS', {
  configurable: true,
  get: function(){
    var n = Number(S.settings && S.settings.stale_hours);
    return (isFinite(n) && n > 0) ? n : STALE_HOURS_DEFAULT;
  }
});

// Pull every settings row into S.settings. A missing table is not fatal: the
// app falls back to defaults and the Settings page shows the setup SQL.
async function loadSettings(){
  try{
    var r = await sb.from('support_settings').select('key,value');
    if(r.error) throw r.error;
    var out = {};
    (r.data||[]).forEach(function(row){ out[row.key] = row.value; });
    S.settings = out;
    S.settingsTable = 'ok';
  }catch(e){
    S.settings = {};
    S.settingsTable = 'missing';
    console.warn('support_settings unavailable - using built-in defaults:', e.message);
  }
}

async function saveSetting(key, value){
  if(S.settingsTable === 'missing'){
    toast('Cannot save: the support_settings table does not exist yet (see the SQL Setup tab)', true);
    return false;
  }
  try{
    var r = await sb.from('support_settings')
      .upsert({ key:key, value:value, updated_at:new Date().toISOString(), updated_by:(S.user&&S.user.email)||null }, { onConflict:'key' })
      .select().single();
    if(r.error) throw r.error;
    S.settings[key] = r.data.value;
    return true;
  }catch(e){
    toast('Save failed: ' + e.message, true);
    return false;
  }
}

// Fallback category (for defaulting the template picker) when a ticket has no explicit category yet
function ticketCategory(t){
  if(!t) return 'Inquiry';
  if(t.category) return t.category;

  return m[t.source] || 'Inquiry';
}

// Options for the composer template picker: current-category templates first, then the rest
function templatePickerOptions(t){
  var cat = ticketCategory(t);
  var all = (S.templates||[]);
  if(!all.length) return '<option value="">No templates yet - click Edit</option>';
  var inCat = all.filter(function(x){ return (x.category||'')===cat; });
  var others = all.filter(function(x){ return (x.category||'')!==cat; });
  function opt(x){ return '<option value="'+x.id+'">'+escapeHtml(x.title)+'</option>'; }
  var html = '<option value="">Insert template...</option>';
  if(inCat.length) html += '<optgroup label="'+escapeHtml(cat)+'">'+inCat.map(opt).join('')+'</optgroup>';
  if(others.length) html += '<optgroup label="Other templates">'+others.map(opt).join('')+'</optgroup>';

}

// Replace {{tokens}} with live ticket data where available; unknown tokens are left untouched
function fillTemplateTokens(body, t){
  var agent = (S.user && S.user.email) ? (friendlyStaffName()||S.user.email) : '';
  var wc = (t && t.warranty_claim_id) ? (S.warranty.find(function(w){return w.id===t.warranty_claim_id;})||{}) : {};
  var se = (t && t.shipment_error_id) ? (S.shipErrors.find(function(e){return e.id===t.shipment_error_id;})||{}) : {};
  var map = {
    order_number: (t && t.order_number) ? t.order_number : '',
    customer_name: (t && t.customer_name) ? t.customer_name : '',
    first_name: (t && t.customer_name) ? String(t.customer_name).trim().split(/\s+/)[0] : '',
    customer_email: (t && t.customer_email) ? t.customer_email : '',
    pn: (t && t.pn) || wc.pn || se.pn || '',
    tracking: (t && t.tracking_number) || wc.tracking_number || se.tracking_number || '',
    ticket_number: (t && t.ticket_number!=null) ? ('#'+t.ticket_number) : '',
    agent: agent
  };
  return String(body||'').replace(/\{\{\s*([a-z_]+)\s*\}\}/gi, function(m0, key){
    var k = key.toLowerCase();
    return (k in map) ? map[k] : m0;
  });
}

function filteredTickets(){
  let list = S.tickets.slice();
  const f = S.filters;
  // A ticket merged into another is intentionally hidden from every queue --
  // it lives on only for reference via its merged_into_id pointer. Without this
  // guard the source ticket reappears the moment the status filter is anything
  // other than "Active" (All Statuses, a category, a search), which reads as
  // "the merge didn't work" even though it did.
  list = list.filter(t=>!t.merged_into_id);
  if(!f.showArchived) list = list.filter(t=>!t.archived);
  // The default status view only ever shows active work - correct on its own, but it was
  // ALSO silently applying on top of "Show Archived", meaning that checkbox alone was never
  // enough to actually see an archived ticket that also happened to be closed (which every
  // archived live chat now is, since archiving properly ends it first). Checking a box
  // labeled "Show Archived" should be enough on its own - it shouldn't also require someone
  // to separately notice and change an unrelated status filter to actually see the result.
  if(f.status === '__active__' && !f.showArchived) list = list.filter(t=>!['resolved','closed'].includes(t.status));
  else if(f.status && f.status !== '__active__') list = list.filter(t=>t.status===f.status);
  if(f.priority) list = list.filter(t=>t.priority===f.priority);
  if(f.source) list = list.filter(t=>t.source===f.source);
  if(f.category === '__none__') list = list.filter(t=>!t.category);
  else if(f.category) list = list.filter(t=>(t.category||'')===f.category);
  if(f.tag) list = list.filter(t=>(t.tags||[]).includes(f.tag));
  if(f.assignedTo === '__unassigned__') list = list.filter(t=>!t.assigned_to);
  else if(f.assignedTo) list = list.filter(t=>t.assigned_to===f.assignedTo);
  if(f.staleOnly) list = list.filter(isStale);
  if(f.q){
    const q = f.q.toLowerCase();
    list = list.filter(t=>
      (t.subject||'').toLowerCase().includes(q) ||
      (t.customer_name||'').toLowerCase().includes(q) ||
      (t.customer_email||'').toLowerCase().includes(q) ||
      (t.order_number||'').toLowerCase().includes(q) ||
      (t.pn||'').toLowerCase().includes(q)
    );
  }
  return list;
}

function label(s){ return (s||'').replace(/_/g,' ').replace(/\b\w/g, c=>c.toUpperCase()); }

const CLAIM_DONE_STATUSES = ['Resolved','Closed','Denied'];
function isActiveClaim(status){ return !CLAIM_DONE_STATUSES.includes(status); }

/* STALE_THRESHOLD_HOURS is now a live getter defined with the settings block above. */
function isStale(t){
  if(!['open','pending'].includes(t.status)) return false;
  return (Date.now() - new Date(t.updated_at).getTime()) > STALE_THRESHOLD_HOURS * 3600000;
}

  return `<div class="tk-card" onclick="openTicket('${t.id}')">
    <div class="tk-card-top">
      ${enableBulk?`<input type="checkbox" class="tk-card-chk" ${S.selectedTickets.has(t.id)?'checked':''} onclick="event.stopPropagation()" onchange="toggleTicketSelect('${t.id}', this.checked)">`:''}

function friendlyStaffName(){

  if(!S.user || !S.user.email) return '';
  return S.user.email.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
}

function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Escapes text (XSS-safe), turns URLs into clickable links, then newlines into <br>.
// Handles bare URLs and the plain-text email convention of wrapping them in
// angle brackets, e.g. <http://example.com/very/long/link>.
function linkifyBody(s){
  let esc = escapeHtml(s==null?'':s);
  // Older messages were stored as tag-stripped text, which can leave raw CSS
  // rules (e.g. ".main-style { font-family: ... }") dumped inline. Strip those.
  esc = esc.replace(/(@media[^{]*\{[\s\S]*?\}\s*\})/g, '');
  esc = esc.replace(/[.#]?[\w-]+\s*\{[^{}]*\}/g, '');
  // Unwrap angle-bracketed URLs: &lt;http...&gt; -> http... (escaped form).
  esc = esc.replace(/&lt;(https?:\/\/[^\s]+?)&gt;/gi, '$1');
  const linked = esc.replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/g, (m)=>{
    let url = m, trail='';
    const tm = url.match(/(&gt;|&lt;|[.,;:!?)\]>]+)$/);
    if(tm){ trail = tm[0]; url = url.slice(0, -trail.length); }
    if(!url) return m;
    const href = url.startsWith('www.') ? ('http://'+url) : url;
    return '<a href="'+href+'" target="_blank" rel="noopener noreferrer" style="color:var(--teal);text-decoration:underline;word-break:break-all">'+url+'</a>'+trail;
  });
  return linked.replace(/\n/g,'<br>');
}
function timeAgo(dstr){
  if(!dstr) return '—';
  const diff = Date.now() - new Date(dstr).getTime();
  const mins = Math.floor(diff/60000);
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs/24) + 'd ago';
}

async function convertToTicket(kind, recordId){
  const record = kind==='warranty' ? S.warranty.find(w=>w.id===recordId) : S.shipErrors.find(e=>e.id===recordId);
  if(!record){ toast('Record not found', true); return; }
  const recordPn = kind==='warranty' ? record.pn : record.expected_pn;
  const subject = kind==='warranty'
    ? `Warranty claim — order #${record.order_number||'?'} / ${recordPn||'?'}`
    : `Shipment error — order #${record.order_number||'?'} / ${recordPn||'?'}`;
  const payload = {
    source: kind==='warranty' ? 'warranty' : 'shipment_error',
    status: 'open',
    priority: 'medium',
    subject,
    order_number: record.order_number || null,
    pn: recordPn || null,
    warranty_claim_id: kind==='warranty' ? record.id : null,
    shipment_error_id: kind==='shipment_error' ? record.id : null,
  };
  try{
    const { data, error } = await sb.from('tickets').insert(payload).select().single();
    if(error) throw error;
    S.tickets.unshift(data);
    toast('Ticket #' + data.ticket_number + ' created');
    goPage('tickets');
    openTicket(data.id);
  }catch(e){
    toast('Failed to create ticket: ' + e.message, true);
  }
}

/* Item type sent to the ERP per warranty line. "Finished Good" was added so Support can send the
   warehouse ANY saleable item, not just tracked parts/assemblies. This 'type' string is the contract
   the ERP's ship logic reads to decide where to deduct inventory -- keep the values in sync with it. */
const CLAIM_ITEM_TYPE_OPTIONS = [
  { value:'part', label:'Part' },
  { value:'assembly', label:'Assembly' },
  { value:'finished_good', label:'Finished Good' }
];

// Classify a SKU via assemblies + parts (canonical pn OR new_sku). Anything that is neither a tracked
// part nor assembly is treated as a finished good so it can still be shipped. Supabase queries resolve
// with {data,error} (no throw), so a table without a new_sku column just yields an ignorable error.
async function resolveClaimItemType(pn){
  pn = (pn||'').trim();
  if(!pn) return 'part';
  const inTable = async (table) => {
    try{
      const [byPn, byNew] = await Promise.all([
        sb.from(table).select('pn').eq('pn', pn).limit(1),
        sb.from(table).select('pn').eq('new_sku', pn).limit(1)
      ]);
      return !!((byPn.data && byPn.data.length) || (byNew.data && byNew.data.length));
    }catch(e){ return false; }
  };
  if(await inTable('assemblies')) return 'assembly';
  if(await inTable('parts')) return 'part';
  return 'finished_good';
}
window.resolveClaimItemType = resolveClaimItemType;

/* When a linked warranty claim / shipment error is DELETED in the ERP, purge it from our cache so the
   ticket stops showing "Sent to ERP" and the send buttons reappear -- letting staff resend a correction. */
function handleErpClaimDelete(kind, oldRow){
  if(!oldRow || oldRow.id==null) return;
  if(kind==='warranty'){ S.warranty = S.warranty.filter(w=>w.id!==oldRow.id); }
  else { S.shipErrors = S.shipErrors.filter(e=>e.id!==oldRow.id); }
  if(['warranty','shiperrors','tickets','dashboard'].includes(S.page)) renderPage();
  if(S.activeTicket && ((kind==='warranty' && S.activeTicket.warranty_claim_id===oldRow.id) || (kind==='shipment_error' && S.activeTicket.shipment_error_id===oldRow.id))){
    openTicket(S.activeTicket.id);
    toast('Linked ERP record was deleted \u2014 you can resend a correction');
  }
}

/* Manual resend: unlink the ticket from its ERP record and reopen the send form so a corrected
   warranty claim / shipment error can be created fresh. Warns if the old record still exists. */
async function resendToERP(ticketId, kind){
  const t = S.tickets.find(x=>x.id===ticketId);
  if(!t){ toast('Ticket not found', true); return; }
  const table = kind==='warranty' ? 'warranty_claims' : 'shipment_errors';
  const linkedId = kind==='warranty' ? t.warranty_claim_id : t.shipment_error_id;
  let existing=null;
  if(linkedId){ try{ const { data } = await sb.from(table).select('*').eq('id',linkedId).maybeSingle(); existing=data; }catch(e){} }
  if(existing){
    const shipped = existing.tracking_number || existing.return_tracking || existing.return_tracking_number;
    const msg = shipped
      ? 'Heads up: the existing ERP record was already SHIPPED (tracking '+(existing.tracking_number||existing.return_tracking||existing.return_tracking_number)+').\n\nResending creates a brand-new record and a duplicate shipment request. Continue only if the warehouse truly needs to ship again.\n\nResend anyway?'
      : 'The existing ERP record is still there.\n\nDelete it in the ERP first to avoid a duplicate in the warehouse queue, then resend.\n\nResend anyway? (this unlinks the ticket from that record)';
    if(!confirm(msg)) return;
  }
  // purge stale cache + unlink the ticket so the corrected send starts clean
  if(kind==='warranty'){ S.warranty = S.warranty.filter(w=>w.id!==linkedId); }
  else { S.shipErrors = S.shipErrors.filter(e=>e.id!==linkedId); }
  const patch = kind==='warranty' ? { warranty_claim_id:null } : { shipment_error_id:null };
  try{ await sb.from('tickets').update({ ...patch, updated_at:new Date().toISOString() }).eq('id',ticketId); }catch(e){ toast('Could not unlink ticket: '+(e.message||''), true); return; }
  const idx = S.tickets.findIndex(x=>x.id===ticketId);
  const merged = { ...t, ...patch };
  if(idx!==-1) S.tickets[idx]=merged;
  S.activeTicket = merged;
  toast('Ticket unlinked \u2014 send the corrected details');
  openSendToERPModal(ticketId, kind);
}

async function confirmSendToERP(ticketId, kind){
  const table = kind==='warranty' ? 'warranty_claims' : 'shipment_errors';
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

  let payload;
  if(kind==='warranty'){
    const t = S.tickets.find(x=>x.id===ticketId);
    const validItems = warrantyClaimItems.filter(i=>i.pn && i.pn.trim());
    const primaryPn = validItems.length ? validItems[0].pn.trim() : '';
    // Each line carries its own type (part / assembly / finished_good) chosen in the form -- auto-detected
    // from parts/assemblies and overridable by staff. Finished goods are included so Support can send the
    // warehouse anything a customer needs. This is exactly what the ERP's ship logic reads.
    const __resTypeSel = val('erpResolutionType');
    const __resType = __resTypeSel === 'other' ? val('erpResolutionTypeOther') : __resTypeSel;
    payload = {
      order_number: val('erpOrder'),
      pn: primaryPn,
      claim_items: validItems.length ? validItems.map(i=>({ pn: i.pn.trim(), type: i.type || 'part', qty: i.qty||1, description: i.description||'' })) : null,
      customer_name: val('erpCustomer') || null,
      issue: val('erpIssue') || null,
      status: val('erpStatus'),
      resolution_type: __resType || null,
      resolution: val('erpResolution') || null,
      claim_cost: val('erpClaimCost') ? parseFloat(val('erpClaimCost')) : null,
      tracking_number: val('erpTracking') || null,
      carrier: val('erpCarrier') || null,
      shipping_details: (t && t.shipping_address && Object.values(t.shipping_address).some(v=>v)) ? t.shipping_address : null
    };
    if(!payload.order_number || !payload.pn){ toast('Order number and at least one part number are required', true); return; }
    if(!__resType){ toast(__resTypeSel === 'other' ? 'Please describe the resolution type' : 'Resolution type is required', true); return; }
  } else {
    const t = S.tickets.find(x=>x.id===ticketId);
    const __resSel = val('erpResolution');
    const __resVal = __resSel.toLowerCase() === 'other' ? val('erpResolutionOther') : __resSel;
    // The exact parts and quantities needed to correct this - decided here, not in the ERP.
    // expected_pn/expected_qty stay populated from the FIRST line for every existing dashboard,
    // export and list view that reads those two columns directly; line_items carries the full
    // list, which is what the ERP's ship flow and inventory deduction actually use.
    const validShipItems = shipErrorItems.filter(i=>i.pn && i.pn.trim());
    const primaryItem = validShipItems[0] || null;
    payload = {
      order_number: val('erpOrder'),
      customer_name: val('erpCustomer') || null,
      customer_email: val('erpCustomerEmail') || null,
      error_type: val('erpErrorType'),
      expected_pn: primaryItem ? primaryItem.pn.trim() : null,
      expected_qty: primaryItem ? (primaryItem.qty||1) : null,
      line_items: validShipItems.length ? validShipItems.map(i=>({ pn: i.pn.trim(), qty: i.qty||1, description: i.description||'' })) : null,
      actual_pn: val('erpActualPn') || null,
      resolution: __resVal || null,
      notes: val('erpNotes') || null,
      status: val('erpStatus'),
      tracking_number: val('erpTracking') || null,
      carrier: val('erpCarrier') || null,
      claim_cost: val('erpClaimCost') ? parseFloat(val('erpClaimCost')) : null,
      shipping_details: (t && t.shipping_address && Object.values(t.shipping_address).some(v=>v)) ? t.shipping_address : null
    };
    const actQty = val('erpActualQty');
    if(actQty) payload.actual_qty = parseInt(actQty, 10);
    if(!payload.order_number || !primaryItem){ toast('Order number and at least one part number are required', true); return; }
    if(!__resVal){ toast(__resSel.toLowerCase() === 'other' ? 'Please describe the resolution' : 'Resolution type is required', true); return; }
  }

  try{
    const { data, error } = await sb.from(table).insert(payload).select().single();
    if(error) throw error;
    if(kind==='warranty'){ S.warranty.unshift(data); } else { S.shipErrors.unshift(data); }

    const linkPatch = kind==='warranty'
      ? { warranty_claim_id: data.id, updated_at: new Date().toISOString() }
      : { shipment_error_id: data.id, updated_at: new Date().toISOString() };
    const { data: updated, error: updErr } = await sb.from('tickets').update(linkPatch).eq('id', ticketId).select().single();
    if(updErr) throw updErr;
    const idx = S.tickets.findIndex(x=>x.id===ticketId);
    if(idx!==-1) S.tickets[idx] = updated;
    S.activeTicket = updated;

    const kindLabelLower = kind==='warranty' ? 'warranty claim' : 'shipment error';
    await sb.from('ticket_messages').insert({
      ticket_id: ticketId,
      sender_type: 'system',
      sender_name: 'System',
      body: `Sent to ERP as a ${kindLabelLower} by ${S.user.email} — the warehouse team will see this in their queue.`,
      is_internal_note: true
    });
    await loadMessages(ticketId);

    closeModal();
    toast((kind==='warranty'?'Warranty claim':'Shipment error') + ' created in the ERP — warehouse will see it in their queue');
    renderNav();
    renderTicketPanel(updated);
  }catch(e){
    toast('Failed to send to ERP: ' + e.message, true);
  }
}
window.confirmSendToERP = confirmSendToERP;

// ---- Date-range resolution for Reports ----
// Returns { start: Date|null, end: Date, days: number|null, label: string }
function reportRangeBounds(){
  const f = S.reportFilters;
  const end = new Date();
  if(f.range === 'custom'){
    const start = f.start ? new Date(f.start+'T00:00:00') : null;
    const endD = f.end ? new Date(f.end+'T23:59:59.999') : end;
    let days = null;
    if(start) days = Math.max(1, Math.round((endD-start)/86400000));
    return { start, end: endD, days, label: 'Custom range' };
  }
  if(f.range === 'all') return { start: null, end, days: null, label: 'All time' };
  const days = parseInt(f.range, 10) || 30;
  const start = new Date(end.getTime() - days*86400000);
  return { start, end, days, label: 'Last '+days+' days' };
}

function reportInRange(dateStr, bounds){
  if(!dateStr) return false;
  const d = new Date(dateStr);
  if(bounds.start && d < bounds.start) return false;
  if(d > bounds.end) return false;
  return true;
}

// Whether the current range reaches further back than the app's default load
// window (RECENT_WINDOW_DAYS), meaning some matching rows may not be in memory
// yet unless "Load full history" has been run for that table.
function reportNeedsFullHistory(bounds){
  if(!bounds.start) return true; // "All time"
  return (Date.now() - bounds.start.getTime()) > RECENT_WINDOW_DAYS*86400000;
}

function reportFilteredTickets(bounds){
  const f = S.reportFilters;
  return S.tickets.filter(t=>{
    if(!reportInRange(t.created_at, bounds)) return false;
    if(f.status && (t.status||'') !== f.status) return false;
    if(f.priority && (t.priority||'') !== f.priority) return false;
    if(f.source && (t.source||'') !== f.source) return false;
    if(f.category){
      if(f.category==='__none__'){ if(t.category) return false; }
      else if((t.category||'') !== f.category) return false;
    }
    if(f.tag && !(t.tags||[]).includes(f.tag)) return false;
    if(f.assignedTo){
      if(f.assignedTo==='__unassigned__'){ if(t.assigned_to) return false; }
      else if((t.assigned_to||'') !== f.assignedTo) return false;
    }
    return true;
  });
}

function reportFilteredOrders(bounds){
  const f = S.reportFilters;
  return (S.emails||[]).filter(e=>{
    if(e.mailbox !== 'orders') return false;
    if(!reportInRange(e.created_at, bounds)) return false;
    if(f.dealer && String(e.dealer_id||'') !== f.dealer) return false;
    return true;
  });
}

function reportFilteredSupportEmails(bounds){
  return (S.emails||[]).filter(e=> e.mailbox !== 'orders' && reportInRange(e.created_at, bounds));
}

function reportFilteredWarranty(bounds){
  return (S.warranty||[]).filter(w=> reportInRange(w.created_at, bounds));
}

function reportFilteredShipErrors(bounds){
  return (S.shipErrors||[]).filter(e=> reportInRange(e.created_at, bounds));
}

// Buckets a list of dated items into a volume-over-time series. Granularity
// auto-adjusts to the span so a 7-day range shows days and a 1-year range
// shows months, rather than one giant bar or 365 tiny ones.
function reportVolumeSeries(items, bounds){
  const end = bounds.end;
  const start = bounds.start || (items.length ? new Date(Math.min(...items.map(x=>new Date(x.created_at)))) : new Date(end.getTime()-30*86400000));
  const spanDays = Math.max(1, Math.round((end-start)/86400000));
  let unit = 'day', stepDays = 1, count;
  if(spanDays <= 21){ unit='day'; stepDays=1; }
  else if(spanDays <= 120){ unit='week'; stepDays=7; }
  else { unit='month'; stepDays=null; }

  const buckets = [];
  if(unit==='month'){
    const cur = new Date(start.getFullYear(), start.getMonth(), 1);
    const last = new Date(end.getFullYear(), end.getMonth(), 1);
    while(cur <= last){
      const next = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
      buckets.push({ label: cur.toLocaleDateString('en-US',{month:'short',year:'2-digit'}), from: new Date(cur), to: next });
      cur.setMonth(cur.getMonth()+1);
    }
  } else {
    // Align to whole steps ending "now" so the most recent bucket is always current.
    let cur = new Date(end); cur.setHours(0,0,0,0); cur.setDate(cur.getDate()+1); // exclusive end of today
    const steps = Math.ceil(spanDays/stepDays);
    const raw = [];
    for(let i=0;i<steps;i++){
      const to = new Date(cur.getTime() - i*stepDays*86400000);
      const from = new Date(to.getTime() - stepDays*86400000);
      raw.push({ from, to });
    }
    raw.reverse().forEach(r=>{
      buckets.push({
        label: unit==='day'
          ? r.from.toLocaleDateString('en-US',{month:'short',day:'numeric'})
          : r.from.toLocaleDateString('en-US',{month:'short',day:'numeric'}),
        from: r.from, to: r.to
      });
    });
  }

  buckets.forEach(b=>{ b.count = items.filter(x=>{ const d=new Date(x.created_at); return d>=b.from && d<b.to; }).length; });
  return buckets;
}

function exportReportToCSV(){
  const bounds = reportRangeBounds();
  const list = reportFilteredTickets(bounds);
  if(!list.length){ toast('Nothing to export with the current filters', true); return; }
  logApp('export:report', null, null, 'Exported report ('+list.length+' tickets) to CSV');
  const headers = ['Ticket #','Subject','Status','Priority','Source','Category','Tags','Customer Name','Customer Email','Order Number','Assigned To','Created At','Resolved At','Resolution Days'];
  const rows = list.map(t=>{
    const days = t.resolved_at ? ((new Date(t.resolved_at)-new Date(t.created_at))/86400000).toFixed(1) : '';
    return [
      t.ticket_number, t.subject, label(t.status), label(t.priority), label(t.source), t.category||'',
      (t.tags||[]).join('; '), t.customer_name, t.customer_email, t.order_number, t.assigned_to,
      t.created_at, t.resolved_at||'', days
    ];
  });
  const csv = [headers, ...rows].map(row => row.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tgk-report-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
