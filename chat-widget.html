<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TGK Motorsport Chat</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:transparent!important}
:root{
  --teal:#2ABFAA;--teal-dim:#1f9e8c;
  --orange:#E07B28;--orange-hover:#c96a1f;
  --bg:#1b1e21;--bg-head:#0e1012;--bg-card:#26292d;--bg-input:#141618;
  --border:#33373c;--border-soft:#2c3034;
  --text:#f0f2f5;--text2:#c3c9d0;--text3:#8b939c;
  --green:#22c55e;--gray-dot:#6b7280;--red:#ef4444;
  --r:12px;
}
body{position:relative;width:100%;height:100%}

/* ---------- Bubble ---------- */
#bubble{
  position:absolute;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;
  background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);border:none;outline:none;z-index:9999;
  padding:0;line-height:0;transition:transform .15s,background .15s;
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
}
#bubble:focus{outline:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#bubble:hover{transform:scale(1.06);background:var(--orange-hover)}
#bubble svg{display:block;flex-shrink:0;width:22px;height:22px}
#bubbleDot{
  position:absolute;top:1px;right:1px;width:13px;height:13px;border-radius:50%;
  background:var(--gray-dot);border:2px solid #101214;display:none;
}
#bubbleDot.online{background:var(--green);display:block;animation:dotPulse 2.4s ease-out infinite}
#bubbleDot.offline{background:var(--gray-dot);display:block;animation:none}
@keyframes dotPulse{
  0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}
  70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}
  100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}
}
#bubbleBadge{
  position:absolute;top:-4px;left:-6px;min-width:19px;height:19px;border-radius:10px;
  background:var(--red);color:#fff;font-size:11px;font-weight:700;display:none;
  align-items:center;justify-content:center;padding:0 5px;border:2px solid #101214;line-height:1;
}
#bubbleBadge.show{display:flex}

/* ---------- Panel ---------- */
#panel{
  position:absolute;top:16px;left:16px;right:16px;bottom:16px;
  background:var(--bg);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.5);
  display:none;flex-direction:column;overflow:hidden;z-index:9999;border:1px solid var(--border);
}
#panel.open{display:flex}
#panelContent{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ---------- Header ---------- */
.chat-head{
  background:var(--bg-head);color:#fff;padding:13px 16px 12px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-bottom:2px solid var(--orange);
}
.chat-head-brand{display:flex;flex-direction:column;gap:3px;min-width:0}
.chat-head-title{font-weight:800;font-size:14.5px;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head-title .tgk{color:var(--teal);font-style:italic;margin-right:5px}
.chat-status{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--text3)}
.chat-status .sdot{width:8px;height:8px;border-radius:50%;background:var(--gray-dot);flex-shrink:0}
.chat-status.online{color:#7ee2a8}
.chat-status.online .sdot{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,.7)}
.chat-close{cursor:pointer;font-size:15px;color:var(--text3);padding:4px 6px;border-radius:6px;line-height:1;transition:color .15s,background .15s;flex-shrink:0}
.chat-close:hover{color:#fff;background:rgba(255,255,255,.08)}

/* ---------- Messages ---------- */
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.chat-body::-webkit-scrollbar{width:8px}
.chat-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.chat-body::-webkit-scrollbar-track{background:transparent}
.msg-bubble{max-width:82%;padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.45;word-wrap:break-word}
.msg-bubble.customer{align-self:flex-end;background:var(--teal-dim);color:#fff;border-bottom-right-radius:4px}
.msg-bubble.staff{align-self:flex-start;background:var(--bg-card);color:var(--text);border:1px solid var(--border-soft);border-bottom-left-radius:4px}
.msg-time{font-size:10px;margin-top:4px;text-align:right;opacity:.6}
.msg-bubble.staff .msg-time{color:var(--text3);opacity:1}
.msg-date-divider{display:flex;align-items:center;gap:10px;margin:6px 0 2px;color:var(--text3);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.msg-date-divider::before,.msg-date-divider::after{content:'';flex:1;height:1px;background:var(--border-soft)}

/* ---------- Composer ---------- */
.chat-foot{flex-shrink:0;padding:10px;border-top:1px solid var(--border);display:flex;gap:7px;align-items:flex-end;background:var(--bg-head)}
.chat-attach{cursor:pointer;display:flex;align-items:center;justify-content:center;width:34px;height:36px;border-radius:8px;color:var(--text3);transition:color .15s,background .15s;flex-shrink:0}
.chat-attach:hover{color:var(--teal);background:rgba(42,191,170,.08)}
.chat-input{
  flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;
  font-family:inherit;resize:none;background:var(--bg-input);color:var(--text);min-width:0;
}
.chat-input::placeholder{color:var(--text3)}
.chat-input:focus{outline:none;border-color:var(--teal)}
.chat-send{
  background:var(--orange);color:#fff;border:none;border-radius:8px;padding:0 15px;height:36px;
  font-weight:700;cursor:pointer;font-size:12.5px;font-family:inherit;letter-spacing:.4px;
  text-transform:uppercase;transition:background .15s;flex-shrink:0;
}
.chat-send:hover{background:var(--orange-hover)}
#chatAttachPreview{padding:0 10px;display:flex;flex-wrap:wrap;gap:4px;background:var(--bg-head)}
#chatAttachPreview:not(:empty){padding-top:8px}
.attach-chip{font-size:11px;background:var(--bg-card);color:var(--text2);padding:3px 8px;border-radius:6px;border:1px solid var(--border-soft)}
.attach-chip .rm{cursor:pointer;color:var(--red);margin-left:2px}
.attach-chip.err{color:var(--red)}

/* ---------- Pre-chat form ---------- */
.pre-chat{padding:18px 16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.pre-chat-intro{font-size:12.5px;color:var(--text2);line-height:1.5;margin-bottom:2px}
.pre-chat input,.pre-chat textarea{
  padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;
  font-family:inherit;background:var(--bg-input);color:var(--text);
}
.pre-chat input::placeholder,.pre-chat textarea::placeholder{color:var(--text3)}
.pre-chat input:focus,.pre-chat textarea:focus{outline:none;border-color:var(--teal)}
.pre-chat textarea{resize:vertical}
.pre-chat button{
  background:var(--orange);color:#fff;border:none;border-radius:8px;padding:11px;font-weight:700;
  cursor:pointer;font-size:13px;font-family:inherit;letter-spacing:.5px;text-transform:uppercase;
  transition:background .15s;
}
.pre-chat button:hover{background:var(--orange-hover)}
.pre-chat-error{color:var(--red);font-size:12px;min-height:1px}

/* ---------- Offline / loading / ended ---------- */
.offline-box{padding:26px 18px;text-align:center}
.offline-title{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:7px}
.offline-title .sdot{width:8px;height:8px;border-radius:50%;background:var(--gray-dot)}
.offline-box p{font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.55}
.offline-box a{
  display:inline-block;background:var(--orange);color:#fff;text-decoration:none;padding:11px 20px;
  border-radius:8px;font-weight:700;font-size:12.5px;letter-spacing:.5px;text-transform:uppercase;
  transition:background .15s;
}
.offline-box a:hover{background:var(--orange-hover)}
.loading-box{padding:34px 16px;text-align:center;color:var(--text3);font-size:13px}
.ended-box{padding:26px 18px;text-align:center;color:var(--text2);font-size:13px;line-height:1.55}
</style>
</head>
<body>

<button id="bubble" onclick="togglePanel()" aria-label="Open live chat">
  <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
  <span id="bubbleDot"></span>
  <span id="bubbleBadge"></span>
</button>

<div id="panel">
  <div class="chat-head">
    <div class="chat-head-brand">
      <div class="chat-head-title"><span class="tgk">TGK</span>Motorsport</div>
      <div class="chat-status" id="chatStatus"><span class="sdot"></span><span id="chatStatusText">Checking...</span></div>
    </div>
    <span class="chat-close" onclick="togglePanel()">&#10005;</span>
  </div>
  <div id="panelContent"></div>
</div>

<script>
const TGK_CHAT_WIDGET_VERSION = 'v2.2';
const SUPABASE_URL = "https://piamamighqiielfztgic.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYW1hbWlnaHFpaWVsZnp0Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjkxMzUsImV4cCI6MjA5MzQ0NTEzNX0.YwLflTw6F4cRzmY78QoAY6Zud2IHGVP5xL_yvMFxheA";
const SUPPORT_PAGE_URL = "https://contact.tgkmotorsport.com";

let panelOpen = false;
let chatState = null; // null = not started, {ticket_id, session_token, ended}
let pollTimer = null;

// ---------- Availability (online indicator) ----------
// staffOnline: null = unknown (still checking), true/false once known.
// Polled on load and every 60s so the green dot on the bubble is accurate
// even before the visitor ever opens the panel.
let staffOnline = null;
const AVAILABILITY_POLL_MS = 60000;

async function fetchAvailability(){
  try{
    const resp = await fetch(SUPABASE_URL + '/functions/v1/check-chat-availability', {
      headers: { 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY }
    });
    const result = await resp.json();
    staffOnline = !!result.available;
  }catch(e){
    staffOnline = false; // fail closed - never advertise "online" we can't back up
  }
  updateStatusUI();
  return staffOnline;
}

function updateStatusUI(){
  const dot = document.getElementById('bubbleDot');
  if(dot){
    dot.classList.toggle('online', staffOnline === true);
    dot.classList.toggle('offline', staffOnline === false);
  }
  const status = document.getElementById('chatStatus');
  const statusText = document.getElementById('chatStatusText');
  if(status && statusText){
    status.classList.toggle('online', staffOnline === true);
    if(staffOnline === true){
      statusText.textContent = 'Online now';
    }else if(staffOnline === false){
      statusText.textContent = 'Offline - leave a message';
    }else{
      statusText.textContent = 'Checking...';
    }
  }
}

fetchAvailability();
setInterval(fetchAvailability, AVAILABILITY_POLL_MS);

// ---------- Unread badge + notification sound ----------
// Message polling now runs whenever a chat is active, even with the panel
// closed (at a slower cadence), so staff replies surface as an unread badge
// and a soft sound instead of arriving silently.
const POLL_OPEN_MS = 3000;
const POLL_BG_MS = 8000;
let staffMsgSeen = 0;   // staff messages the customer has already seen (persisted with the session)
let lastStaffCount = 0; // staff messages in the thread as of the latest poll
let unreadCount = 0;

function updateUnreadBadge(){
  const badge = document.getElementById('bubbleBadge');
  if(!badge) return;
  badge.textContent = unreadCount > 9 ? '9+' : String(unreadCount);
  badge.classList.toggle('show', unreadCount > 0);
}

function trackUnread(msgs){
  lastStaffCount = msgs.filter(m => m.sender_type !== 'customer').length;
  const prevUnread = unreadCount;
  if(panelOpen && !document.hidden){
    if(staffMsgSeen !== lastStaffCount || unreadCount !== 0){
      staffMsgSeen = lastStaffCount;
      unreadCount = 0;
      if(chatState){ chatState.seen = staffMsgSeen; saveChatSession(chatState); }
    }
  }else{
    unreadCount = Math.max(0, lastStaffCount - staffMsgSeen);
  }
  updateUnreadBadge();
  if(unreadCount > prevUnread) playNotifSound();
}

function markAllRead(){
  staffMsgSeen = Math.max(staffMsgSeen, lastStaffCount);
  unreadCount = 0;
  updateUnreadBadge();
  if(chatState && chatState.seen !== staffMsgSeen){ chatState.seen = staffMsgSeen; saveChatSession(chatState); }
}

// Soft two-tone blip via WebAudio - no sound asset to host, fails silently
// if the browser hasn't unlocked audio yet (autoplay policy).
let _audioCtx = null;
function playNotifSound(){
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(_audioCtx.state === 'suspended') _audioCtx.resume();
    const t = _audioCtx.currentTime;
    [[880, 0], [660, 0.12]].forEach(pair => {
      const o = _audioCtx.createOscillator();
      const g = _audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = pair[0];
      g.gain.setValueAtTime(0.0001, t + pair[1]);
      g.gain.exponentialRampToValueAtTime(0.12, t + pair[1] + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + pair[1] + 0.18);
      o.connect(g); g.connect(_audioCtx.destination);
      o.start(t + pair[1]); o.stop(t + pair[1] + 0.2);
    });
  }catch(e){ /* audio unavailable - non-critical */ }
}

// ---------- Timestamp formatting ----------
function fmtMsgTime(d){
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}
function fmtMsgDate(d){
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate() - 1);
  if(d.toDateString() === today.toDateString()) return 'Today';
  if(d.toDateString() === yest.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

// ---------- Session persistence ----------
const CHAT_STORAGE_KEY = 'tgk_chat_session';

function saveChatSession(state){
  try{ localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* storage may be blocked — chat still works, just won't persist */ }
}
function loadChatSession(){
  try{
    const raw = localStorage.getItem(CHAT_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearChatSession(){
  try{ localStorage.removeItem(CHAT_STORAGE_KEY); }catch(e){ /* non-critical */ }
}

// On load, silently check for an existing session so reopening the widget
// (or navigating to a new page) resumes the same chat instead of starting
// a fresh one. Doesn't force the panel open — just gets it ready.
(function restoreSessionOnLoad(){
  const saved = loadChatSession();
  if(saved && saved.ticket_id && saved.session_token){
    chatState = saved;
    staffMsgSeen = saved.seen || 0;
    startPolling(); // background cadence - keeps the unread badge live across page loads
  }
})();

function togglePanel(){
  panelOpen = !panelOpen;
  document.getElementById('panel').classList.toggle('open', panelOpen);
  notifyParentSize();
  if(panelOpen){
    if(chatState){
      renderChatWindow();
      markAllRead();
      startPolling();
    } else {
      checkAvailabilityAndRender();
    }
  } else if(chatState){
    startPolling(); // drop to background cadence while collapsed
  }
}

function notifyParentSize(){
  try{
    window.parent.postMessage({
      source: 'TGK_CHAT_WIDGET',
      type: 'RESIZE',
      collapsed: !panelOpen
    }, '*');
  }catch(e){ /* non-critical */ }
}

// Tell the parent our size immediately on load too, in case it starts collapsed
window.addEventListener('load', notifyParentSize);

async function checkAvailabilityAndRender(){
  const content = document.getElementById('panelContent');
  content.innerHTML = '<div class="loading-box">Checking availability...</div>';
  const available = await fetchAvailability();
  if(available){
    renderPreChatForm();
  }else{
    renderOffline();
  }
}

function renderOffline(){
  document.getElementById('panelContent').innerHTML = `
    <div class="offline-box">
      <div class="offline-title"><span class="sdot"></span>We're offline right now</div>
      <p>Submit a support ticket and our team will follow up by email as soon as we're back.</p>
      <a href="${SUPPORT_PAGE_URL}" target="_blank">Go to Support Page</a>
    </div>
  `;
}

function renderPreChatForm(){
  document.getElementById('panelContent').innerHTML = `
    <div class="pre-chat">
      <div class="pre-chat-intro">Our team is online and ready to help with parts, fitment, and orders.</div>
      <input id="preChatName" placeholder="Your name">
      <input id="preChatEmail" type="email" placeholder="Your email">
      <textarea id="preChatMessage" rows="3" placeholder="What can we help with?"></textarea>
      <div id="preChatError" class="pre-chat-error"></div>
      <button onclick="startChat()">Start Chat</button>
    </div>
  `;
}

async function startChat(){
  const name = document.getElementById('preChatName').value.trim();
  const email = document.getElementById('preChatEmail').value.trim();
  const message = document.getElementById('preChatMessage').value.trim();
  const errBox = document.getElementById('preChatError');
  if(!name || !email || !message){
    errBox.textContent = 'Please fill in all fields.';
    return;
  }
  errBox.textContent = '';
  try{
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/start-chat-session`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ name, email, message })
    });
    const result = await resp.json();
    if(!resp.ok || result.error) throw new Error(result.error || 'Could not start chat');

    chatState = { ticket_id: result.ticket_id, session_token: result.session_token, ended: false, seen: 0 };
    staffMsgSeen = 0; lastStaffCount = 0; unreadCount = 0; updateUnreadBadge();
    saveChatSession(chatState);
    renderChatWindow();
    startPolling();
  }catch(e){
    errBox.textContent = 'Something went wrong — please try again.';
  }
}

let pendingChatAttachments = [];

function renderChatWindow(){
  document.getElementById('panelContent').innerHTML = `
    <div class="chat-body" id="chatBody"></div>
    <div id="chatAttachPreview"></div>
    <div class="chat-foot">
      <label class="chat-attach" title="Attach a photo">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        <input type="file" id="chatFileInput" accept="image/*,.pdf" style="display:none" onchange="handleChatFileSelect(this)">
      </label>
      <textarea class="chat-input" id="chatInput" rows="1" placeholder="Type a message..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMsg();}"></textarea>
      <button class="chat-send" onclick="sendChatMsg()">Send</button>
    </div>
  `;
}

async function handleChatFileSelect(input){
  const files = Array.from(input.files||[]);
  if(!files.length) return;
  const preview = document.getElementById('chatAttachPreview');
  for(const file of files){
    const chipId = 'catt_' + Math.random().toString(36).slice(2);
    preview.insertAdjacentHTML('beforeend', `<span class="attach-chip" id="${chipId}">Uploading...</span>`);
    try{
      const path = `${Date.now()}_${Math.random().toString(36).slice(2)}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
      const upResp = await fetch(`${SUPABASE_URL}/storage/v1/object/ticket-attachments/${path}`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'apikey': SUPABASE_ANON_KEY,
          'Content-Type': file.type || 'application/octet-stream'
        },
        body: file
      });
      if(!upResp.ok) throw new Error('Upload failed');
      const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/ticket-attachments/${path}`;
      pendingChatAttachments.push({ name: file.name, url: publicUrl });
      const chip = document.getElementById(chipId);
      if(chip) chip.outerHTML = `<span class="attach-chip">${escapeHtml(file.name)} <span class="rm" onclick="removePendingChatAttachment('${publicUrl}', this.parentElement)">&#10005;</span></span>`;
    }catch(e){
      const chip = document.getElementById(chipId);
      if(chip) chip.outerHTML = `<span class="attach-chip err">Failed: ${escapeHtml(file.name)}</span>`;
    }
  }
  input.value = '';
}
window.handleChatFileSelect = handleChatFileSelect;

function removePendingChatAttachment(url, chipEl){
  pendingChatAttachments = pendingChatAttachments.filter(a=>a.url!==url);
  if(chipEl) chipEl.remove();
}
window.removePendingChatAttachment = removePendingChatAttachment;

function renderMessages(messages){
  const body = document.getElementById('chatBody');
  if(!body) return;
  let html = '';
  let lastDay = '';
  for(const m of messages){
    const ts = m.created_at || m.sent_at || m.timestamp || null;
    const d = ts ? new Date(ts) : null;
    const valid = !!(d && !isNaN(d.getTime()));
    if(valid){
      const dayKey = d.toDateString();
      if(dayKey !== lastDay){
        html += '<div class="msg-date-divider"><span>' + fmtMsgDate(d) + '</span></div>';
        lastDay = dayKey;
      }
    }
    const atts = (m.attachments||[]).map(a => {
      const isImg = /\.(png|jpe?g|gif|webp)$/i.test(a.url||a.name||'');
      return isImg
        ? '<div style="margin-top:6px"><a href="' + a.url + '" target="_blank"><img src="' + a.url + '" style="max-width:100%;border-radius:6px;display:block"></a></div>'
        : '<div style="margin-top:6px"><a href="' + a.url + '" target="_blank" style="color:inherit;text-decoration:underline;font-size:12px">' + escapeHtml(a.name || 'attachment') + '</a></div>';
    }).join('');
    html += '<div class="msg-bubble ' + (m.sender_type === 'customer' ? 'customer' : 'staff') + '">'
      + (m.body ? escapeHtml(m.body) : '')
      + atts
      + (valid ? '<div class="msg-time">' + fmtMsgTime(d) + '</div>' : '')
      + '</div>';
  }
  body.innerHTML = html;
  body.scrollTop = body.scrollHeight;
}

function renderEnded(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = null;
  unreadCount = 0;
  updateUnreadBadge();
  document.getElementById('panelContent').innerHTML = `
    <div class="ended-box">This chat has ended. Thanks for reaching out! If you need anything else, feel free to start a new chat.</div>
  `;
  chatState = null;
  clearChatSession();
}

async function sendChatMsg(){
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if((!message && !pendingChatAttachments.length) || !chatState) return;
  input.value = '';
  const attachments = pendingChatAttachments;
  pendingChatAttachments = [];
  const preview = document.getElementById('chatAttachPreview');
  if(preview) preview.innerHTML = '';
  try{
    await fetch(`${SUPABASE_URL}/functions/v1/send-chat-message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ ticket_id: chatState.ticket_id, session_token: chatState.session_token, message: message || '(attachment)', attachments })
    });
    pollMessages();
  }catch(e){ /* will retry on next poll */ }
}

async function pollMessages(){
  if(!chatState) return;
  try{
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/get-chat-messages?ticket_id=${chatState.ticket_id}&session_token=${chatState.session_token}`, {
      headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY }
    });
    const result = await resp.json();
    if(!result.ok) return;
    if(result.ended){ renderEnded(); return; }
    const msgs = result.messages || [];
    renderMessages(msgs);
    trackUnread(msgs);
  }catch(e){ /* silent — will retry */ }
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer); // never stack intervals across open/close cycles
  pollMessages();
  pollTimer = setInterval(pollMessages, panelOpen ? POLL_OPEN_MS : POLL_BG_MS);
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
